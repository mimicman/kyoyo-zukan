<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- ピラミッド：石を積み上げ、重さは下の石から地面へ。王の間の上は梁を重ね、山形の石で重さをそらす -->
  <text x="16" y="24" class="t-m ink">積み上げた石が、重さを真下へ流す</text>
  <path d="M130 44 L240 236 H20 Z" class="tint"/>
  <path d="M122.0 58 H138.0 M114.0 72 H146.0 M105.9 86 H154.1 M97.9 100 H162.1 M89.9 114 H170.1 M81.9 128 H178.1 M73.9 142 H186.1 M65.8 156 H194.2 M57.8 170 H202.2 M49.8 184 H210.2 M41.8 198 H218.2 M33.8 212 H226.2 M25.7 226 H234.3" class="st-line" stroke-width="1"/>
  <path d="M130 44 L240 236 H20 Z" class="st" stroke-width="1.5"/>
  <!-- 重さの流れ -->
  <path d="M76 176 V222" class="st-soft" stroke-width="2" marker-end="url(#a-soft)"/>
  <path d="M184 176 V222" class="st-soft" stroke-width="2" marker-end="url(#a-soft)"/>
  <!-- 王の間と重量軽減の間 -->
  <path d="M110 124 L132 106 L154 124" class="st-f" stroke-width="3"/>
  <g class="fl"><rect x="114" y="128" width="36" height="3"/><rect x="114" y="135" width="36" height="3"/><rect x="114" y="142" width="36" height="3"/><rect x="114" y="149" width="36" height="3"/><rect x="114" y="156" width="36" height="3"/></g>
  <rect x="114" y="160" width="36" height="16" class="paper"/>
  <rect x="114" y="160" width="36" height="16" class="st" stroke-width="1.2"/>
  <path d="M126 98 L104 120" class="st-f" stroke-width="2" marker-end="url(#a-architecture)"/>
  <path d="M138 98 L160 120" class="st-f" stroke-width="2" marker-end="url(#a-architecture)"/>
  <path d="M20 236 H244" class="st" stroke-width="2"/>
  <!-- 説明 -->
  <text x="252" y="70" class="t-s ink" font-weight="700">① 石を積む</text>
  <text x="252" y="88" class="t-xs soft">重さは下の石へ、</text>
  <text x="252" y="102" class="t-xs soft">そして地面へ</text>
  <text x="252" y="136" class="t-s ink" font-weight="700">② 部屋の上</text>
  <text x="252" y="154" class="t-xs soft">石の梁を重ね、</text>
  <text x="252" y="168" class="t-xs soft">山形の石で重さを</text>
  <text x="252" y="182" class="t-xs soft">左右へそらす</text>
  <path d="M150 168 L246 208" class="st-soft" stroke-width="1"/>
  <text x="252" y="212" class="t-s ink" font-weight="700">王の間</text>
  <text x="180" y="262" class="t-s mid ink">ほとんどが石。中の部屋はとても小さい</text>
</svg>
