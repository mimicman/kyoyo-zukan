<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 同じ木組みの技から、目的の違う3つの建物 -->
  <g class="t-s mid fl" font-weight="700">
    <text x="62" y="22">祈る</text>
    <text x="180" y="22">守る</text>
    <text x="298" y="22">もてなす</text>
  </g>

  <!-- 寺：大きな反った屋根と深い軒 -->
  <path d="M8 104 Q62 70 116 104 L104 100 Q62 78 20 100Z" class="ink"/>
  <path d="M20 100 Q62 78 104 100 L96 112 H28Z" class="soft"/>
  <path d="M30 112 H94 V122 H30Z" class="tint"/>
  <g class="st" stroke-width="3"><path d="M36 122 V176 M52 122 V176 M72 122 V176 M88 122 V176"/></g>
  <rect x="22" y="176" width="80" height="8" class="soft"/>
  <path d="M10 106 V138" class="st-f dash" stroke-width="1.5"/>
  <text x="10" y="70" class="t-xs fl">深い軒</text><path d="M24 74 L14 98" class="st-f" stroke-width="1.2"/>

  <!-- 城：石垣と層になった天守 -->
  <path d="M132 184 L144 132 H216 L228 184Z" class="soft"/>
  <path d="M138 160 H222 M141 146 H219 M135 172 H225" class="st-line" stroke-width="1"/>
  <rect x="150" y="104" width="60" height="28" class="paper"/>
  <rect x="150" y="104" width="60" height="28" class="st" stroke-width="1.5" fill="none"/>
  <path d="M142 106 L156 94 H204 L218 106Z" class="ink"/>
  <rect x="160" y="74" width="40" height="20" class="paper"/>
  <rect x="160" y="74" width="40" height="20" class="st" stroke-width="1.5" fill="none"/>
  <path d="M152 76 L166 60 H194 L208 76Z" class="ink"/>
  <rect x="170" y="46" width="20" height="14" class="paper"/>
  <rect x="170" y="46" width="20" height="14" class="st" stroke-width="1.5" fill="none"/>
  <path d="M164 48 L180 36 L196 48Z" class="ink"/>
  <text x="180" y="166" class="t-xs mid paper">石垣</text>

  <!-- 茶室：小さく素朴 -->
  <path d="M266 150 L298 128 L330 150Z" class="soft"/>
  <rect x="272" y="150" width="52" height="34" class="tint"/>
  <rect x="272" y="150" width="52" height="34" class="st" stroke-width="1.5" fill="none"/>
  <rect x="282" y="168" width="12" height="12" class="ink"/>
  <path d="M304 158 H316 V170 H304Z M310 158 V170" class="st" stroke-width="1"/>
  <text x="288" y="198" class="t-xs mid soft">にじり口</text>

  <!-- 地面と共通の土台 -->
  <path d="M8 186 H352" class="st-soft" stroke-width="2"/>
  <g class="t-xs mid soft">
    <text x="62" y="214">寺社 7世紀〜</text>
    <text x="180" y="214">城 16〜17世紀</text>
    <text x="298" y="214">茶室 16世紀〜</text>
  </g>
  <path d="M214 132 C240 116 256 116 268 132" class="st dash" stroke-width="1.5" fill="none"/>
  <text x="240" y="108" class="t-xs mid ink halo">大 ⇔ 小</text>
  <rect x="12" y="228" width="336" height="40" rx="12" class="fl"/>
  <text x="180" y="246" class="t-s mid on" font-weight="700">共通の土台：木を組む技</text>
  <text x="180" y="261" class="t-xs mid on">雨と湿気の多い気候の中で受け継がれた</text>
</svg>
