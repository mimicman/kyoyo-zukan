<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 同じ木組みの技から、目的の違う4つの建物：祈る寺社・守る城・迎える書院・もてなす茶室 -->
  <g class="t-s mid fl" font-weight="700">
    <text x="48" y="22">祈る</text>
    <text x="136" y="22">守る</text>
    <text x="224" y="22">迎える</text>
    <text x="312" y="22">もてなす</text>
  </g>

  <!-- 寺：大きな反った屋根と深い軒 -->
  <path d="M6 110 Q48 82 90 110 L80 106 Q48 88 16 106Z" class="ink"/>
  <path d="M16 106 Q48 88 80 106 L74 116 H22Z" class="soft"/>
  <rect x="24" y="116" width="48" height="8" class="tint"/>
  <path d="M28 124 V176 M42 124 V176 M54 124 V176 M68 124 V176" class="st" stroke-width="3"/>
  <rect x="18" y="176" width="60" height="8" class="soft"/>
  <text x="48" y="76" class="t-xs mid soft">深い軒</text>

  <!-- 城：石垣と層になった天守 -->
  <path d="M96 184 L106 140 H166 L176 184Z" class="soft"/>
  <path d="M101 162 H171 M104 150 H168 M98 174 H174" class="st-line" stroke-width="1"/>
  <rect x="112" y="114" width="48" height="26" class="paper"/>
  <rect x="112" y="114" width="48" height="26" class="st" stroke-width="1.5"/>
  <path d="M104 116 L116 104 H156 L168 116Z" class="ink"/>
  <rect x="120" y="86" width="32" height="18" class="paper"/>
  <rect x="120" y="86" width="32" height="18" class="st" stroke-width="1.5"/>
  <path d="M114 88 L126 74 H146 L158 88Z" class="ink"/>
  <path d="M126 76 L136 62 L146 76Z" class="ink"/>

  <!-- 書院：床の間・違い棚・畳 -->
  <rect x="186" y="100" width="76" height="70" class="paper"/>
  <path d="M186 100 H262 V170 H186 Z M186 110 H262" class="st" stroke-width="1.5"/>
  <rect x="190" y="114" width="30" height="50" class="bgc"/>
  <rect x="200" y="118" width="10" height="36" class="st" stroke-width="1"/>
  <path d="M222 110 V170" class="st" stroke-width="3"/>
  <rect x="228" y="134" width="14" height="3" class="ink"/>
  <rect x="240" y="128" width="14" height="3" class="ink"/>
  <path d="M182 170 H266 L272 184 H176 Z" class="tint"/>
  <path d="M182 170 H266 L272 184 H176 Z M224 170 V184" class="st-soft" stroke-width="1"/>

  <!-- 茶室：小さく素朴 -->
  <path d="M284 150 L312 130 L340 150Z" class="soft"/>
  <rect x="290" y="150" width="44" height="34" class="tint"/>
  <rect x="290" y="150" width="44" height="34" class="st" stroke-width="1.5"/>
  <rect x="298" y="168" width="11" height="11" class="ink"/>
  <path d="M316 158 H328 V170 H316Z M322 158 V170" class="st" stroke-width="1"/>

  <!-- 地面と時代 -->
  <path d="M6 186 H354" class="st-soft" stroke-width="2"/>
  <g class="t-xs mid ink" font-weight="700"><text x="48" y="204">寺社</text><text x="136" y="204">城</text><text x="224" y="204">書院造</text><text x="312" y="204">茶室</text></g>
  <g class="t-xs mid soft"><text x="48" y="218">7世紀〜</text><text x="136" y="218">16〜17世紀</text><text x="224" y="218">15世紀〜</text><text x="312" y="218">16世紀〜</text></g>
  <rect x="12" y="230" width="336" height="40" rx="12" class="fl"/>
  <text x="180" y="248" class="t-s mid on" font-weight="700">共通の土台：木を組む技</text>
  <text x="180" y="263" class="t-xs mid on">雨と湿気の多い気候の中で受け継がれた</text>
</svg>
