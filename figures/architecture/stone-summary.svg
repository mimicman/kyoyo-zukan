<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 重さを流す3つの方法（上：積む・架ける・押し合う）と、それを使った古代の建築（下） -->
  <g class="t-m mid" font-weight="700">
    <text x="62" y="22" class="ink">積む</text>
    <text x="180" y="22" class="ink">柱と梁</text>
    <text x="298" y="22" class="fl">アーチ</text>
  </g>
  <path d="M121 10 V250 M239 10 V250" class="st-line dash" stroke-width="1"/>

  <!-- 積む：石の段 -->
  <path d="M62 30 V42" class="st" stroke-width="2.5" marker-end="url(#a-ink)"/>
  <g class="tint"><rect x="34" y="96" width="56" height="12"/><rect x="40" y="84" width="44" height="12"/><rect x="46" y="72" width="32" height="12"/><rect x="52" y="60" width="20" height="12"/><rect x="57" y="48" width="10" height="12"/></g>
  <path d="M34 96 h56 v12 h-56 Z M40 84 h44 v12 h-44 Z M46 72 h32 v12 h-32 Z M52 60 h20 v12 h-20 Z M57 48 h10 v12 h-10 Z" class="st-soft" stroke-width="1"/>
  <text x="62" y="124" class="t-xs mid soft">真下へ押しつける</text>

  <!-- 柱と梁：真ん中がたわむ -->
  <path d="M180 30 V44" class="st" stroke-width="2.5" marker-end="url(#a-ink)"/>
  <rect x="140" y="48" width="80" height="12" class="tint"/>
  <rect x="140" y="48" width="80" height="12" class="st-soft" stroke-width="1.5"/>
  <path d="M144 64 Q180 80 216 64" class="st-f dash" stroke-width="1.5"/>
  <rect x="146" y="60" width="10" height="48" class="st" stroke-width="2"/>
  <rect x="204" y="60" width="10" height="48" class="st" stroke-width="2"/>
  <text x="180" y="98" class="t-xs mid fl">たわむ</text>
  <text x="180" y="124" class="t-xs mid soft">柱の間は狭い</text>

  <!-- アーチ：押し合って両脚へ -->
  <path d="M298 30 V40" class="st" stroke-width="2.5" marker-end="url(#a-ink)"/>
  <path d="M260 108 V80 A38 38 0 0 1 336 80 V108 H323 V80 A25 25 0 0 0 273 80 V108Z" class="tint"/>
  <path d="M260 108 V80 A38 38 0 0 1 336 80 V108 H323 V80 A25 25 0 0 0 273 80 V108Z" class="st" stroke-width="2"/>
  <path d="M292 46 C276 52 268 62 267 88 V104" class="st-f" stroke-width="2" marker-end="url(#a-architecture)"/>
  <path d="M304 46 C320 52 328 62 329 88 V104" class="st-f" stroke-width="2" marker-end="url(#a-architecture)"/>
  <text x="298" y="124" class="t-xs mid soft">石が押し合う</text>

  <path d="M62 132 V146" class="st-soft" stroke-width="2" marker-end="url(#a-soft)"/>
  <path d="M180 132 V146" class="st-soft" stroke-width="2" marker-end="url(#a-soft)"/>
  <path d="M298 132 V146" class="st-soft" stroke-width="2" marker-end="url(#a-soft)"/>

  <!-- ピラミッド -->
  <path d="M62 160 L104 222 H20 Z" class="fl"/>
  <rect x="56" y="196" width="12" height="6" class="paper"/>
  <!-- ギリシャ神殿 -->
  <path d="M132 176 L180 160 L228 176Z" class="fl"/>
  <rect x="132" y="176" width="96" height="7" class="soft"/>
  <path d="M140 185 V216 M156 185 V216 M172 185 V216 M188 185 V216 M204 185 V216 M220 185 V216" class="st" stroke-width="4"/>
  <rect x="128" y="216" width="104" height="6" class="soft"/>
  <!-- ローマのドーム -->
  <path d="M264 192 A34 34 0 0 1 332 192Z" class="fl"/>
  <rect x="260" y="192" width="76" height="30" class="tint"/>
  <rect x="260" y="192" width="76" height="30" class="st-soft" stroke-width="1.5"/>
  <path d="M290 222 V206 A8 8 0 0 1 306 206 V222" class="st" stroke-width="2"/>

  <g class="t-s mid ink" font-weight="700"><text x="62" y="240">エジプト</text><text x="180" y="240">ギリシャ</text><text x="298" y="240">ローマ</text></g>
  <path d="M30 256 H330" class="st-f" stroke-width="2" marker-end="url(#a-architecture)"/>
  <text x="180" y="274" class="t-xs mid ink">積む → 架ける → 押し合う：中の空間が広くなる</text>
</svg>
