<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 書院造：座敷の正面に床の間・違い棚・付書院が並び、床は畳を敷きつめる -->
  <text x="16" y="24" class="t-m ink">床の間・違い棚・付書院が並ぶ座敷</text>

  <!-- 壁と長押 -->
  <rect x="16" y="44" width="328" height="166" class="paper"/>
  <path d="M16 44 H344 V210 H16 Z" class="st-soft" stroke-width="1"/>
  <path d="M16 64 H344" class="st" stroke-width="3"/>

  <!-- 床の間 -->
  <rect x="24" y="72" width="98" height="126" class="bgc"/>
  <rect x="24" y="196" width="98" height="8" class="soft"/>
  <rect x="62" y="80" width="22" height="96" class="paper"/>
  <rect x="62" y="80" width="22" height="96" class="st" stroke-width="1.2"/>
  <path d="M68 100 C74 116 70 134 78 150" class="st-soft" stroke-width="2"/>
  <path d="M100 196 V182 Q104 172 108 182 V196 Z" class="soft"/>
  <path d="M106 176 L112 160 M104 176 L98 164" class="st-f" stroke-width="1.5"/>
  <!-- 床柱 -->
  <path d="M126 64 V210" class="st" stroke-width="5"/>

  <!-- 違い棚（天袋・棚・地袋） -->
  <rect x="134" y="72" width="78" height="22" class="tint"/>
  <path d="M134 72 H212 V94 H134 Z M173 72 V94" class="st" stroke-width="1"/>
  <rect x="136" y="128" width="40" height="5" class="ink"/>
  <rect x="170" y="116" width="40" height="5" class="ink"/>
  <path d="M174 121 V128" class="st" stroke-width="2"/>
  <rect x="134" y="176" width="78" height="26" class="tint"/>
  <path d="M134 176 H212 V202 H134 Z M173 176 V202" class="st" stroke-width="1"/>
  <path d="M216 64 V210" class="st" stroke-width="3"/>

  <!-- 付書院（障子の窓と机の板） -->
  <rect x="232" y="92" width="96" height="76" class="paper"/>
  <path d="M232 92 H328 V168 H232 Z M256 92 V168 M280 92 V168 M304 92 V168 M232 111 H328 M232 130 H328 M232 149 H328" class="st-soft" stroke-width="1"/>
  <path d="M232 92 H328 V168 H232 Z" class="st" stroke-width="1.5"/>
  <rect x="226" y="168" width="108" height="10" class="soft"/>

  <!-- 畳 -->
  <path d="M16 210 H344 L356 250 H4 Z" class="tint"/>
  <path d="M16 210 H344 L356 250 H4 Z M10 230 H350 M120 210 L116 250 M230 210 L234 250" class="st-soft" stroke-width="1"/>
  <text x="180" y="244" class="t-xs mid ink halo">畳を敷きつめる</text>

  <!-- 名前 -->
  <g class="t-s mid ink" font-weight="700">
    <text x="73" y="270">床の間</text>
    <text x="173" y="270">違い棚</text>
    <text x="280" y="270">付書院</text>
  </g>
</svg>
