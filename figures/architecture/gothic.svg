<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- 大聖堂の断面（中央の高い身廊と、両わきの側廊） -->
  <!-- 屋根と尖頭アーチの天井 -->
  <path d="M100 76 L130 16 L160 76" class="st" stroke-width="2" stroke-linejoin="round"/>
  <path d="M106 80 Q106 46 130 34 Q154 46 154 80" class="tint"/>
  <path d="M106 80 Q106 46 130 34 Q154 46 154 80" class="st-f" stroke-width="2"/>
  <!-- 身廊の壁と大きな窓 -->
  <path d="M106 80 V240 M154 80 V240" class="st" stroke-width="3"/>
  <path d="M116 168 V112 Q116 92 130 84 Q144 92 144 112 V168Z" class="tint"/>
  <path d="M116 168 V112 Q116 92 130 84 Q144 92 144 112 V168Z" class="st-soft" stroke-width="1.5"/>
  <path d="M130 86 V168 M116 128 H144 M116 148 H144" class="st-soft" stroke-width="1"/>
  <circle cx="130" cy="106" r="6" class="fl"/>
  <!-- 側廊 -->
  <path d="M76 176 Q76 158 91 150 Q106 158 106 176 M154 176 Q154 158 169 150 Q184 158 184 176" class="st-soft" stroke-width="1.5"/>
  <path d="M72 168 L106 150 M188 168 L154 150" class="st" stroke-width="2"/>
  <path d="M76 176 V240 M184 176 V240" class="st" stroke-width="2.5"/>
  <!-- 控え壁 -->
  <rect x="42" y="104" width="18" height="136" class="soft"/>
  <rect x="200" y="104" width="18" height="136" class="soft"/>
  <path d="M42 104 L51 88 L60 104Z M200 104 L209 88 L218 104Z" class="soft"/>
  <!-- 飛梁（外から壁を支える腕） -->
  <path d="M60 114 Q82 92 106 90" class="st" stroke-width="5" stroke-linecap="round"/>
  <path d="M60 132 Q84 114 106 112" class="st" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 114 Q178 92 154 90" class="st" stroke-width="5" stroke-linecap="round"/>
  <path d="M200 132 Q176 114 154 112" class="st" stroke-width="3" stroke-linecap="round"/>
  <!-- 力の流れ（天井が壁を外へ押す → 飛梁 → 控え壁 → 地面） -->
  <path d="M104 74 Q76 80 51 104 V232" class="st" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a-ink)"/>
  <text x="24" y="70" class="t-xs ink halo" font-weight="700">力の流れ</text>
  <path d="M8 242 H222" class="st-soft" stroke-width="2"/>
  <text x="130" y="200" class="t-xs mid ink">身廊</text>
  <text x="91" y="258" class="t-xs mid soft">側廊</text>
  <text x="169" y="258" class="t-xs mid soft">側廊</text>

  <!-- 右の注記 -->
  <path d="M146 46 L228 40" class="st-soft" stroke-width="1"/>
  <text x="232" y="38" class="t-xs ink" font-weight="700">尖頭アーチの天井</text>
  <text x="232" y="52" class="t-xs soft">高く、細く</text>
  <path d="M144 120 L228 104" class="st-soft" stroke-width="1"/>
  <text x="232" y="102" class="t-xs ink" font-weight="700">大きな窓</text>
  <text x="232" y="116" class="t-xs soft">ステンドグラスで</text>
  <text x="232" y="130" class="t-xs soft">光の物語を</text>
  <path d="M188 104 L228 160" class="st-soft" stroke-width="1"/>
  <text x="232" y="164" class="t-xs fl" font-weight="700">飛梁</text>
  <text x="232" y="178" class="t-xs soft">壁を外から支える腕</text>
  <path d="M218 214 L228 214" class="st-soft" stroke-width="1"/>
  <text x="232" y="212" class="t-xs ink" font-weight="700">控え壁</text>
  <text x="232" y="226" class="t-xs soft">力を地面へ流す</text>

  <!-- 下：アーチの形の比較 -->
  <rect x="8" y="270" width="344" height="44" rx="10" class="bgc"/>
  <path d="M22 306 V292 A16 16 0 0 1 54 292 V306" class="st-soft" stroke-width="2"/>
  <path d="M22 294 L12 300" class="st-soft" stroke-width="1.5" marker-end="url(#a-soft)"/>
  <path d="M54 294 L64 300" class="st-soft" stroke-width="1.5" marker-end="url(#a-soft)"/>
  <text x="72" y="288" class="t-xs ink" font-weight="700">半円アーチ</text>
  <text x="72" y="302" class="t-xs soft">横に強く押す</text>
  <path d="M190 306 V292 Q190 280 206 274 Q222 280 222 292 V306" class="st-f" stroke-width="2"/>
  <path d="M192 294 V308" class="st-f" stroke-width="1.5" marker-end="url(#a-architecture)"/>
  <path d="M220 294 V308" class="st-f" stroke-width="1.5" marker-end="url(#a-architecture)"/>
  <text x="234" y="288" class="t-xs fl" font-weight="700">尖頭アーチ</text>
  <text x="234" y="302" class="t-xs soft">下へ押す・高くできる</text>
</svg>
