  <rect x="296" y="251" width="14" height="10" class="fl" opacity="0.35"/>
  <text x="318" y="210" class="t-xs fl">縞が</text>
  <text x="318" y="226" class="t-xs fl">できる</text>

  <text x="144" y="286" class="t-xs mid soft">すき間2つ</text>
