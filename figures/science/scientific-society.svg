<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 学会と論文：以前は発見を秘密にしたり手紙で伝えるだけ。17世紀後半から、見せる・公開する・確かめ直す輪が回り始めた -->
  <text x="12" y="22" class="t-m ink">発見を公開し、仲間が確かめる</text>

  <!-- 左：以前 -->
  <rect x="12" y="40" width="108" height="190" rx="10" class="bgc"/>
  <rect x="12" y="40" width="108" height="190" rx="10" class="st-soft dash" stroke-width="1.2"/>
  <text x="66" y="62" class="t-s mid soft" font-weight="700">以前</text>
  <!-- 錠前 -->
  <rect x="52" y="90" width="28" height="22" rx="4" class="soft"/>
  <path d="M58 90 v-7 a8 8 0 0 1 16 0 v7" class="st-soft" stroke-width="2.5"/>
  <text x="66" y="132" class="t-xs mid ink">発見は秘密に</text>
  <!-- 封筒 -->
  <rect x="48" y="156" width="36" height="24" rx="2" class="paper"/>
  <rect x="48" y="156" width="36" height="24" rx="2" class="st-soft" stroke-width="1.5"/>
  <path d="M48 156 L66 170 L84 156" class="st-soft" stroke-width="1.5"/>
  <text x="66" y="200" class="t-xs mid ink">手紙で知人だけに</text>
  <text x="66" y="216" class="t-xs mid soft">（個人の仕事）</text>

  <path d="M122 135 H134" class="st-f" stroke-width="2" marker-end="url(#a-science)"/>

  <!-- 右：確かめ合う輪 -->
  <rect x="140" y="48" width="96" height="32" rx="8" class="tint"/>
  <text x="188" y="69" class="t-xs mid ink" font-weight="700">① 実験・観察</text>
  <rect x="252" y="48" width="96" height="32" rx="8" class="fl"/>
  <text x="300" y="69" class="t-xs mid on" font-weight="700">② 学会で見せる</text>
  <rect x="252" y="190" width="96" height="32" rx="8" class="fl"/>
  <text x="300" y="211" class="t-xs mid on" font-weight="700">③ 論文で公開</text>
  <rect x="140" y="190" width="96" height="32" rx="8" class="tint"/>
  <text x="188" y="211" class="t-xs mid ink" font-weight="700">④ 追試で確かめる</text>

  <path d="M238 64 H248" class="st-f" stroke-width="2" marker-end="url(#a-science)"/>
  <path d="M300 82 V186" class="st-f" stroke-width="2" marker-end="url(#a-science)"/>
  <path d="M250 206 H240" class="st-f" stroke-width="2" marker-end="url(#a-science)"/>
  <path d="M188 188 V84" class="st-f" stroke-width="2" marker-end="url(#a-science)"/>

  <text x="244" y="122" class="t-xs mid soft">1660</text>
  <text x="244" y="137" class="t-xs mid ink">王立協会</text>
  <text x="244" y="160" class="t-xs mid soft">1665</text>
  <text x="244" y="175" class="t-xs mid ink">学術雑誌</text>

  <text x="244" y="246" class="t-xs mid fl" font-weight="700">正しければ残り、誤りは直される</text>
  <text x="180" y="270" class="t-xs mid soft">いまの「論文が専門誌に載る」も、この輪の続き</text>
</svg>
