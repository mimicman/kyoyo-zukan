<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 19世紀の4つの流れ：熱・電気と磁気・地球・生命を、1800〜1900年の時間軸に並べる。地球の古さが進化論の土台になった -->
  <text x="12" y="22" class="t-m ink">19世紀、4つの分野で大発見</text>
  <text x="348" y="22" class="t-xs end soft">背景：産業革命</text>
<rect x="8" y="34" width="344" height="44" rx="10" class="tint"/>
<text x="16" y="53" class="t-s ink" font-weight="700">熱</text>
<text x="16" y="69" class="t-xs soft">保存と散らばり</text>
<path d="M96 57 H342" class="st-soft" stroke-width="1.5" marker-end="url(#a-soft)"/>
<circle cx="156" cy="57" r="4.5" class="fl"/><text x="151" y="48" class="t-xs mid ink">カルノー</text><text x="156" y="73" class="t-xs mid soft">1824</text>
<circle cx="203" cy="57" r="4.5" class="fl"/><text x="199" y="48" class="t-xs mid ink">ジュール</text><text x="203" y="73" class="t-xs mid soft">1843</text>
<circle cx="257" cy="57" r="4.5" class="fl"/><text x="263" y="48" class="t-xs mid ink">クラウジウス</text><text x="257" y="73" class="t-xs mid soft">1865</text>
<rect x="8" y="84" width="344" height="44" rx="10" class="tint"/>
<text x="16" y="103" class="t-s ink" font-weight="700">電気と磁気</text>
<text x="16" y="119" class="t-xs soft">光は電磁波</text>
<path d="M96 107 H342" class="st-soft" stroke-width="1.5" marker-end="url(#a-soft)"/>
<circle cx="173" cy="107" r="4.5" class="fl"/><text x="173" y="98" class="t-xs mid ink">ファラデー</text><text x="173" y="123" class="t-xs mid soft">1831</text>
<circle cx="255" cy="107" r="4.5" class="fl"/><text x="255" y="98" class="t-xs mid ink">マクスウェル</text><text x="255" y="123" class="t-xs mid soft">1864</text>
<circle cx="314" cy="107" r="4.5" class="fl"/><text x="314" y="98" class="t-xs mid ink">ヘルツ</text><text x="314" y="123" class="t-xs mid soft">1888</text>
<rect x="8" y="134" width="344" height="44" rx="10" class="tint"/>
<text x="16" y="153" class="t-s ink" font-weight="700">地球</text>
<text x="16" y="169" class="t-xs soft">何億年も古い</text>
<path d="M96 157 H342" class="st-soft" stroke-width="1.5" marker-end="url(#a-soft)"/>
<circle cx="170" cy="157" r="4.5" class="fl"/><text x="170" y="148" class="t-xs mid ink">ライエル</text><text x="170" y="173" class="t-xs mid soft">1830</text>
<circle cx="250" cy="157" r="4.5" class="fl"/><text x="250" y="148" class="t-xs mid ink">ケルビン</text><text x="250" y="173" class="t-xs mid soft">1862</text>
<rect x="8" y="184" width="344" height="44" rx="10" class="tint"/>
<text x="16" y="203" class="t-s ink" font-weight="700">生命</text>
<text x="16" y="219" class="t-xs soft">進化と自然選択</text>
<path d="M96 207 H342" class="st-soft" stroke-width="1.5" marker-end="url(#a-soft)"/>
<circle cx="173" cy="207" r="4.5" class="fl"/><text x="173" y="198" class="t-xs mid ink">ビーグル号</text><text x="173" y="223" class="t-xs mid soft">1831</text>
<circle cx="242" cy="207" r="4.5" class="fl"/><text x="242" y="198" class="t-xs mid ink">『種の起源』</text><text x="242" y="223" class="t-xs mid soft">1859</text>

  <path d="M300 166 C306 182 300 194 288 206" class="st-f dash" stroke-width="1.5" marker-end="url(#a-science)"/>
  <path d="M96 240 H344" class="st-line" stroke-width="1.5"/>
  <path d="M96 236 V244 M220 236 V244 M344 236 V244" class="st-soft" stroke-width="1.5"/>
  <text x="96" y="258" class="t-xs mid soft">1800</text>
  <text x="220" y="258" class="t-xs mid soft">1850</text>
  <text x="344" y="258" class="t-xs end soft">1900</text>
  <text x="12" y="276" class="t-xs soft">点線：長い時間という見方が、進化論の土台に</text>
</svg>
