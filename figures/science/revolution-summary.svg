<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 科学革命：天の流れと地上の流れが、ニュートンの万有引力で合流する。土台は科学的方法 -->
  <rect x="90" y="10" width="180" height="54" rx="12" class="fl"/>
  <text x="180" y="34" class="t-m mid on">万有引力（1687）</text>
  <text x="180" y="53" class="t-xs mid on">ニュートン：空も地上も同じ法則</text>

  <path d="M24 100 C24 56 44 38 84 37" class="st-f" stroke-width="2" marker-end="url(#a-science)"/>
  <path d="M336 134 C336 60 316 38 276 37" class="st-f" stroke-width="2" marker-end="url(#a-science)"/>

  <text x="92" y="90" class="t-s mid ink" font-weight="700">天の動き</text>
  <text x="268" y="124" class="t-s mid ink" font-weight="700">地上の動き</text>

  <!-- 天の流れ（下が古く、上が新しい） -->
  <rect x="12" y="98" width="160" height="28" rx="8" class="tint"/>
  <text x="20" y="116" class="t-xs soft">1610</text>
  <text x="52" y="116" class="t-xs ink">ガリレオの望遠鏡観測</text>
  <rect x="12" y="132" width="160" height="28" rx="8" class="tint"/>
  <text x="20" y="150" class="t-xs soft">1609</text>
  <text x="52" y="150" class="t-xs ink">ケプラーの楕円軌道</text>
  <rect x="12" y="166" width="160" height="28" rx="8" class="tint"/>
  <text x="20" y="184" class="t-xs soft">1543</text>
  <text x="52" y="184" class="t-xs ink">コペルニクスの地動説</text>
  <rect x="12" y="200" width="160" height="28" rx="8" class="paper st-soft dash"/>
  <text x="20" y="218" class="t-xs soft">古代</text>
  <text x="52" y="218" class="t-xs soft">天動説：地球が中心</text>

  <!-- 地上の流れ -->
  <rect x="188" y="132" width="160" height="28" rx="8" class="tint"/>
  <text x="196" y="150" class="t-xs soft">1687</text>
  <text x="228" y="150" class="t-xs ink">運動の3つの法則</text>
  <rect x="188" y="166" width="160" height="28" rx="8" class="tint"/>
  <text x="196" y="184" class="t-xs soft">1638</text>
  <text x="228" y="184" class="t-xs ink">ガリレオの落体の研究</text>
  <rect x="188" y="200" width="160" height="28" rx="8" class="paper st-soft dash"/>
  <text x="196" y="218" class="t-xs soft">古代</text>
  <text x="228" y="218" class="t-xs soft">重い物ほど速く落ちる</text>

  <!-- 土台：科学的方法 -->
  <rect x="12" y="238" width="336" height="34" rx="10" class="bgc st-line"/>
  <text x="24" y="260" class="t-s ink" font-weight="700">土台：科学的方法</text>
  <text x="136" y="260" class="t-xs soft">観察 → 仮説 → 実験 → 検証</text>
  <path d="M318 248 A10 10 0 1 1 312 264" class="st-f" stroke-width="1.8" marker-end="url(#a-science)"/>
</svg>
