<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 古代の4つのまとまりを年表の帯で並べ、受けつがれた流れを点線の矢印で示す（1000年＝75、長さはおおよそ） -->
  <text x="20" y="28" class="t-m ink" font-weight="700">大河から地中海へ</text>
  <text x="20" y="46" class="t-xs soft">帯の長さ＝栄えた期間　点線＝受けつがれたもの</text>

  <!-- 四大文明（前3500〜前1500ごろ） -->
  <rect x="30" y="58" width="150" height="34" rx="8" class="tint"/>
  <text x="105" y="74" class="t-s mid ink" font-weight="700">四大文明</text>
  <text x="105" y="87" class="t-xs mid soft">大河・農耕・文字</text>

  <!-- ポリス（前8〜前4世紀） -->
  <rect x="232" y="104" width="36" height="28" rx="6" class="fl"/>
  <text x="224" y="116" class="t-s end ink" font-weight="700">ギリシャのポリス</text>
  <text x="224" y="130" class="t-xs end soft">市民の民主政・哲学</text>

  <!-- ヘレニズム（前334〜前30） -->
  <rect x="267" y="144" width="24" height="28" rx="5" class="ink"/>
  <text x="259" y="156" class="t-s end ink" font-weight="700">ヘレニズム</text>
  <text x="259" y="170" class="t-xs end soft">大王の遠征で文化が東へ</text>

  <!-- ローマ（前509〜476年、西） -->
  <rect x="254" y="184" width="76" height="28" rx="6" class="fl"/>
  <text x="246" y="196" class="t-s end ink" font-weight="700">ローマ</text>
  <text x="246" y="210" class="t-xs end soft">共和政→帝政・ローマ法</text>
  <text x="292" y="203" class="t-xs mid on">大帝国</text>

  <!-- 受けつぐ流れ -->
  <path d="M182 76 C214 78 236 86 246 100" class="st-f dash" stroke-width="2" fill="none" marker-end="url(#a-history)"/>
  <text x="196" y="66" class="t-xs soft">文字・暦</text>
  <path d="M270 132 C276 136 278 138 278 140" class="st-f dash" stroke-width="2" fill="none" marker-end="url(#a-history)"/>
  <path d="M296 160 C312 164 316 172 312 180" class="st-f dash" stroke-width="2" fill="none" marker-end="url(#a-history)"/>
  <text x="318" y="160" class="t-xs soft">文化</text>

  <!-- 年の軸 -->
  <path d="M24 226 H340" class="st-soft" stroke-width="1.5"/>
  <path d="M67.5 222 V230 M142.5 222 V230 M217.5 222 V230 M292.5 222 V230" class="st-soft" stroke-width="1.5"/>
  <text x="67.5" y="244" class="t-xs mid soft">前3000</text>
  <text x="142.5" y="244" class="t-xs mid soft">前2000</text>
  <text x="217.5" y="244" class="t-xs mid soft">前1000</text>
  <text x="292.5" y="244" class="t-xs mid soft">紀元0</text>
  <text x="20" y="268" class="t-xs soft">西ローマは476年に滅び、東ローマは1453年まで続いた</text>
</svg>
