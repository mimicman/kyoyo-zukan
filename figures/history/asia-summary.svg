<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 上：アジアと世界をつないだ3つの動き（期間の帯）。下：中国の王朝の帯（高い＝統一、低い＝分裂）。横軸は前221〜1912年（1年＝0.136） -->
  <text x="20" y="26" class="t-m ink" font-weight="700">中国の王朝と、世界とのつながり</text>

  <!-- シルクロード（前200〜1500ごろ） -->
  <rect x="37" y="40" width="231" height="24" rx="6" class="tint"/>
  <text x="46" y="56" class="t-xs ink" font-weight="700">シルクロード（草原・砂漠・海の道）</text>
  <!-- モンゴル帝国（1206〜1368） -->
  <rect x="228" y="72" width="22" height="24" rx="4" class="ink"/>
  <text x="220" y="88" class="t-xs end ink" font-weight="700">モンゴル帝国が東西をつなぐ</text>
  <!-- 列強の進出（1840〜1910） -->
  <rect x="314" y="104" width="12" height="24" rx="3" class="fl"/>
  <text x="306" y="120" class="t-xs end ink" font-weight="700">欧米の列強が海から進出</text>
  <path d="M239 98 V146" class="st-f dash" stroke-width="1.5" marker-end="url(#a-history)"/>

  <!-- 凡例 -->
  <rect x="20" y="132" width="12" height="12" rx="2" class="fl"/>
  <text x="37" y="142" class="t-xs ink">統一</text>
  <rect x="80" y="132" width="12" height="12" rx="2" class="tint"/>
  <text x="97" y="142" class="t-xs ink">分裂</text>

  <!-- 中国の王朝（前221〜1912年、長さはおおよそ） -->
  <rect x="34" y="150" width="60" height="50" class="fl"/>
  <rect x="94" y="180" width="49" height="20" class="tint"/>
  <rect x="143" y="150" width="45" height="50" class="fl"/>
  <rect x="188" y="180" width="7" height="20" class="tint"/>
  <rect x="195" y="150" width="42" height="50" class="fl"/>
  <rect x="237" y="150" width="13" height="50" class="ink"/>
  <rect x="250" y="150" width="38" height="50" class="fl"/>
  <rect x="288" y="150" width="36" height="50" class="fl"/>
  <path d="M250 150 V200 M288 150 V200" class="st-line" stroke-width="1.5"/>
  <text x="64" y="216" class="t-xs mid ink">秦・漢</text>
  <text x="118" y="216" class="t-xs mid soft">三国など</text>
  <text x="165" y="216" class="t-xs mid ink">隋・唐</text>
  <text x="216" y="216" class="t-xs mid ink">宋</text>
  <text x="243" y="216" class="t-xs mid ink" font-weight="700">元</text>
  <text x="269" y="216" class="t-xs mid ink">明</text>
  <text x="306" y="216" class="t-xs mid ink">清</text>

  <!-- 年の軸 -->
  <path d="M30 228 H330" class="st-soft" stroke-width="1.5"/>
  <text x="34" y="244" class="t-xs mid soft">前221</text>
  <text x="200" y="244" class="t-xs mid soft">1000</text>
  <text x="324" y="244" class="t-xs mid soft">1912</text>
  <text x="20" y="268" class="t-xs soft">日本は唐から律令を学び、元の軍や黒船とも向き合った</text>
</svg>
