  <text x="302" y="174" class="t-xs mid fl">1498</text>
  <path d="M162 60 C132 110 116 160 90 174 C66 182 44 160 26 132" class="st-soft dash" stroke-width="2" marker-end="url(#a-soft)"/>
  <text x="12" y="104" class="t-xs soft">マゼラン</text>
  <text x="12" y="118" class="t-xs soft">世界一周</text>

  <!-- 大陸の間を行き来したもの -->
  <text x="12" y="200" class="t-s ink" font-weight="700">大陸の間を行き来したもの</text>
  <rect x="12" y="208" width="164" height="66" rx="12" class="tint"/>
  <text x="94" y="228" class="t-s mid fl" font-weight="700">アメリカ → 世界</text>
  <text x="94" y="248" class="t-xs mid ink">ジャガイモ・トウモロコシ</text>
  <text x="94" y="264" class="t-xs mid ink">トマト・銀</text>
  <rect x="184" y="208" width="164" height="66" rx="12" class="tint"/>
  <text x="266" y="228" class="t-s mid fl" font-weight="700">ヨーロッパ → アメリカ</text>
  <text x="266" y="248" class="t-xs mid ink">馬・牛・小麦</text>
  <text x="266" y="264" class="t-xs mid ink">天然痘などの病気</text>
