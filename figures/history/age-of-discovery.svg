  <text x="296" y="56" class="t-xs mid soft">アジア</text>
  <text x="202" y="112" class="t-xs mid soft">アフリカ</text>
  <text x="284" y="134" class="t-xs mid ink">インド</text>
  <g class="fl"><circle cx="318" cy="112" r="3"/><circle cx="326" cy="118" r="3"/><circle cx="314" cy="121" r="3"/></g>
  <text x="326" y="138" class="t-xs mid fl">香辛料</text>

  <!-- 出発地 -->
  <circle cx="164" cy="52" r="4" class="ink"/>
