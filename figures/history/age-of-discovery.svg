  <path d="M164 46 V20" class="st-line" stroke-width="1"/>

  <!-- 航路 -->
  <path d="M160 54 C140 60 122 66 104 76" class="st" stroke-width="2.5" marker-end="url(#a-ink)"/>
  <text x="122" y="84" class="t-xs mid ink halo">コロンブス</text>
  <text x="122" y="98" class="t-xs mid ink halo">1492</text>
  <path d="M166 58 C140 96 170 170 205 172 C230 172 246 132 260 112" class="st-f" stroke-width="2.5" marker-end="url(#a-history)"/>
