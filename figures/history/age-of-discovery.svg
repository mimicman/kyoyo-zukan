  <path d="M160 30 L230 18 L340 22 L348 70 L320 100 L300 96 L285 118 L270 100 L245 96 L225 70 L200 60 L170 58 Z" class="tint"/>
  <path d="M168 64 L210 62 L232 86 L228 120 L208 160 L196 160 L184 118 L166 92 Z" class="tint"/>
