<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 幹：ひとつのローマ -->
  <path d="M40 24 V160" class="st-f" stroke-width="5" stroke-linecap="round"/>
  <!-- 枝：西と東 -->
  <path d="M40 160 V236" class="st-soft" stroke-width="5" stroke-linecap="round"/>
  <path d="M40 160 C40 190 200 176 200 214" class="st-f" stroke-width="5" stroke-linecap="round"/>

  <circle cx="40" cy="24" r="8" class="paper st-f" stroke-width="3"/>
  <text x="60" y="22" class="t-m ink">前509年</text>
  <text x="128" y="22" class="t-s soft">王を追放し共和政へ</text>

  <circle cx="40" cy="68" r="8" class="paper st-f" stroke-width="3"/>
  <text x="60" y="66" class="t-m ink">前27年</text>
  <text x="128" y="66" class="t-s soft">帝政が始まる</text>
  <text x="128" y="82" class="t-xs soft">初代皇帝アウグストゥス</text>

  <circle cx="40" cy="114" r="8" class="fl"/>
  <text x="60" y="112" class="t-m ink">2世紀</text>
  <text x="128" y="112" class="t-s fl">領土が最大に</text>

  <circle cx="40" cy="160" r="8" class="paper st-f" stroke-width="3"/>
  <text x="60" y="158" class="t-m ink">395年</text>
  <text x="128" y="158" class="t-s soft">東西に分かれる</text>

  <!-- 西ローマ -->
  <circle cx="40" cy="236" r="8" class="soft"/>
  <text x="58" y="234" class="t-m ink">476年</text>
  <text x="58" y="252" class="t-xs soft">西ローマ帝国が滅ぶ</text>
  <!-- 東ローマ -->
  <circle cx="200" cy="214" r="8" class="fl"/>
  <text x="216" y="212" class="t-m ink">1453年</text>
  <text x="216" y="230" class="t-xs soft">東ローマ帝国が滅ぶ</text>
  <text x="216" y="246" class="t-xs fl">約1000年続いた</text>
</svg>
