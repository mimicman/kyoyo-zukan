<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 上：4つの動きの期間（1300〜1800年、1年＝0.58）。下：古典の再生と印刷が航海と宗教改革を支え、王が国をまとめる流れ -->
  <text x="20" y="26" class="t-m ink" font-weight="700">重なり合って進んだ4つの動き</text>

  <rect x="40" y="38" width="174" height="20" rx="5" class="tint"/>
  <text x="48" y="52" class="t-xs ink" font-weight="700">ルネサンス</text>
  <rect x="98" y="62" width="145" height="20" rx="5" class="fl"/>
  <text x="106" y="76" class="t-xs on" font-weight="700">大航海時代</text>
  <rect x="166" y="86" width="76" height="20" rx="5" class="ink"/>
  <text x="174" y="100" class="t-xs paper" font-weight="700">宗教改革</text>
  <rect x="156" y="110" width="168" height="20" rx="5" class="tint st-f" stroke-width="1.2"/>
  <text x="250" y="124" class="t-xs ink" font-weight="700">絶対王政</text>

  <path d="M30 142 H340" class="st-soft" stroke-width="1.5"/>
  <path d="M40 138 V146 M98 138 V146 M156 138 V146 M214 138 V146 M272 138 V146 M330 138 V146" class="st-soft" stroke-width="1.5"/>
  <text x="40" y="158" class="t-xs mid soft">1300</text>
  <text x="98" y="158" class="t-xs mid soft">1400</text>
  <text x="156" y="158" class="t-xs mid soft">1500</text>
  <text x="214" y="158" class="t-xs mid soft">1600</text>
  <text x="272" y="158" class="t-xs mid soft">1700</text>
  <text x="330" y="158" class="t-xs mid soft">1800</text>

  <!-- 流れ -->
  <rect x="12" y="176" width="82" height="62" rx="10" class="tint"/>
  <text x="53" y="198" class="t-s mid ink" font-weight="700">古典の</text>
  <text x="53" y="214" class="t-s mid ink" font-weight="700">学び直し</text>
  <text x="53" y="230" class="t-xs mid soft">印刷で広まる</text>
  <rect x="116" y="170" width="88" height="32" rx="8" class="fl"/>
  <text x="160" y="191" class="t-s mid on" font-weight="700">外洋へ</text>
  <rect x="116" y="212" width="88" height="32" rx="8" class="ink"/>
  <text x="160" y="233" class="t-s mid paper" font-weight="700">宗教改革</text>
  <rect x="236" y="176" width="112" height="62" rx="10" class="tint st-f" stroke-width="1.5"/>
  <text x="292" y="198" class="t-s mid ink" font-weight="700">王が国を</text>
  <text x="292" y="214" class="t-s mid ink" font-weight="700">まとめる</text>
  <text x="292" y="230" class="t-xs mid soft">主権国家が並ぶ</text>
  <path d="M96 198 L112 188" class="st-f" stroke-width="2" marker-end="url(#a-history)"/>
  <path d="M96 216 L112 226" class="st-f" stroke-width="2" marker-end="url(#a-history)"/>
  <path d="M206 188 L232 198" class="st-f" stroke-width="2" marker-end="url(#a-history)"/>
  <path d="M206 228 L232 218" class="st-f" stroke-width="2" marker-end="url(#a-history)"/>
  <text x="20" y="266" class="t-xs soft">航路で世界がつながり、宗教戦争を経て王の力が強まった</text>
</svg>
