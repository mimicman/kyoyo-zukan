<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 上：守られる人の範囲がくさび形に広がる -->
  <text x="20" y="26" class="t-m ink">守られる人が広がっていく</text>
  <polygon points="20,88 340,40 340,150 20,108" class="tint"/>
  <path d="M30 98 H322" class="st-f dash" stroke-width="1.5" marker-end="url(#a-politics)"/>
  <text x="62" y="94" class="t-xs mid ink halo">貴族</text>
  <text x="180" y="94" class="t-s mid ink halo" font-weight="700">国民（市民）</text>
  <text x="296" y="78" class="t-s mid ink" font-weight="700">世界の</text>
  <text x="296" y="94" class="t-s mid ink halo" font-weight="700">すべての人</text>

  <!-- まん中：年の線と、それぞれの考え -->
  <path d="M14 176 H346" class="st-line" stroke-width="2"/>
  <circle cx="50" cy="176" r="5" class="fl"/>
  <circle cx="137" cy="176" r="5" class="fl"/>
  <circle cx="223" cy="176" r="5" class="fl"/>
  <circle cx="310" cy="176" r="5" class="fl"/>
  <text x="50" y="166" class="t-xs mid soft">王をしばる</text>
  <text x="137" y="166" class="t-xs mid soft">国家は約束</text>
  <text x="223" y="166" class="t-xs mid soft">権利を宣言</text>
  <text x="310" y="166" class="t-xs mid soft">中身が広がる</text>

  <!-- 下：4枚のカード -->
  <rect x="8" y="190" width="80" height="80" rx="10" class="fl"/>
  <text x="48" y="210" class="t-s mid on" font-weight="700">法の支配</text>
  <text x="48" y="230" class="t-xs mid on">1215年</text>
  <text x="48" y="246" class="t-xs mid on">マグナ・</text>
  <text x="48" y="260" class="t-xs mid on">カルタ</text>

  <rect x="95" y="190" width="84" height="80" rx="10" class="fl"/>
  <text x="137" y="210" class="t-s mid on" font-weight="700">社会契約説</text>
  <text x="137" y="230" class="t-xs mid on">17〜18世紀</text>
  <text x="137" y="246" class="t-xs mid on">ホッブズ</text>
  <text x="137" y="260" class="t-xs mid on">ロック・ルソー</text>

  <rect x="186" y="190" width="76" height="80" rx="10" class="fl"/>
  <text x="224" y="210" class="t-s mid on" font-weight="700">人権の宣言</text>
  <text x="224" y="230" class="t-xs mid on">1776 独立</text>
  <text x="224" y="246" class="t-xs mid on">1789 人権</text>
  <text x="224" y="260" class="t-xs mid on">1948 世界</text>

  <rect x="270" y="190" width="82" height="80" rx="10" class="fl"/>
  <text x="311" y="210" class="t-s mid on" font-weight="700">人権の種類</text>
  <text x="311" y="230" class="t-xs mid on">自由権</text>
  <text x="311" y="246" class="t-xs mid on">参政権</text>
  <text x="311" y="260" class="t-xs mid on">社会権</text>
</svg>
