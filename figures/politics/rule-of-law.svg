  <circle cx="82" cy="162" r="5" class="soft"/>
  <circle cx="93" cy="162" r="5" class="soft"/>
  <circle cx="104" cy="162" r="5" class="soft"/>
  <circle cx="115" cy="162" r="5" class="soft"/>
  <text x="93" y="194" class="t-s mid soft">王が法より上</text>

  <!-- 法の支配：法が全員の上 -->
  <rect x="196" y="14" width="142" height="28" rx="10" class="fl"/>
  <text x="267" y="33" class="t-m mid on">法の支配</text>
  <rect x="196" y="56" width="142" height="34" rx="6" class="fl"/>
