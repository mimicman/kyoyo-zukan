  <path d="M93 88 V104" class="st-soft" stroke-width="2" marker-end="url(#a-soft)"/>
  <rect x="68" y="108" width="50" height="24" rx="4" class="bgc st-soft" stroke-width="1.5"/>
  <text x="93" y="125" class="t-s mid soft">法</text>
  <path d="M93 136 V150" class="st-soft" stroke-width="2" marker-end="url(#a-soft)"/>
