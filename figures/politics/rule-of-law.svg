  <path d="M29 234 H43 M29 240 H43 M29 246 H39" class="st-f" stroke-width="1.5"/>
  <text x="58" y="238" class="t-m ink">1215 マグナ・カルタ</text>
  <text x="58" y="258" class="t-xs soft">王の権力を文書でしばる</text>
  <path d="M220 242 H244" class="st-f" stroke-width="2" marker-end="url(#a-politics)"/>
  <text x="252" y="247" class="t-m fl">立憲主義へ</text>
