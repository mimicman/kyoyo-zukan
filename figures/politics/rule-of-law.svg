  <path d="M230 92 V108" class="st-f" stroke-width="2" marker-end="url(#a-politics)"/>
  <path d="M300 92 V114" class="st-f" stroke-width="2" marker-end="url(#a-politics)"/>
  <path d="M215 136 V120 L222 127 L230 114 L238 127 L245 120 V136 Z" class="fl"/>
  <circle cx="284" cy="126" r="5" class="ink"/>
  <circle cx="292" cy="126" r="5" class="ink"/>
  <circle cx="300" cy="126" r="5" class="ink"/>
  <circle cx="308" cy="126" r="5" class="ink"/>
  <circle cx="316" cy="126" r="5" class="ink"/>
  <path d="M206 144 H328" class="st-f dash" stroke-width="1.5"/>
