<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <path d="M180 14 V200" class="st-line" stroke-width="1.5"/>

  <!-- 人の支配：王が法の上 -->
  <rect x="22" y="14" width="142" height="28" rx="10" class="bgc st-soft" stroke-width="1.5"/>
  <text x="93" y="33" class="t-m mid soft">人の支配</text>
