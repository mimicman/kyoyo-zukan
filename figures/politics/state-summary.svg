  <text x="148" y="255" class="t-xs mid on">首相</text>
  <path d="M53 251 H67" class="st-f" stroke-width="1.5" marker-end="url(#a-politics)"/>
  <path d="M111 251 H125" class="st-f" stroke-width="1.5" marker-end="url(#a-politics)"/>
  <text x="88" y="284" class="t-xs mid soft">一本の鎖で選ぶ</text>

