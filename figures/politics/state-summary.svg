  <text x="180" y="132" class="t-xs mid soft">内閣</text>
  <text x="180" y="146" class="t-xs mid soft">法律で動く</text>

  <rect x="260" y="74" width="64" height="96" rx="6" class="tint st-f" stroke-width="1.5"/>
  <path d="M334 150 C346 120 344 86 320 62" class="st-f dash" stroke-width="1.5" fill="none" marker-end="url(#a-politics)"/>
  <text x="292" y="112" class="t-l mid ink">司法</text>
  <text x="292" y="132" class="t-xs mid soft">裁判所</text>
  <text x="292" y="146" class="t-xs mid soft">争いを裁く</text>
  <text x="292" y="162" class="t-xs mid fl" font-weight="700">違憲審査</text>

  <!-- 柱どうしのブレーキ -->
  <path d="M104 100 H144" class="st-f" stroke-width="1.5" marker-end="url(#a-politics)"/>
  <path d="M144 112 H104" class="st-f" stroke-width="1.5" marker-end="url(#a-politics)"/>
  <path d="M216 100 H256" class="st-f" stroke-width="1.5" marker-end="url(#a-politics)"/>
  <path d="M256 112 H216" class="st-f" stroke-width="1.5" marker-end="url(#a-politics)"/>
  <text x="124" y="132" class="t-xs mid ink">抑え</text>
  <text x="124" y="146" class="t-xs mid ink">合う</text>
  <text x="236" y="132" class="t-xs mid ink">抑え</text>
  <text x="236" y="146" class="t-xs mid ink">合う</text>
  <rect x="16" y="170" width="328" height="8" rx="3" class="fl"/>

  <!-- 下：立法と行政のつなぎ方 -->
  <text x="180" y="200" class="t-xs mid soft">立法と行政のつなぎ方は2通り</text>
  <path d="M180 210 V292" class="st-line" stroke-width="1.5"/>

  <text x="88" y="224" class="t-s mid ink" font-weight="700">議院内閣制</text>
  <rect x="12" y="238" width="40" height="26" rx="6" class="paper st-f" stroke-width="1.5"/>
  <text x="32" y="255" class="t-xs mid ink">国民</text>
  <rect x="70" y="238" width="40" height="26" rx="6" class="paper st-f" stroke-width="1.5"/>
  <text x="90" y="255" class="t-xs mid ink">議会</text>
