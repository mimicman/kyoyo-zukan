<svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
  <!-- 上：憲法が屋根、三権が柱 -->
  <polygon points="180,10 344,64 16,64" class="fl"/>
  <text x="180" y="46" class="t-m mid on">憲法</text>
  <text x="180" y="60" class="t-xs mid on">いちばん上の決まり（最高法規）</text>

  <rect x="36" y="74" width="64" height="96" rx="6" class="tint st-f" stroke-width="1.5"/>
  <text x="68" y="112" class="t-l mid ink">立法</text>
  <text x="68" y="132" class="t-xs mid soft">国会</text>
