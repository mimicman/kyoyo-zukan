<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 左：国内（上下の関係） -->
  <rect x="10" y="14" width="112" height="146" rx="10" class="tint"/>
  <text x="66" y="34" class="t-s mid ink" font-weight="700">国の中</text>
  <rect x="34" y="46" width="64" height="28" rx="6" class="fl"/>
  <text x="66" y="65" class="t-s mid on">政府</text>
  <path d="M50 76 L36 108" class="st-f" stroke-width="1.5" marker-end="url(#a-politics)"/>
