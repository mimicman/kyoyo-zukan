  <path d="M82 76 L96 108" class="st-f" stroke-width="1.5" marker-end="url(#a-politics)"/>
  <circle cx="34" cy="122" r="9" class="paper st-f" stroke-width="1.5"/>
  <circle cx="66" cy="122" r="9" class="paper st-f" stroke-width="1.5"/>
  <circle cx="98" cy="122" r="9" class="paper st-f" stroke-width="1.5"/>
  <text x="66" y="150" class="t-xs mid soft">上から法を守らせる</text>

  <!-- 右：国際社会（横の関係） -->
  <rect x="132" y="14" width="218" height="146" rx="10" class="tint"/>
