<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 左：三審制（下から上へ）。右：違憲審査（法律を憲法に照らす→結果→国会が改める） -->
  <rect x="20" y="24" width="140" height="40" rx="8" class="fl"/>
  <text x="90" y="42" class="t-s mid on" font-weight="700">最高裁判所</text>
  <text x="90" y="57" class="t-xs mid on">憲法の番人</text>
  <rect x="20" y="102" width="140" height="34" rx="8" class="tint st-f" stroke-width="1.5"/>
  <text x="90" y="124" class="t-s mid ink">高等裁判所</text>
  <rect x="20" y="174" width="140" height="34" rx="8" class="tint st-f" stroke-width="1.5"/>
  <text x="90" y="196" class="t-s mid ink">地方裁判所など</text>
  <rect x="50" y="232" width="80" height="26" rx="13" class="paper st-f" stroke-width="1.5"/>
  <text x="90" y="249" class="t-xs mid ink">事件・訴え</text>
  <path d="M90 230 V212" class="st-f" stroke-width="2" marker-end="url(#a-politics)"/>
  <path d="M90 172 V140" class="st-f" stroke-width="2" marker-end="url(#a-politics)"/>
  <path d="M90 100 V68" class="st-f" stroke-width="2" marker-end="url(#a-politics)"/>
  <text x="98" y="160" class="t-xs ink">2回目</text>
  <text x="98" y="88" class="t-xs ink">3回目</text>
  <text x="90" y="274" class="t-xs mid soft">三審制：最大3回</text>

  <!-- 違憲審査 -->
  <rect x="206" y="20" width="140" height="34" rx="8" class="ink"/>
  <text x="276" y="42" class="t-s mid paper" font-weight="700">憲法（最高法規）</text>
  <path d="M236 104 h66 l10 10 v24 h-76 Z" class="paper st-f" stroke-width="1.5"/>
  <text x="274" y="128" class="t-s mid ink">法律・命令</text>
  <path d="M274 102 V58" class="st-f dash" stroke-width="2" marker-end="url(#a-politics)"/>
  <text x="282" y="84" class="t-xs fl halo" font-weight="700">合っている？</text>
  <path d="M162 46 C196 56 210 88 230 112" class="st-soft" stroke-width="1.5" fill="none" marker-end="url(#a-soft)"/>
  <text x="168" y="98" class="t-xs soft">裁判の中で</text>
  <text x="168" y="112" class="t-xs soft">審査する</text>

  <path d="M252 140 L234 164" class="st-f" stroke-width="1.5" marker-end="url(#a-politics)"/>
  <path d="M296 140 L314 164" class="st-f" stroke-width="1.5" marker-end="url(#a-politics)"/>
  <rect x="194" y="168" width="74" height="42" rx="8" class="tint"/>
  <text x="231" y="186" class="t-s mid ink" font-weight="700">合う</text>
  <text x="231" y="202" class="t-xs mid soft">そのまま有効</text>
  <rect x="276" y="168" width="74" height="42" rx="8" class="fl"/>
  <text x="313" y="186" class="t-s mid on" font-weight="700">反する</text>
  <text x="313" y="202" class="t-xs mid on">適用しない</text>
  <path d="M340 212 C356 232 360 150 324 128" class="st-f dash" stroke-width="1.5" fill="none" marker-end="url(#a-politics)"/>
  <text x="340" y="232" class="t-xs end ink">国会が法律を</text>
  <text x="340" y="246" class="t-xs end ink">改めることも</text>
</svg>
