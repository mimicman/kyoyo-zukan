<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 下：人々の意見（世論）。中：政党が意見を集めてまとめる（漏斗）。上：議会で与党が政府をつくり、野党が点検。右：メディア・世論調査 -->
  <rect x="12" y="12" width="276" height="76" rx="12" class="bgc"/>
  <text x="24" y="30" class="t-xs soft">議会</text>
  <g class="fl">
    <circle cx="52" cy="50" r="7"/><circle cx="70" cy="50" r="7"/><circle cx="88" cy="50" r="7"/><circle cx="106" cy="50" r="7"/>
    <circle cx="61" cy="66" r="7"/><circle cx="79" cy="66" r="7"/><circle cx="97" cy="66" r="7"/>
  </g>
  <text x="128" y="52" class="t-s ink" font-weight="700">与党</text>
  <text x="128" y="68" class="t-xs ink">政府をつくる</text>
  <g class="soft">
    <circle cx="214" cy="50" r="7"/><circle cx="232" cy="50" r="7"/><circle cx="223" cy="66" r="7"/><circle cx="241" cy="66" r="7"/>
  </g>
  <text x="258" y="52" class="t-s end ink" font-weight="700">野党</text>
  <text x="276" y="82" class="t-xs end ink">点検・批判</text>
  <path d="M206 38 C176 26 146 26 120 34" class="st dash" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>

  <!-- 政党（漏斗） -->
  <polygon points="40,182 140,182 112,140 68,140" class="fl"/>
  <text x="90" y="166" class="t-s mid on" font-weight="700">政党A</text>
  <polygon points="170,182 270,182 242,140 198,140" class="tint st-f" stroke-width="1.5"/>
  <text x="220" y="166" class="t-s mid ink" font-weight="700">政党B</text>
  <path d="M90 138 V94" class="st-f" stroke-width="2.5" marker-end="url(#a-politics)"/>
  <path d="M220 138 V94" class="st-f" stroke-width="2.5" marker-end="url(#a-politics)"/>
  <text x="98" y="118" class="t-xs ink">選挙で議席</text>
  <text x="228" y="118" class="t-xs ink">公約を示す</text>

  <!-- 人々の意見 -->
  <g>
    <circle cx="44" cy="226" r="6" class="fl"/><circle cx="64" cy="238" r="6" class="ink"/><circle cx="84" cy="222" r="6" class="soft"/>
    <circle cx="104" cy="236" r="6" class="fl"/><circle cx="124" cy="224" r="6" class="tint st-f" stroke-width="1"/>
    <circle cx="144" cy="238" r="6" class="soft"/><circle cx="164" cy="224" r="6" class="fl"/><circle cx="184" cy="236" r="6" class="ink"/>
    <circle cx="204" cy="222" r="6" class="tint st-f" stroke-width="1"/><circle cx="224" cy="236" r="6" class="soft"/>
    <circle cx="244" cy="224" r="6" class="fl"/><circle cx="264" cy="238" r="6" class="tint st-f" stroke-width="1"/>
  </g>
  <path d="M70 214 L80 188" class="st-f" stroke-width="1.5" marker-end="url(#a-politics)"/>
  <path d="M120 214 L104 188" class="st-f" stroke-width="1.5" marker-end="url(#a-politics)"/>
  <path d="M200 214 L210 188" class="st-f" stroke-width="1.5" marker-end="url(#a-politics)"/>
  <path d="M250 214 L236 188" class="st-f" stroke-width="1.5" marker-end="url(#a-politics)"/>
  <text x="154" y="268" class="t-s mid ink" font-weight="700">人々の意見（世論）</text>

  <!-- メディア・世論調査 -->
  <rect x="298" y="128" width="54" height="52" rx="8" class="paper st-f" stroke-width="1.5"/>
  <text x="325" y="150" class="t-xs mid ink">メディア</text>
  <text x="325" y="168" class="t-xs mid ink">世論調査</text>
  <path d="M282 232 C318 228 326 210 325 184" class="st-f dash" stroke-width="1.5" fill="none" marker-end="url(#a-politics)"/>
  <path d="M325 126 C325 100 314 76 292 62" class="st-f dash" stroke-width="1.5" fill="none" marker-end="url(#a-politics)"/>
  <text x="346" y="108" class="t-xs end fl">伝える</text>
</svg>
