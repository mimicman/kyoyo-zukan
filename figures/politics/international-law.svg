<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <path d="M180 14 V236" class="st-line" stroke-width="1.5"/>

  <!-- 国内法：上から下へ -->
  <rect x="18" y="14" width="144" height="28" rx="10" class="bgc st-soft" stroke-width="1.5"/>
  <text x="90" y="33" class="t-m mid ink">国内法</text>
  <rect x="40" y="60" width="100" height="30" rx="8" class="soft"/>
  <text x="90" y="80" class="t-s mid paper" font-weight="700">国会・政府</text>
  <path d="M90 94 V128" class="st-soft" stroke-width="2.5" marker-end="url(#a-soft)"/>
  <text x="98" y="116" class="t-xs soft">法律</text>
  <circle cx="62" cy="142" r="6" class="ink"/><circle cx="76" cy="142" r="6" class="ink"/><circle cx="90" cy="142" r="6" class="ink"/>
  <circle cx="104" cy="142" r="6" class="ink"/><circle cx="118" cy="142" r="6" class="ink"/>
  <text x="90" y="168" class="t-xs mid ink">国民</text>
  <rect x="18" y="188" width="144" height="44" rx="10" class="bgc"/>
  <text x="90" y="207" class="t-xs mid ink">警察・裁判所が</text>
  <text x="90" y="223" class="t-xs mid ink">守らせる</text>

  <!-- 国際法：横のつながり -->
  <rect x="198" y="14" width="144" height="28" rx="10" class="fl"/>
  <text x="270" y="33" class="t-m mid on">国際法</text>
  <rect x="222" y="54" width="96" height="26" rx="6" class="bgc st-soft dash" stroke-width="1.5"/>
  <text x="270" y="72" class="t-xs mid soft">世界政府はない</text>
  <!-- 5つの国を結ぶ条約 -->
  <path d="M270 104 L316 137 L298 190 L242 190 L224 137 Z M270 104 L298 190 M270 104 L242 190 M224 137 L316 137 M224 137 L298 190 M316 137 L242 190" class="st-f" stroke-width="1.5"/>
  <circle cx="270" cy="104" r="13" class="fl"/>
  <circle cx="316" cy="137" r="13" class="fl"/>
  <circle cx="298" cy="190" r="13" class="fl"/>
  <circle cx="242" cy="190" r="13" class="fl"/>
  <circle cx="224" cy="137" r="13" class="fl"/>
  <text x="270" y="108" class="t-xs mid on">国</text>
  <text x="316" y="141" class="t-xs mid on">国</text>
  <text x="298" y="194" class="t-xs mid on">国</text>
  <text x="242" y="194" class="t-xs mid on">国</text>
  <text x="224" y="141" class="t-xs mid on">国</text>
  <text x="270" y="160" class="t-xs mid ink halo">条約</text>
  <text x="270" y="222" class="t-xs mid ink">条約と慣行がルール</text>

  <!-- 裁判 -->
  <rect x="8" y="244" width="344" height="30" rx="8" class="tint"/>
  <text x="180" y="263" class="t-xs mid ink">国際司法裁判所も、争う両国の同意がないと原則裁けない</text>
</svg>
