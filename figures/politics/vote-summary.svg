<svg viewBox="0 0 360 290" xmlns="http://www.w3.org/2000/svg">
  <!-- 左：国の政治（国会） -->
  <rect x="12" y="20" width="156" height="140" rx="10" class="tint"/>
  <text x="90" y="40" class="t-xs mid soft">国の政治</text>
  <text x="90" y="62" class="t-m mid ink">国会</text>
  <text x="22" y="96" class="t-xs ink">小選挙区</text>
  <circle cx="92" cy="92" r="5" class="fl"/>
  <circle cx="106" cy="92" r="5" class="fl"/>
  <circle cx="120" cy="92" r="5" class="fl"/>
  <circle cx="134" cy="92" r="5" class="fl"/>
  <circle cx="148" cy="92" r="5" class="soft"/>
  <text x="22" y="122" class="t-xs ink">比例代表</text>
  <circle cx="92" cy="118" r="5" class="fl"/>
  <circle cx="106" cy="118" r="5" class="fl"/>
  <circle cx="120" cy="118" r="5" class="soft"/>
  <circle cx="134" cy="118" r="5" class="soft"/>
  <circle cx="148" cy="118" r="5" class="paper st" stroke-width="1.2"/>
  <text x="90" y="148" class="t-xs mid soft">同じ票でも議席が変わる</text>

  <!-- 右：地方の政治（首長と議会） -->
  <rect x="192" y="20" width="156" height="140" rx="10" class="tint"/>
  <text x="270" y="40" class="t-xs mid soft">地方の政治</text>
  <rect x="204" y="62" width="54" height="34" rx="8" class="fl"/>
  <text x="231" y="84" class="t-s mid on" font-weight="700">首長</text>
  <rect x="282" y="62" width="54" height="34" rx="8" class="fl"/>
  <text x="309" y="84" class="t-s mid on" font-weight="700">議会</text>
  <path d="M260 74 H279" class="st-f" stroke-width="1.5" marker-end="url(#a-politics)"/>
  <path d="M280 86 H261" class="st-f" stroke-width="1.5" marker-end="url(#a-politics)"/>
  <text x="231" y="114" class="t-xs mid ink">知事・市長</text>
  <text x="309" y="114" class="t-xs mid ink">議員</text>
  <text x="270" y="148" class="t-xs mid soft">互いにブレーキをかける</text>

  <!-- 下：国民・住民 -->
  <rect x="120" y="222" width="120" height="40" rx="20" class="fl"/>
  <text x="180" y="240" class="t-s mid on" font-weight="700">国民・住民</text>
  <text x="180" y="255" class="t-xs mid on">18歳以上・一人一票</text>
  <rect x="34" y="174" width="66" height="30" rx="8" class="paper st-f" stroke-width="1.5"/>
  <text x="67" y="194" class="t-s mid ink" font-weight="700">政党</text>
  <path d="M148 220 L104 196" class="st-f" stroke-width="2" marker-end="url(#a-politics)"/>
  <path d="M67 172 V166" class="st-f" stroke-width="2" marker-end="url(#a-politics)"/>
  <path d="M210 220 L256 166" class="st-f" stroke-width="2" marker-end="url(#a-politics)"/>
  <text x="140" y="190" class="t-xs ink">国の選挙</text>
  <text x="140" y="204" class="t-xs soft">政党に投票</text>
  <text x="244" y="194" class="t-xs ink">地方の選挙で</text>
  <text x="244" y="208" class="t-xs soft">首長も選ぶ</text>

  <!-- 点線：直接請求 -->
  <path d="M242 250 C 318 250, 342 220, 340 166" class="st-f dash" stroke-width="1.5" marker-end="url(#a-politics)"/>
  <text x="300" y="276" class="t-xs mid ink">署名で直接請求</text>
  <circle cx="20" cy="238" r="5" class="fl"/>
  <text x="30" y="242" class="t-xs soft">A党 45%</text>
  <circle cx="20" cy="256" r="5" class="soft"/>
  <text x="30" y="260" class="t-xs soft">B党 35%</text>
  <circle cx="20" cy="274" r="5" class="paper st" stroke-width="1.2"/>
  <text x="30" y="278" class="t-xs soft">C党 20%</text>
</svg>
