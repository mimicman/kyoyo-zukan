  <text x="270" y="18" class="t-s mid ink" font-weight="700">月（重力は約6分の1）</text>
  <path d="M206 30 H234" class="st" stroke-width="2"/>
  <path d="M220 30 V38 L213 39.0 L227 41.0 L213 43.0 L227 45.0 L213 47.0 L227 49.0 L220 50 V54" class="st" stroke-width="1.5"/>
  <rect x="205" y="54" width="30" height="24" rx="3" class="fl"/>
