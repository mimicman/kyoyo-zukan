  <text x="220" y="96" class="t-s mid fl" font-weight="700">約98N</text>
  <text x="220" y="110" class="t-xs mid soft">ばねばかり</text>
  <path d="M308 120 V146 M292 146 H324" class="st" stroke-width="2"/>
  <path d="M276 120 H340 M276 120 V104 M340 120 V104" class="st" stroke-width="2"/>
