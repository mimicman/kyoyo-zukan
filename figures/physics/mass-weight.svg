  <path d="M180 26 V164" class="st-line" stroke-width="1.5"/>
  <!-- 下：質量と重さの比較表 -->
  <rect x="8" y="174" width="344" height="110" rx="10" class="tint"/>
  <text x="236" y="194" class="t-xs mid soft">地球</text>
  <text x="310" y="194" class="t-xs mid soft">月</text>
  <text x="18" y="222" class="t-m ink">質量</text>
