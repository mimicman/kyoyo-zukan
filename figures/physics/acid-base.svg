  <path d="M68.6 34 V58" class="st-soft" stroke-width="1"/><text x="68.6" y="30" class="t-xs mid ink">レモン汁</text><path d="M90.9 52 V58" class="st-soft" stroke-width="1"/><text x="90.9" y="48" class="t-xs mid ink">酢</text><path d="M180.0 52 V58" class="st-soft" stroke-width="1"/><text x="180.0" y="48" class="t-xs mid ink">水</text><path d="M209.0 34 V58" class="st-soft" stroke-width="1"/><text x="209.0" y="30" class="t-xs mid ink">重曹水</text><path d="M246.9 52 V58" class="st-soft" stroke-width="1"/><text x="246.9" y="48" class="t-xs mid ink">石けん水</text>
