<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 昔のフットボールが、手を使うかどうかで2つに分かれる。下は近代スポーツの3つの柱 -->
  <rect x="80" y="12" width="200" height="50" rx="12" class="paper st-line" stroke-width="1.5"/>
  <text x="180" y="33" class="t-s mid ink" font-weight="700">昔のフットボール</text>
  <text x="180" y="51" class="t-xs mid soft">町や学校ごとに決まりがばらばら</text>

  <path d="M180 62 C180 92 90 84 90 108" class="st-f" stroke-width="2.5" marker-end="url(#a-lifestyle)"/>
  <path d="M180 62 C180 92 270 84 270 108" class="st-f" stroke-width="2.5" marker-end="url(#a-lifestyle)"/>
  <text x="180" y="92" class="t-xs mid fl halo" font-weight="700">手で持ってよい？</text>

  <rect x="20" y="112" width="140" height="64" rx="12" class="fl"/>
  <text x="90" y="134" class="t-m mid on">サッカー</text>
  <text x="90" y="152" class="t-xs mid on">1863年 協会ができる</text>
  <text x="90" y="168" class="t-xs mid on">手で持たない</text>

  <rect x="200" y="112" width="140" height="64" rx="12" class="tint st-f" stroke-width="1.5"/>
  <text x="270" y="134" class="t-m mid ink">ラグビー</text>
  <text x="270" y="152" class="t-xs mid ink">1871年 協会ができる</text>
  <text x="270" y="168" class="t-xs mid ink">持って走れる</text>

  <text x="12" y="200" class="t-xs soft">近代スポーツの3つの柱</text>
  <rect x="12" y="208" width="100" height="34" rx="17" class="tint"/>
  <text x="62" y="229" class="t-xs mid ink" font-weight="700">ルールを文章に</text>
  <path d="M114 225 H128" class="st-f" stroke-width="2" marker-end="url(#a-lifestyle)"/>
  <rect x="130" y="208" width="100" height="34" rx="17" class="tint"/>
  <text x="180" y="229" class="t-xs mid ink" font-weight="700">協会が守らせる</text>
  <path d="M232 225 H246" class="st-f" stroke-width="2" marker-end="url(#a-lifestyle)"/>
  <rect x="248" y="208" width="100" height="34" rx="17" class="fl"/>
  <text x="298" y="229" class="t-xs mid on" font-weight="700">どこでも同じ試合</text>

  <text x="180" y="266" class="t-xs mid soft">テニス・陸上・ボクシングも19世紀に規則が整った</text>
</svg>
