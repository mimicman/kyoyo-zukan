<svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
  <!-- フィルム → 映写機 → 光でスクリーンへ。下：のぞく箱と、大勢で見るスクリーンの比較 -->
  <path d="M132 87 L298 22 L298 152 Z" class="tint"/>
  <rect x="298" y="18" width="10" height="138" class="paper st" stroke-width="1.5"/>

  <rect x="14" y="14" width="50" height="152" rx="3" class="fl"/>
  <rect x="22" y="22" width="34" height="30" class="paper"/>
  <rect x="22" y="58" width="34" height="30" class="paper"/>
  <rect x="22" y="94" width="34" height="30" class="paper"/>
  <rect x="22" y="130" width="34" height="30" class="paper"/>
  <circle cx="30" cy="30" r="4" class="ink"/>
  <circle cx="36" cy="74" r="4" class="ink"/>
  <circle cx="42" cy="118" r="4" class="ink"/>
  <circle cx="48" cy="142" r="4" class="ink"/>

  <path d="M66 87 H76" class="st-f" stroke-width="2"/>
  <circle cx="90" cy="60" r="10" class="paper st-f" stroke-width="2"/>
  <circle cx="112" cy="60" r="10" class="paper st-f" stroke-width="2"/>
  <rect x="78" y="70" width="46" height="34" rx="4" class="tint st-f" stroke-width="1.5"/>
  <rect x="124" y="80" width="10" height="14" class="fl"/>

  <text x="214" y="92" class="t-s mid ink" font-weight="700">1秒に約16コマ</text>
  <text x="222" y="110" class="t-xs mid fl" font-weight="700">→ 動いて見える</text>
  <path d="M176 162 a9 9 0 0 1 18 0 Z M200 162 a9 9 0 0 1 18 0 Z M224 162 a9 9 0 0 1 18 0 Z M248 162 a9 9 0 0 1 18 0 Z M272 162 a9 9 0 0 1 18 0 Z" class="soft"/>

  <text x="39" y="182" class="t-xs mid soft">フィルム</text>
  <text x="101" y="122" class="t-xs mid soft">映写機</text>
  <text x="303" y="172" class="t-xs mid soft">スクリーン</text>

  <!-- 比較 -->
  <rect x="12" y="196" width="162" height="96" rx="10" class="paper st-line" stroke-width="1.5"/>
  <text x="24" y="214" class="t-xs soft">エジソンの</text>
  <text x="24" y="232" class="t-s ink" font-weight="700">キネトスコープ</text>
  <rect x="26" y="246" width="24" height="40" rx="3" class="tint st-f" stroke-width="1.5"/>
  <circle cx="60" cy="250" r="7" class="soft"/>
  <path d="M61 258 L64 286" class="st-soft" stroke-width="6" stroke-linecap="round"/>
  <text x="82" y="262" class="t-xs ink">箱をのぞき</text>
  <text x="82" y="278" class="t-xs ink">1人ずつ見る</text>

  <rect x="186" y="196" width="162" height="96" rx="10" class="tint st-f" stroke-width="1.5"/>
  <text x="198" y="214" class="t-xs soft">リュミエール兄弟の</text>
  <text x="198" y="232" class="t-s fl" font-weight="700">シネマトグラフ</text>
  <rect x="200" y="244" width="40" height="26" class="paper st" stroke-width="1.5"/>
  <path d="M202 286 a6 6 0 0 1 12 0 Z M216 286 a6 6 0 0 1 12 0 Z M230 286 a6 6 0 0 1 12 0 Z" class="soft"/>
  <text x="252" y="262" class="t-xs ink">スクリーンで</text>
  <text x="252" y="278" class="t-xs ink" font-weight="700">大勢で見る</text>
</svg>
