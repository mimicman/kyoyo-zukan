<svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
  <!-- グラフ：ある服を着る人の数。今の流行が下がるころ、次の流行が上がる -->
  <path d="M30 26 V188 H348" class="st" stroke-width="2"/>
  <text x="36" y="22" class="t-xs soft">着ている人の数</text>
  <text x="348" y="202" class="t-xs end soft">時間</text>

  <path d="M150 186 C200 186 210 70 250 70 C290 70 300 186 345 186" class="st" stroke-width="2.5"/>
  <path d="M40 186 C90 186 100 60 140 60 C180 60 190 186 240 186" class="st-f" stroke-width="3.5"/>
  <text x="140" y="50" class="t-xs mid fl" font-weight="700">今の流行</text>
  <text x="250" y="60" class="t-xs mid ink" font-weight="700">次の流行</text>

  <circle cx="66" cy="173" r="8" class="fl"/>
  <text x="66" y="177" class="t-xs mid on">1</text>
  <circle cx="94" cy="123" r="8" class="fl"/>
  <text x="94" y="127" class="t-xs mid on">2</text>
  <circle cx="140" cy="60" r="8" class="fl"/>
  <text x="140" y="64" class="t-xs mid on">3</text>
  <circle cx="186" cy="123" r="8" class="fl"/>
  <text x="186" y="127" class="t-xs mid on">4</text>

  <text x="12" y="222" class="t-xs ink">①一部が着る</text>
  <text x="94" y="222" class="t-xs ink">②まねて広がる</text>
  <text x="186" y="222" class="t-xs ink">③ありふれる</text>
  <text x="270" y="222" class="t-xs ink">④離れて次へ</text>

  <!-- 2つの気持ち -->
  <rect x="12" y="238" width="144" height="52" rx="12" class="tint st-f" stroke-width="1.5"/>
  <text x="84" y="260" class="t-m mid ink">まねたい</text>
  <text x="84" y="279" class="t-xs mid soft">仲間と同じでいたい</text>
  <rect x="204" y="238" width="144" height="52" rx="12" class="fl"/>
  <text x="276" y="260" class="t-m mid on">差をつけたい</text>
  <text x="276" y="279" class="t-xs mid on">人と違っていたい</text>
  <path d="M164 264 H196" class="st" stroke-width="2" marker-start="url(#a-ink)" marker-end="url(#a-ink)"/>
</svg>
