<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 脳 -->
  <ellipse cx="282" cy="40" rx="62" ry="28" class="paper"/>
  <ellipse cx="282" cy="40" rx="62" ry="28" class="st-soft" stroke-width="2"/>
  <text x="282" y="36" class="t-s mid ink">脳</text>
  <text x="282" y="54" class="t-xs mid soft">「熱い！」は後から</text>
  <path d="M280 132 V72" class="st-soft dash" stroke-width="1.5" marker-end="url(#a-soft)"/>

  <!-- 脊髄の断面 -->
  <circle cx="280" cy="176" r="40" class="tint"/>
  <circle cx="280" cy="176" r="40" class="st-f" stroke-width="2.5"/>
  <path d="M262 160 C270 170 290 170 298 160 C292 176 292 180 300 194 C290 184 270 184 260 194 C268 180 268 176 262 160 Z" class="fl" opacity="0.55"/>
  <text x="280" y="234" class="t-m mid fl">③ 脊髄</text>
  <text x="280" y="250" class="t-xs mid soft">ここで折り返す</text>

  <!-- 腕と炎 -->
  <path d="M20 214 C60 206 100 204 140 206 L140 226 C100 228 60 232 20 236 Z" class="paper"/>
  <path d="M20 214 C60 206 100 204 140 206 L140 226 C100 228 60 232 20 236 Z" class="st" stroke-width="2"/>
  <path d="M140 206 C152 204 160 208 162 216 C160 224 152 228 140 226" class="paper"/>
  <path d="M140 206 C152 204 160 208 162 216 C160 224 152 228 140 226" class="st" stroke-width="2"/>
  <path d="M170 262 C162 252 166 244 174 236 C176 246 182 246 180 238 C190 248 190 258 182 264 Z" class="fl"/>
  <text x="196" y="270" class="t-xs fl">熱い物</text>
  <text x="148" y="250" class="t-xs end ink">① 皮膚が感じる</text>

  <!-- 感覚神経（脊髄の背中側へ） -->
  <path d="M156 210 C170 160 210 142 250 150" class="st-f" stroke-width="2.5" marker-end="url(#a-medicine)"/>
  <text x="160" y="146" class="t-xs fl halo">② 感覚神経</text>

  <!-- 運動神経（腹側から筋肉へ） -->
  <path d="M254 196 C210 214 150 186 96 204" class="st" stroke-width="2.5" marker-end="url(#a-ink)"/>
  <text x="176" y="198" class="t-xs ink halo">④ 運動神経</text>

  <!-- ⑤ 筋肉が縮む -->
  <ellipse cx="70" cy="214" rx="26" ry="8" class="soft" opacity="0.6"/>
  <path d="M60 196 H22" class="st" stroke-width="2.5" marker-end="url(#a-ink)"/>
  <text x="20" y="186" class="t-xs ink">⑤ 筋肉が縮み手を引く</text>

  <text x="14" y="28" class="t-s ink">反射：考える前に体が動く</text>
  <text x="14" y="48" class="t-xs soft">脳を通らない近道なので速い</text>
</svg>
