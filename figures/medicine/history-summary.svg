<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 医学の歴史：上の段は病気の考え方と調べ方の4段階、中の段は手術の2つの壁を越えた歩み、下の段は感染症の流行と予防の前進 -->
  <text x="12" y="14" class="t-xs soft">上の段：病気の考え方と調べ方</text>
  <rect x="10" y="22" width="78" height="56" rx="10" class="tint"/>
  <text x="49" y="45" class="t-s mid ink" font-weight="700">体液説</text>
  <text x="49" y="64" class="t-xs mid soft">ヒポクラテス</text>
  <text x="49" y="94" class="t-xs mid ink">古代</text>
  <path d="M89 50 H96" class="st-f" stroke-width="2" marker-end="url(#a-medicine)"/>
  <rect x="97" y="22" width="78" height="56" rx="10" class="tint"/>
  <text x="136" y="45" class="t-s mid ink" font-weight="700">解剖</text>
  <text x="136" y="64" class="t-xs mid soft">ヴェサリウス</text>
  <text x="136" y="94" class="t-xs mid ink">16〜17世紀</text>
  <path d="M176 50 H183" class="st-f" stroke-width="2" marker-end="url(#a-medicine)"/>
  <rect x="184" y="22" width="78" height="56" rx="10" class="tint"/>
  <text x="223" y="45" class="t-s mid ink" font-weight="700">病原体</text>
  <text x="223" y="64" class="t-xs mid soft">コッホら</text>
  <text x="223" y="94" class="t-xs mid ink">19世紀後半</text>
  <path d="M263 50 H270" class="st-f" stroke-width="2" marker-end="url(#a-medicine)"/>
  <rect x="271" y="22" width="78" height="56" rx="10" class="fl"/>
  <text x="310" y="45" class="t-s mid on" font-weight="700">体を写す</text>
  <text x="310" y="64" class="t-xs mid on">レントゲン</text>
  <text x="310" y="94" class="t-xs mid ink">1895年〜</text>

  <path d="M12 106 H348" class="st-line" stroke-width="1"/>

  <!-- 中の段：手術 -->
  <text x="12" y="132" class="t-s ink" font-weight="700">手術</text>
  <rect x="58" y="116" width="86" height="24" rx="12" class="tint"/>
  <text x="101" y="132" class="t-xs mid ink">1846 麻酔</text>
  <path d="M146 128 H156" class="st-f" stroke-width="2" marker-end="url(#a-medicine)"/>
  <rect x="160" y="116" width="86" height="24" rx="12" class="tint"/>
  <text x="203" y="132" class="t-xs mid ink">1867 消毒</text>
  <path d="M248 128 H258" class="st-f" stroke-width="2" marker-end="url(#a-medicine)"/>
  <rect x="262" y="116" width="86" height="24" rx="12" class="fl"/>
  <text x="305" y="132" class="t-xs mid on">無菌手術へ</text>
  <text x="58" y="158" class="t-xs soft">痛みと感染、2つの壁を越える</text>

  <path d="M12 170 H348" class="st-line" stroke-width="1"/>

  <!-- 下の段：感染症との戦い -->
  <text x="12" y="194" class="t-s ink" font-weight="700">感染症</text>
  <path d="M60 210 H350" class="st-line" stroke-width="1.5"/>
  <circle cx="90" cy="210" r="7" class="soft"/>
  <text x="90" y="232" class="t-xs mid ink">ペスト</text>
  <text x="90" y="246" class="t-xs mid soft">14世紀</text>
  <circle cx="170" cy="210" r="7" class="fl"/>
  <text x="170" y="232" class="t-xs mid ink">種痘</text>
  <text x="170" y="246" class="t-xs mid soft">1796年</text>
  <circle cx="250" cy="210" r="7" class="soft"/>
  <text x="250" y="232" class="t-xs mid ink">コレラの地図</text>
  <text x="250" y="246" class="t-xs mid soft">1854年</text>
  <circle cx="330" cy="210" r="7" class="fl"/>
  <text x="350" y="232" class="t-xs end ink">天然痘根絶</text>
  <text x="350" y="246" class="t-xs end soft">1980年</text>
  <text x="12" y="270" class="t-xs soft">灰色の点＝大流行、色の点＝予防の前進</text>
</svg>
