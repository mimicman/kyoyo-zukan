<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <text x="14" y="22" class="t-xs soft">流行に苦しみ → 原因を知り → 防ぐ手を得てきた</text>
  <path d="M14 150 H346" class="st" stroke-width="2.5" marker-end="url(#a-ink)"/>
  <circle cx="40" cy="150" r="7" class="ink"/>
  <path d="M40 142 V118" class="st-line" stroke-width="1.5"/>
  <text x="40" y="72" class="t-s mid ink">14世紀</text>
  <text x="40" y="92" class="t-s mid ink">ペスト</text>
  <text x="40" y="110" class="t-xs mid soft">欧州で大流行</text>
  <circle cx="110" cy="150" r="7" class="fl"/>
  <path d="M110 158 V182" class="st-line" stroke-width="1.5"/>
  <text x="110" y="200" class="t-s mid ink">1796</text>
  <text x="110" y="220" class="t-s mid fl">種痘</text>
  <text x="110" y="238" class="t-xs mid soft">ジェンナー</text>
  <circle cx="180" cy="150" r="7" class="ink"/>
  <path d="M180 142 V118" class="st-line" stroke-width="1.5"/>
  <text x="180" y="72" class="t-s mid ink">1854</text>
  <text x="180" y="92" class="t-s mid ink">コレラ</text>
  <text x="180" y="110" class="t-xs mid soft">原因の井戸を特定</text>
  <circle cx="250" cy="150" r="7" class="ink"/>
  <path d="M250 158 V182" class="st-line" stroke-width="1.5"/>
  <text x="250" y="200" class="t-s mid ink">1918</text>
  <text x="250" y="220" class="t-s mid ink">スペイン風邪</text>
  <text x="250" y="238" class="t-xs mid soft">世界で大流行</text>
  <circle cx="320" cy="150" r="7" class="fl"/>
  <path d="M320 142 V118" class="st-line" stroke-width="1.5"/>
  <text x="320" y="72" class="t-s mid ink">1980</text>
  <text x="320" y="92" class="t-s mid fl">天然痘</text>
  <text x="320" y="110" class="t-xs mid soft">根絶を宣言</text>
  <!-- 凡例 -->
  <circle cx="20" cy="266" r="5" class="ink"/>
  <text x="30" y="270" class="t-xs soft">大流行</text>
  <circle cx="90" cy="266" r="5" class="fl"/>
  <text x="100" y="270" class="t-xs soft">予防の前進</text>
</svg>
