<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 資源と都市：資源も人も均等には散らばらず、条件のそろった所に集まる -->
  <text x="16" y="24" class="t-m ink">資源も人も、一部の場所に集まる</text>

  <!-- 左：資源（地層の断面） -->
  <rect x="12" y="36" width="164" height="150" rx="10" class="bgc"/>
  <text x="94" y="56" class="t-s mid ink" font-weight="700">資源</text>
  <path d="M24 76 H164" class="st" stroke-width="1.5"/>
  <text x="160" y="72" class="t-xs end soft">地面</text>
  <path d="M24 156 C60 156 70 116 94 116 C118 116 128 156 164 156" class="st-soft" stroke-width="1" fill="none"/>
  <path d="M24 136 C60 136 70 96 94 96 C118 96 128 136 164 136" class="st" stroke-width="3" fill="none"/>
  <path d="M75 116 C82 101 106 101 113 116 Z" class="fl"/>
  <path d="M110 108 L132 92" class="st-soft" stroke-width="1"/>
  <text x="134" y="92" class="t-xs ink">石油</text>
  <text x="94" y="176" class="t-xs mid soft">条件のそろった地層にだけ</text>

  <!-- 右：人（農村から都市へ） -->
  <rect x="184" y="36" width="164" height="150" rx="10" class="bgc"/>
  <text x="266" y="56" class="t-s mid ink" font-weight="700">人</text>
  <circle cx="200" cy="84" r="3" class="soft"/>
  <circle cx="222" cy="98" r="3" class="soft"/>
  <circle cx="204" cy="118" r="3" class="soft"/>
  <circle cx="228" cy="130" r="3" class="soft"/>
  <circle cx="200" cy="146" r="3" class="soft"/>
  <circle cx="220" cy="156" r="3" class="soft"/>
  <path d="M236 108 L276 116" class="st-f" stroke-width="2" marker-end="url(#a-geography)"/>
  <path d="M236 146 L276 134" class="st-f" stroke-width="2" marker-end="url(#a-geography)"/>
  <rect x="286" y="104" width="12" height="52" class="fl"/>
  <rect x="300" y="82" width="14" height="74" class="fl"/>
  <rect x="316" y="96" width="12" height="60" class="fl"/>
  <rect x="330" y="118" width="10" height="38" class="fl"/>
  <path d="M282 156 H342" class="st" stroke-width="1.2"/>
  <text x="214" y="176" class="t-xs mid soft">農村</text>
  <text x="314" y="176" class="t-xs mid soft">都市</text>

  <!-- 結果 -->
  <path d="M94 186 V202" class="st-f" stroke-width="2" marker-end="url(#a-geography)"/>
  <path d="M266 186 V202" class="st-f" stroke-width="2" marker-end="url(#a-geography)"/>
  <rect x="12" y="206" width="336" height="62" rx="10" class="tint"/>
  <path d="M180 216 V258" class="st-line" stroke-width="1"/>
  <text x="94" y="230" class="t-s mid ink" font-weight="700">資源の貿易</text>
  <text x="94" y="250" class="t-xs mid soft">国どうしの関係に響く</text>
  <text x="266" y="230" class="t-s mid ink" font-weight="700">過密と過疎</text>
  <text x="266" y="250" class="t-xs mid soft">都市の混雑・地方の人口減</text>
</svg>
