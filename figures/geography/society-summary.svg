<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 資源と都市：①資源 ②人 ③農地 ④人口の形。どれも均等には散らばらない -->
  <text x="16" y="24" class="t-m ink">資源・農地・人は、どこにどう集まるか</text>

  <!-- ① 資源 -->
  <rect x="12" y="36" width="164" height="88" rx="10" class="bgc"/>
  <text x="94" y="56" class="t-s mid ink" font-weight="700">① 資源</text>
  <path d="M30 100 C60 100 70 72 94 72 C118 72 128 100 158 100" class="st" stroke-width="2.5"/>
  <path d="M76 84 C84 70 104 70 112 84 Z" class="fl"/>
  <text x="94" y="118" class="t-xs mid soft">条件のそろった地層にだけ</text>

  <!-- ② 人（都市化） -->
  <rect x="184" y="36" width="164" height="88" rx="10" class="bgc"/>
  <text x="266" y="56" class="t-s mid ink" font-weight="700">② 人</text>
  <circle cx="202" cy="72" r="3" class="soft"/>
  <circle cx="218" cy="84" r="3" class="soft"/>
  <circle cx="204" cy="96" r="3" class="soft"/>
  <circle cx="220" cy="102" r="3" class="soft"/>
  <path d="M232 86 L276 86" class="st-f" stroke-width="2" marker-end="url(#a-geography)"/>
  <rect x="290" y="76" width="10" height="28" class="fl"/>
  <rect x="302" y="64" width="12" height="40" class="fl"/>
  <rect x="316" y="72" width="10" height="32" class="fl"/>
  <path d="M286 104 H332" class="st" stroke-width="1.2"/>
  <text x="266" y="118" class="t-xs mid soft">仕事のある都市へ移る</text>

  <!-- ③ 農地（チューネン圏） -->
  <rect x="12" y="132" width="164" height="88" rx="10" class="bgc"/>
  <text x="94" y="152" class="t-s mid ink" font-weight="700">③ 農地</text>
  <path d="M58 198 A36 36 0 0 1 130 198 Z" class="tint"/>
  <path d="M70 198 A24 24 0 0 1 118 198 Z" class="paper"/>
  <path d="M82 198 A12 12 0 0 1 106 198 Z" class="tint"/>
  <path d="M58 198 A36 36 0 0 1 130 198 M70 198 A24 24 0 0 1 118 198 M82 198 A12 12 0 0 1 106 198" class="st-soft" stroke-width="1"/>
  <rect x="90" y="188" width="8" height="10" class="fl"/>
  <path d="M50 198 H138" class="st" stroke-width="1.2"/>
  <text x="94" y="214" class="t-xs mid soft">都市からの距離で決まる</text>

  <!-- ④ 人口の形 -->
  <rect x="184" y="132" width="164" height="88" rx="10" class="bgc"/>
  <text x="266" y="152" class="t-s mid ink" font-weight="700">④ 人口の形</text>
  <rect x="210" y="190" width="40" height="7" class="fl"/>
  <rect x="214" y="182" width="32" height="7" class="fl"/>
  <rect x="218" y="174" width="24" height="7" class="fl"/>
  <rect x="222" y="166" width="16" height="7" class="fl"/>
  <rect x="226" y="158" width="8" height="7" class="fl"/>
  <path d="M256 178 H272" class="st-f" stroke-width="2" marker-end="url(#a-geography)"/>
  <rect x="290" y="190" width="24" height="7" class="fl"/>
  <rect x="286" y="182" width="32" height="7" class="fl"/>
  <rect x="284" y="174" width="36" height="7" class="fl"/>
  <rect x="287" y="166" width="30" height="7" class="fl"/>
  <rect x="293" y="158" width="18" height="7" class="fl"/>
  <text x="266" y="214" class="t-xs mid soft">年齢ごとの人の数</text>

  <!-- 結果 -->
  <rect x="12" y="228" width="336" height="44" rx="10" class="tint"/>
  <text x="180" y="246" class="t-xs mid ink">集まる所と少ない所の差が、貿易・過密と過疎・高齢化を生む</text>
  <text x="180" y="262" class="t-xs mid soft">「なぜそこに集まるのか」と問うと背景が見える</text>
</svg>
