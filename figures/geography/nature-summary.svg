<svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
  <!-- 地球と気候：三つの原因（陸と海の配置・地軸の傾き・海流）→ 気候 → 暮らし -->
  <text x="16" y="24" class="t-m ink">三つの原因が気候を決め、暮らしを決める</text>

  <!-- 原因1：陸と海の配置 -->
  <rect x="12" y="36" width="108" height="96" rx="10" class="bgc"/>
  <text x="66" y="56" class="t-s mid ink" font-weight="700">陸と海の配置</text>
  <rect x="22" y="66" width="88" height="36" rx="6" class="tint"/>
  <path d="M22 102 V82 C38 76 50 70 64 72 C78 74 82 88 94 90 C102 92 106 96 110 102 Z" class="soft" opacity="0.55"/>
  <text x="40" y="96" class="t-xs mid ink">陸</text>
  <text x="96" y="80" class="t-xs mid ink">海</text>
  <text x="66" y="122" class="t-xs mid soft">海辺はおだやか</text>

  <!-- 原因2：地軸の傾き -->
  <rect x="126" y="36" width="108" height="96" rx="10" class="bgc"/>
  <text x="180" y="56" class="t-s mid ink" font-weight="700">地軸の傾き</text>
  <circle cx="160" cy="86" r="16" class="tint"/>
  <circle cx="160" cy="86" r="16" class="st" stroke-width="1.2"/>
  <path d="M153 67 L167 105" class="st" stroke-width="1.5"/>
  <path d="M144 86 H176" class="st-soft" stroke-width="1"/>
  <circle cx="214" cy="86" r="9" class="fl"/>
  <path d="M214 72 V69 M214 100 V103 M200 86 H197 M228 86 H231" class="st-f" stroke-width="1.5"/>
  <path d="M198 86 H182" class="st-soft dash" stroke-width="1.2" marker-end="url(#a-soft)"/>
  <text x="180" y="122" class="t-xs mid soft">太陽の当たり方</text>

  <!-- 原因3：海流 -->
  <rect x="240" y="36" width="108" height="96" rx="10" class="bgc"/>
  <text x="294" y="56" class="t-s mid ink" font-weight="700">海流</text>
  <rect x="250" y="66" width="88" height="36" rx="6" class="tint"/>
  <path d="M262 78 H326" class="st-f" stroke-width="2.5" marker-end="url(#a-geography)"/>
  <path d="M326 92 H262" class="st-soft dash" stroke-width="2.5" marker-end="url(#a-soft)"/>
  <text x="294" y="122" class="t-xs mid soft">熱を運ぶ海の流れ</text>

  <!-- 合わさって気候になる -->
  <path d="M66 132 L130 152" class="st-f" stroke-width="2" marker-end="url(#a-geography)"/>
  <path d="M180 132 V148" class="st-f" stroke-width="2" marker-end="url(#a-geography)"/>
  <path d="M294 132 L230 152" class="st-f" stroke-width="2" marker-end="url(#a-geography)"/>
  <rect x="90" y="154" width="180" height="44" rx="10" class="fl"/>
  <text x="180" y="174" class="t-m mid on" font-weight="700">気候</text>
  <text x="180" y="190" class="t-xs mid on">気温・雨・季節の差</text>
  <path d="M180 198 V212" class="st-f" stroke-width="2" marker-end="url(#a-geography)"/>

  <!-- 結果：暮らし -->
  <rect x="12" y="216" width="336" height="76" rx="10" class="bgc"/>
  <text x="26" y="240" class="t-s ink" font-weight="700">暮らし</text>
  <text x="26" y="256" class="t-xs soft">家・服・食</text>
  <path d="M100 248 L124 232 L148 248 Z" class="soft"/>
  <rect x="106" y="248" width="36" height="12" class="tint"/>
  <path d="M106 248 H142 V260 H106 Z M110 260 V270 M138 260 V270" class="st" stroke-width="1.2"/>
  <text x="124" y="285" class="t-xs mid ink">暑い：高床</text>
  <rect x="194" y="238" width="44" height="32" class="soft"/>
  <rect x="212" y="248" width="8" height="8" class="paper"/>
  <text x="216" y="285" class="t-xs mid ink">乾燥：厚い壁</text>
  <path d="M284 246 L304 228 L324 246 Z" class="soft"/>
  <rect x="288" y="246" width="32" height="24" class="tint"/>
  <path d="M288 246 H320 V270 H288 Z" class="st" stroke-width="1.2"/>
  <rect x="297" y="251" width="14" height="12" class="paper"/>
  <path d="M297 251 H311 V263 H297 Z M300 254 H308 V260 H300 Z" class="st" stroke-width="1"/>
  <text x="304" y="285" class="t-xs mid ink">寒い：二重窓</text>
</svg>
