<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- 地政学：陸（ハートランドと沿岸部）・海（海峡）・線（国境）・海の境界（EEZ）の見方を1枚の模式図に -->
  <text x="16" y="24" class="t-m ink">陸・海・線で、国の動きを読む</text>
  <rect x="12" y="34" width="336" height="210" rx="12" class="tint"/>
  <text x="24" y="238" class="t-xs soft">海</text>

  <!-- 大陸 -->
  <path d="M30 64 C60 48 120 46 180 50 C240 46 300 52 330 66 L330 120 C310 138 280 148 250 154 C220 160 190 150 160 152 C120 156 80 150 50 140 C36 130 30 110 30 90 Z" class="paper"/>
  <path d="M30 64 C60 48 120 46 180 50 C240 46 300 52 330 66 L330 120 C310 138 280 148 250 154 C220 160 190 150 160 152 C120 156 80 150 50 140 C36 130 30 110 30 90 Z" class="st-soft" fill="none" stroke-width="1.2"/>
  <!-- 島 -->
  <path d="M226 186 C240 178 280 176 320 182 C334 188 334 208 318 216 C290 224 250 222 232 212 C222 204 220 192 226 186 Z" class="paper"/>
  <path d="M226 186 C240 178 280 176 320 182 C334 188 334 208 318 216 C290 224 250 222 232 212 C222 204 220 192 226 186 Z" class="st-soft" fill="none" stroke-width="1.2"/>

  <!-- ① 内陸と沿岸部 -->
  <ellipse cx="222" cy="94" rx="58" ry="26" class="fl" opacity="0.85"/>
  <text x="222" y="92" class="t-s mid on" font-weight="700">① 内陸</text>
  <text x="222" y="108" class="t-xs mid on">ハートランド</text>
  <text x="206" y="140" class="t-xs mid soft">沿岸部（リムランド）</text>

  <!-- ③ 国境：直線と、山・川に沿う線 -->
  <path d="M72 56 V144" class="st" stroke-width="1.5" stroke-dasharray="5 3"/>
  <path d="M112 52 C120 68 104 84 114 100 C122 114 104 130 116 150" class="st" stroke-width="1.5" fill="none"/>
  <text x="92" y="74" class="t-xs mid ink halo">③国境</text>
  <text x="52" y="104" class="t-xs mid soft">直線</text>
  <text x="140" y="104" class="t-xs mid soft">山・川</text>

  <!-- ② 海の道と海峡 -->
  <path d="M22 214 C80 206 150 176 200 170 C240 166 290 160 338 146" class="st-f dash" stroke-width="2" fill="none" marker-end="url(#a-geography)"/>
  <circle cx="236" cy="167" r="9" class="st-f" fill="none" stroke-width="2"/>
  <path d="M150 212 L226 172" class="st-soft" stroke-width="1"/>
  <text x="40" y="224" class="t-xs ink">② 海の道が細く集まる所</text>

  <!-- ④ 海の境界：島のまわりの領海・EEZ -->
  <ellipse cx="278" cy="200" rx="64" ry="28" class="st-f" stroke-width="1.8" stroke-dasharray="3 3"/>
  <text x="278" y="238" class="t-xs mid ink">④ 島のまわりの海の境界</text>

  <!-- 凡例：章のカード -->
  <circle cx="20" cy="256" r="4" class="fl"/>
  <text x="30" y="260" class="t-xs ink">① 陸の力と海の力（ランド・シーパワー）</text>
  <circle cx="20" cy="273" r="4" class="fl"/>
  <text x="30" y="277" class="t-xs ink">② 物流の急所（海峡とチョークポイント）</text>
  <circle cx="20" cy="290" r="4" class="fl"/>
  <text x="30" y="294" class="t-xs ink">③ 国どうしを分ける線（国境の決まり方）</text>
  <circle cx="20" cy="307" r="4" class="fl"/>
  <text x="30" y="311" class="t-xs ink">④ 海を区切る線（領海と排他的経済水域）</text>
</svg>
