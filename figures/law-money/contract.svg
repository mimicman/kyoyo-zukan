<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 2人の意思表示 -->
  <rect x="14" y="22" width="92" height="60" rx="10" class="tint st-f" stroke-width="1.5"/>
  <circle cx="36" cy="52" r="9" class="st-f" stroke-width="1.5"/>
  <text x="74" y="57" class="t-m mid ink">買い手</text>
  <rect x="254" y="22" width="92" height="60" rx="10" class="tint st-f" stroke-width="1.5"/>
  <circle cx="276" cy="52" r="9" class="st-f" stroke-width="1.5"/>
  <text x="314" y="57" class="t-m mid ink">売り手</text>

  <path d="M108 40 H250" class="st-f" stroke-width="2" marker-end="url(#a-law-money)"/>
  <text x="180" y="32" class="t-xs mid ink">①申し込み「これください」</text>
  <path d="M252 66 H110" class="st-f" stroke-width="2" marker-end="url(#a-law-money)"/>
  <text x="180" y="82" class="t-xs mid ink">②承諾「はい、どうぞ」</text>

  <!-- 意思が合って成立 -->
  <circle cx="180" cy="122" r="25" class="fl"/>
  <text x="180" y="127" class="t-m mid on">成立</text>
  <text x="214" y="118" class="t-xs soft">意思が合う</text>

  <!-- 双方の義務 -->
  <path d="M162 140 L118 168" class="st-f" stroke-width="2" marker-end="url(#a-law-money)"/>
  <path d="M198 140 L242 168" class="st-f" stroke-width="2" marker-end="url(#a-law-money)"/>
  <rect x="14" y="170" width="156" height="44" rx="10" class="paper st-f" stroke-width="1.5"/>
  <text x="92" y="188" class="t-xs mid soft">買い手の義務</text>
  <text x="92" y="206" class="t-m mid ink">代金を払う</text>
  <rect x="190" y="170" width="156" height="44" rx="10" class="paper st-f" stroke-width="1.5"/>
  <text x="268" y="188" class="t-xs mid soft">売り手の義務</text>
  <text x="268" y="206" class="t-m mid ink">品物を渡す</text>

  <!-- 補足 -->
  <rect x="14" y="226" width="156" height="48" rx="10" class="bgc"/>
  <text x="92" y="246" class="t-s mid ink">契約書は証拠</text>
  <text x="92" y="264" class="t-xs mid soft">口約束でも成立する</text>
  <rect x="190" y="226" width="156" height="48" rx="10" class="bgc"/>
  <text x="268" y="243" class="t-s mid fl">取り消せる場合</text>
  <text x="268" y="257" class="t-xs mid ink">だまされた・おどされた</text>
  <text x="268" y="270" class="t-xs mid ink">未成年が同意なしで</text>
</svg>
