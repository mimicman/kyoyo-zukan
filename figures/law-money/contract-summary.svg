<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- まん中の「わたし」と、4つの関係 -->
  <path d="M152 118 L132 96 M208 118 L228 96 M152 162 L132 184 M208 162 L228 184" class="st-soft" stroke-width="1.5"/>

  <rect x="10" y="16" width="130" height="80" rx="10" class="tint st-f" stroke-width="1.5"/>
  <text x="75" y="42" class="t-l mid ink">契約</text>
  <text x="75" y="62" class="t-xs mid ink">買う・借りる・働く</text>
  <text x="75" y="82" class="t-xs mid soft">約束で成り立つ</text>

  <rect x="220" y="16" width="130" height="80" rx="10" class="tint st-f" stroke-width="1.5"/>
  <text x="285" y="42" class="t-l mid ink">消費者を守る</text>
  <text x="285" y="62" class="t-xs mid ink">事業者との差を補う</text>
  <text x="285" y="82" class="t-xs mid soft">クーリング・オフ</text>

  <rect x="10" y="184" width="130" height="80" rx="10" class="tint st-f" stroke-width="1.5"/>
  <text x="75" y="210" class="t-l mid ink">家族と相続</text>
  <text x="75" y="230" class="t-xs mid ink">財産を引き継ぐ</text>
  <text x="75" y="250" class="t-xs mid soft">遺言・法定相続人</text>

  <rect x="220" y="184" width="130" height="80" rx="10" class="tint st-f" stroke-width="1.5"/>
  <text x="285" y="210" class="t-l mid ink">知的財産</text>
  <text x="285" y="230" class="t-xs mid ink">創ったものを守る</text>
  <text x="285" y="250" class="t-xs mid soft">著作権・特許</text>

  <!-- 消費者保護が契約を補う -->
  <path d="M218 40 H143" class="st-f dash" stroke-width="1.5" marker-end="url(#a-law-money)"/>
  <text x="180" y="32" class="t-xs mid ink">補う</text>

  <circle cx="180" cy="140" r="34" class="fl"/>
  <text x="180" y="146" class="t-m mid on">わたし</text>
  <text x="180" y="94" class="t-xs mid soft">私法の世界</text>
  <text x="180" y="200" class="t-xs mid soft">人と人の</text>
  <text x="180" y="214" class="t-xs mid soft">約束と権利</text>
</svg>
