<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 国（上）と人（下）：縦の関係が公法、横の関係が私法 -->
  <path d="M130 30 L180 10 L230 30 Z" class="fl"/>
  <rect x="130" y="30" width="100" height="36" rx="4" class="fl"/>
  <text x="180" y="54" class="t-m mid on">国・自治体</text>

  <rect x="30" y="188" width="100" height="50" rx="10" class="tint st-f" stroke-width="1.5"/>
  <circle cx="54" cy="213" r="9" class="st-f" stroke-width="1.5"/>
  <text x="94" y="218" class="t-m mid ink">人</text>
  <rect x="230" y="188" width="100" height="50" rx="10" class="tint st-f" stroke-width="1.5"/>
  <circle cx="254" cy="213" r="9" class="st-f" stroke-width="1.5"/>
  <text x="300" y="218" class="t-m mid ink">人・会社</text>

  <!-- 公法（縦の関係） -->
  <path d="M152 70 L92 182" class="st-f" stroke-width="2.5" marker-start="url(#a-law-money)" marker-end="url(#a-law-money)"/>
  <path d="M208 70 L268 182" class="st-f" stroke-width="2.5" marker-start="url(#a-law-money)" marker-end="url(#a-law-money)"/>
  <text x="104" y="112" class="t-l end fl">公法</text>
  <text x="104" y="130" class="t-xs end ink">憲法・刑法</text>
  <text x="256" y="112" class="t-l fl">公法</text>
  <text x="256" y="130" class="t-xs ink">税・行政の法</text>

  <!-- 私法（横の関係） -->
  <path d="M136 213 H224" class="st-f" stroke-width="2.5" marker-start="url(#a-law-money)" marker-end="url(#a-law-money)"/>
  <text x="180" y="204" class="t-l mid fl">私法</text>
  <text x="180" y="232" class="t-xs mid ink">民法・商法</text>

  <!-- 社会法：国が人どうしの間に入る -->
  <path d="M180 70 V186" class="st-soft dash" stroke-width="1.5" marker-end="url(#a-soft)"/>
  <text x="186" y="150" class="t-s ink halo">社会法</text>

  <text x="180" y="258" class="t-xs mid soft">私法は、本人どうしの自由な約束が基本（私的自治）</text>
  <text x="180" y="274" class="t-xs mid soft">社会法：労働法など。国が間に入り弱い側を守る</text>
</svg>
