  <g><circle cx="32" cy="76" r="6" class="soft"/><circle cx="52" cy="76" r="6" class="soft"/><circle cx="72" cy="76" r="6" class="soft"/><circle cx="92" cy="76" r="6" class="soft"/><circle cx="32" cy="96" r="6" class="soft"/><circle cx="52" cy="96" r="6" class="soft"/><circle cx="72" cy="96" r="6" class="soft"/><circle cx="92" cy="96" r="6" class="soft"/><circle cx="32" cy="116" r="6" class="soft"/><circle cx="52" cy="116" r="6" class="soft"/><circle cx="72" cy="116" r="6" class="soft"/><circle cx="92" cy="116" r="6" class="soft"/><circle cx="32" cy="136" r="6" class="soft"/><circle cx="52" cy="136" r="6" class="soft"/><circle cx="72" cy="136" r="6" class="soft"/><circle cx="92" cy="136" r="6" class="soft"/></g>
  <path d="M104 98 L136 110" class="st-f" stroke-width="2" marker-end="url(#a-law-money)"/>
