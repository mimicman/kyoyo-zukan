  <path d="M220 112 L246 54 M222 118 L246 96 M222 124 L246 140 M220 130 L246 184" class="st-f" stroke-width="1.5"/>
  <text x="300" y="26" class="t-xs mid soft">困ったときに給付</text>
  <rect x="250" y="34" width="100" height="38" rx="8" class="tint st-f" stroke-width="1.5"/>
  <text x="300" y="49" class="t-xs mid soft">病気・けが</text>
  <text x="300" y="65" class="t-s mid ink">健康保険</text>
  <rect x="250" y="78" width="100" height="38" rx="8" class="tint st-f" stroke-width="1.5"/>
