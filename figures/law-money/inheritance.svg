<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 家系図：まん中が亡くなった人 -->
  <path d="M180 68 V108" class="st" stroke-width="1.5"/>
  <path d="M230 49 H295 V108" class="st" stroke-width="1.5"/>
  <path d="M106 128 H128 M106 134 H128" class="st" stroke-width="1.5"/>
  <path d="M180 154 V176 M140 176 H220 M140 176 V198 M220 176 V198" class="st" stroke-width="1.5"/>

  <rect x="130" y="30" width="100" height="38" rx="8" class="tint st-f" stroke-width="1.5"/>
  <text x="180" y="54" class="t-m mid ink">②親</text>

  <rect x="128" y="110" width="104" height="44" rx="8" class="bgc st" stroke-width="2"/>
  <text x="180" y="137" class="t-s mid ink">亡くなった人</text>

  <rect x="12" y="106" width="94" height="52" rx="8" class="fl"/>
  <text x="59" y="128" class="t-m mid on">配偶者</text>
  <text x="59" y="146" class="t-xs mid on">いつも相続人</text>

  <rect x="248" y="110" width="100" height="44" rx="8" class="tint st-f" stroke-width="1.5"/>
  <text x="298" y="137" class="t-m mid ink">③兄弟姉妹</text>

  <rect x="104" y="198" width="72" height="38" rx="8" class="tint st-f" stroke-width="1.5"/>
  <text x="140" y="222" class="t-m mid ink">①子</text>
  <rect x="184" y="198" width="72" height="38" rx="8" class="tint st-f" stroke-width="1.5"/>
  <text x="220" y="222" class="t-m mid ink">①子</text>

  <!-- 遺言 -->
  <rect x="12" y="14" width="106" height="70" rx="8" class="paper st-f dash" stroke-width="1.5"/>
  <text x="65" y="36" class="t-s mid fl">遺言があれば</text>
  <text x="65" y="54" class="t-xs mid ink">原則それに従う</text>
  <text x="65" y="72" class="t-xs mid soft">（遺留分あり）</text>

  <text x="180" y="258" class="t-xs mid ink">先の順番の人がいれば、後の人は相続しない</text>
  <text x="180" y="274" class="t-xs mid soft">財産には借金も含まれ、相続の放棄もできる</text>
</svg>
