  <rect x="236" y="126" width="8" height="8" class="ink"/>
  <text x="232" y="122" class="t-xs end soft halo">江戸</text>

  <!-- 流れ -->
  <rect x="12" y="228" width="100" height="44" rx="10" class="tint"/>
  <text x="62" y="246" class="t-s mid ink">4つの窓口</text>
  <text x="62" y="263" class="t-xs mid soft">約200年</text>
  <path d="M114 250 H124" class="st-f" stroke-width="2" marker-end="url(#a-japan)"/>
  <rect x="128" y="228" width="100" height="44" rx="10" class="fl"/>
  <text x="178" y="247" class="t-m mid on">1853</text>
  <text x="178" y="264" class="t-xs mid on">ペリー来航</text>
  <path d="M230 250 H240" class="st-f" stroke-width="2" marker-end="url(#a-japan)"/>
  <rect x="244" y="228" width="104" height="44" rx="10" class="fl"/>
  <text x="296" y="247" class="t-m mid on">1854</text>
  <text x="296" y="264" class="t-xs mid on">和親条約で開国</text>
