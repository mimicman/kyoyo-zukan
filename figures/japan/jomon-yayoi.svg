<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- 見出し：いちばんの違い -->
  <rect x="72" y="8" width="136" height="54" rx="12" class="tint st-f" stroke-width="1.5"/>
  <text x="140" y="30" class="t-l mid ink">縄文</text>
  <text x="140" y="51" class="t-s mid fl" font-weight="700">自然から「とる」</text>
  <rect x="216" y="8" width="132" height="54" rx="12" class="fl"/>
  <text x="282" y="30" class="t-l mid on">弥生</text>
  <text x="282" y="51" class="t-s mid on" font-weight="700">米を「つくる」</text>

  <!-- 比べる項目 -->
  <rect x="12" y="70" width="336" height="34" rx="8" class="bgc"/>
  <text x="40" y="92" class="t-s mid soft">食べ物</text>
  <text x="140" y="92" class="t-s mid ink">狩り・漁・木の実</text>
  <text x="282" y="92" class="t-s mid ink" font-weight="700">田んぼで米</text>

  <text x="40" y="126" class="t-s mid soft">たくわえ</text>
  <text x="140" y="126" class="t-s mid ink">少しだけ</text>
  <text x="282" y="126" class="t-s mid ink" font-weight="700">高床倉庫に保存</text>

  <rect x="12" y="138" width="336" height="34" rx="8" class="bgc"/>
  <text x="40" y="160" class="t-s mid soft">道具</text>
  <text x="140" y="160" class="t-s mid ink">縄目の土器・石器</text>
  <text x="282" y="160" class="t-s mid ink">鉄器・青銅器も</text>

  <text x="40" y="194" class="t-s mid soft">ムラ</text>
  <text x="140" y="194" class="t-s mid ink">開けたムラ</text>
  <text x="282" y="194" class="t-s mid ink">堀や柵で守る</text>

  <rect x="12" y="206" width="336" height="34" rx="8" class="bgc"/>
  <text x="40" y="228" class="t-s mid soft">人の差</text>
  <text x="140" y="228" class="t-s mid ink">小さい</text>
  <text x="282" y="228" class="t-s mid ink" font-weight="700">貧富・身分の差</text>

  <!-- 米が社会を変えた流れ -->
  <text x="12" y="262" class="t-xs fl" font-weight="700">米づくりが社会を変えた流れ</text>
  <rect x="10" y="272" width="74" height="34" rx="17" class="tint"/>
  <text x="47" y="294" class="t-xs mid ink">米を蓄える</text>
  <path d="M86 289 H96" class="st-f" stroke-width="2" marker-end="url(#a-japan)"/>
  <rect x="100" y="272" width="74" height="34" rx="17" class="tint"/>
  <text x="137" y="294" class="t-xs mid ink">差が生まれる</text>
  <path d="M176 289 H186" class="st-f" stroke-width="2" marker-end="url(#a-japan)"/>
  <rect x="190" y="272" width="74" height="34" rx="17" class="tint"/>
  <text x="227" y="294" class="t-xs mid ink">争いと指導者</text>
  <path d="M266 289 H276" class="st-f" stroke-width="2" marker-end="url(#a-japan)"/>
  <rect x="280" y="272" width="70" height="34" rx="17" class="fl"/>
  <text x="315" y="294" class="t-xs mid on" font-weight="700">クニの誕生</text>
</svg>
