<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 同心円：中心に江戸の幕府、内側に親藩・譜代、外側に外様。矢印は参勤交代 -->
  <circle cx="130" cy="140" r="120" class="bgc"/>
  <circle cx="130" cy="140" r="78" class="tint"/>
  <circle cx="130" cy="140" r="36" class="fl"/>
  <text x="130" y="140" class="t-m mid on" font-weight="700">江戸</text>
  <text x="130" y="156" class="t-xs mid on">幕府・将軍</text>
  <text x="130" y="86" class="t-xs mid ink" font-weight="700">親藩・譜代</text>
  <text x="130" y="40" class="t-s mid ink" font-weight="700">外様</text>

  <!-- 藩の印 -->
  <g class="paper st-f" stroke-width="1.5">
    <rect x="70" y="122" width="12" height="12" rx="2"/>
    <rect x="178" y="118" width="12" height="12" rx="2"/>
    <rect x="124" y="196" width="12" height="12" rx="2"/>
    <rect x="30" y="96" width="12" height="12" rx="2"/>
    <rect x="216" y="92" width="12" height="12" rx="2"/>
    <rect x="34" y="196" width="12" height="12" rx="2"/>
    <rect x="214" y="200" width="12" height="12" rx="2"/>
  </g>

  <!-- 参勤交代 -->
  <path d="M46 196 C66 182 84 168 98 160" class="st-f" stroke-width="2" fill="none" marker-end="url(#a-japan)"/>
  <path d="M102 172 C88 186 70 202 54 210" class="st dash" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="18" y="236" class="t-xs fl" font-weight="700">参勤交代</text>
  <text x="18" y="250" class="t-xs soft">1年おきに江戸と領地</text>
  <rect x="18" y="260" width="10" height="10" rx="2" class="paper st-f" stroke-width="1.5"/>
  <text x="34" y="269" class="t-xs soft">＝藩（大名の領地）</text>

  <!-- 右の説明 -->
  <text x="262" y="30" class="t-xs ink" font-weight="700">幕府が直接治める</text>
  <text x="262" y="45" class="t-xs soft">京都・大坂・長崎</text>
  <text x="262" y="59" class="t-xs soft">金銀の鉱山</text>
  <path d="M262 74 H348" class="st-line" stroke-width="1"/>
  <text x="262" y="94" class="t-xs ink">親藩＝徳川一族</text>
  <text x="262" y="110" class="t-xs ink">譜代＝古い家来</text>
  <text x="262" y="126" class="t-xs ink">外様＝のちに従う</text>
  <text x="262" y="142" class="t-xs soft">外様の多くは遠く</text>
  <path d="M262 156 H348" class="st-line" stroke-width="1"/>
  <text x="262" y="176" class="t-xs ink">武家諸法度で</text>
  <text x="262" y="190" class="t-xs ink">大名をしばる</text>
  <text x="262" y="206" class="t-xs soft">城の修理や結婚</text>
  <text x="262" y="220" class="t-xs soft">には許可がいる</text>
</svg>
