<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 上：1930〜1946年（1年＝20）。帯の高さで戦争の広がりを示す。下：国内の変化 -->
  <text x="16" y="24" class="t-m ink" font-weight="700">広がっていった戦争</text>
  <rect x="40" y="98" width="120" height="24" class="tint"/>
  <rect x="160" y="78" width="80" height="44" class="fl"/>
  <rect x="240" y="44" width="80" height="78" class="ink"/>
  <text x="100" y="114" class="t-xs mid ink">満州事変から</text>
  <text x="200" y="98" class="t-xs mid on" font-weight="700">日中戦争</text>
  <text x="200" y="112" class="t-xs mid on">中国の各地へ</text>
  <text x="280" y="78" class="t-s mid paper" font-weight="700">太平洋戦争</text>
  <text x="280" y="96" class="t-xs mid paper">アジア太平洋へ</text>

  <path d="M30 130 H334" class="st-soft" stroke-width="1.5"/>
  <path d="M40 126 V134 M160 126 V134 M240 126 V134 M320 126 V134" class="st-soft" stroke-width="1.5"/>
  <text x="40" y="148" class="t-xs mid ink" font-weight="700">1931</text>
  <text x="160" y="148" class="t-xs mid ink" font-weight="700">1937</text>
  <text x="240" y="148" class="t-xs mid ink" font-weight="700">1941</text>
  <text x="320" y="148" class="t-xs mid ink" font-weight="700">1945</text>
  <circle cx="80" cy="130" r="4" class="ink"/>
  <text x="80" y="164" class="t-xs mid soft">1933 国際連盟を脱退</text>
  <text x="320" y="164" class="t-xs mid fl" font-weight="700">8月 降伏</text>

  <!-- 国内の変化 -->
  <rect x="12" y="182" width="104" height="62" rx="10" class="bgc"/>
  <text x="64" y="200" class="t-xs mid soft">政治</text>
  <text x="64" y="218" class="t-s mid ink" font-weight="700">政党内閣が</text>
  <text x="64" y="234" class="t-xs mid ink">終わる（1932）</text>
  <rect x="128" y="182" width="104" height="62" rx="10" class="bgc"/>
  <text x="180" y="200" class="t-xs mid soft">1938年</text>
  <text x="180" y="218" class="t-s mid ink" font-weight="700">国家総動員法</text>
  <text x="180" y="234" class="t-xs mid ink">物資と人を戦争へ</text>
  <rect x="244" y="182" width="104" height="62" rx="10" class="bgc"/>
  <text x="296" y="200" class="t-xs mid soft">暮らし</text>
  <text x="296" y="218" class="t-s mid ink" font-weight="700">配給・疎開</text>
  <text x="296" y="234" class="t-xs mid ink">都市への空襲</text>
  <text x="16" y="268" class="t-xs soft">1945年、原爆投下などを経てポツダム宣言を受け入れた</text>
</svg>
