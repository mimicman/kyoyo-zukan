<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 政治：敗戦から新しい憲法へ -->
  <rect x="12" y="12" width="92" height="62" rx="12" class="fl"/>
  <text x="58" y="40" class="t-l mid on">1945</text>
  <text x="58" y="62" class="t-s mid on">敗戦</text>
  <path d="M108 43 H122" class="st-f" stroke-width="2" marker-end="url(#a-japan)"/>
  <rect x="128" y="12" width="220" height="62" rx="12" class="tint st-f" stroke-width="1.5"/>
  <text x="238" y="40" class="t-l mid ink">日本国憲法</text>
  <text x="238" y="62" class="t-s mid soft">1946 公布 → 1947 施行</text>

  <!-- 経済：形だけのイメージ（数値ではない） -->
  <text x="30" y="98" class="t-xs soft">経済の大きさ（イメージ）</text>
  <rect x="24" y="106" width="126" height="142" class="tint"/>
  <text x="87" y="126" class="t-s mid fl" font-weight="700">高度経済成長</text>
  <path d="M24 100 V248 H342" class="st-soft" stroke-width="1.5"/>
  <path d="M24 236 C70 228 120 196 150 172 C180 152 220 144 241 140 C255 138 265 137 276 136 C300 135 320 134 340 133" class="st-f" stroke-width="3" stroke-linecap="round"/>
  <text x="196" y="134" class="t-xs mid soft">安定成長</text>

  <!-- バブルとその崩壊 -->
  <path d="M258 126 V138" class="st-f dash" stroke-width="1.5"/>
  <circle cx="258" cy="104" r="21" class="tint st-f" stroke-width="1.5"/>
  <text x="258" y="108" class="t-xs mid ink">バブル</text>
  <path d="M284 96 L294 90 M286 106 L298 106 M284 116 L294 122" class="st-f" stroke-width="2" stroke-linecap="round"/>
  <text x="320" y="110" class="t-s mid fl" font-weight="700">崩壊</text>

  <!-- 年 -->
  <path d="M150 244 V252 M276 244 V252" class="st-soft" stroke-width="1.5"/>
  <text x="24" y="266" class="t-xs soft">1955頃</text>
  <text x="150" y="266" class="t-xs mid soft">1973</text>
  <text x="276" y="266" class="t-xs mid soft">1991</text>
</svg>
