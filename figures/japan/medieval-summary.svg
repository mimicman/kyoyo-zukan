<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 武士の時代：政治の中心が貴族から武士へ移り、分かれて、またまとまる -->
  <text x="16" y="24" class="t-m ink">政治の中心が、貴族から武士へ</text>

  <!-- 貴族の帯（細くなっていく） -->
  <path d="M16 52 H120 L180 62 H344" class="st-soft" stroke-width="8" stroke-linecap="round"/>
  <text x="20" y="44" class="t-xs soft">朝廷・貴族</text>

  <!-- 武士の帯：太くなる→戦国で割れる→統一 -->
  <path d="M16 112 C60 112 70 100 110 100" class="st-f" stroke-width="4" stroke-linecap="round"/>
  <path d="M110 100 H232" class="st-f" stroke-width="14" stroke-linecap="round"/>
  <path d="M236 92 L262 76 M236 100 L264 100 M236 108 L262 124" class="st-f" stroke-width="5" stroke-linecap="round"/>
  <path d="M266 76 C290 76 296 100 344 100 M266 100 H344 M266 124 C290 124 296 100 344 100" class="st-f" stroke-width="5" stroke-linecap="round"/>
  <circle cx="344" cy="100" r="8" class="fl"/>

  <text x="20" y="134" class="t-xs fl">武士が生まれる</text>
  <text x="170" y="86" class="t-xs mid fl" font-weight="700">幕府</text>
  <text x="250" y="146" class="t-xs mid fl">戦国</text>
  <text x="340" y="126" class="t-xs end fl" font-weight="700">統一</text>

  <!-- 年の目盛り -->
  <path d="M16 170 H344" class="st-line" stroke-width="1.5"/>
  <g class="t-xs mid soft">
    <text x="30" y="188">10世紀</text>
    <text x="110" y="188">1185</text>
    <text x="180" y="188">1336</text>
    <text x="250" y="188">1467</text>
    <text x="330" y="188">1590</text>
  </g>

  <!-- 各段階 -->
  <rect x="12" y="204" width="80" height="64" rx="10" class="tint"/>
  <text x="52" y="226" class="t-s mid ink" font-weight="700">鎌倉幕府</text>
  <text x="52" y="244" class="t-xs mid soft">源頼朝</text>
  <text x="52" y="258" class="t-xs mid soft">御恩と奉公</text>
  <rect x="98" y="204" width="80" height="64" rx="10" class="tint"/>
  <text x="138" y="226" class="t-s mid ink" font-weight="700">室町幕府</text>
  <text x="138" y="244" class="t-xs mid soft">足利氏</text>
  <text x="138" y="258" class="t-xs mid soft">京都に置く</text>
  <rect x="184" y="204" width="80" height="64" rx="10" class="tint"/>
  <text x="224" y="226" class="t-s mid ink" font-weight="700">戦国時代</text>
  <text x="224" y="244" class="t-xs mid soft">大名が</text>
  <text x="224" y="258" class="t-xs mid soft">各地で争う</text>
  <rect x="270" y="204" width="80" height="64" rx="10" class="fl"/>
  <text x="310" y="226" class="t-s mid on" font-weight="700">天下統一</text>
  <text x="310" y="244" class="t-xs mid on">信長・秀吉</text>
  <text x="310" y="258" class="t-xs mid on">家康</text>
</svg>
