<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 遠近法：左は線遠近法（平行な線が消失点に集まる）、右は空気遠近法（遠いほど薄くかすむ） -->
  <!-- 左：線遠近法 -->
  <rect x="12" y="36" width="196" height="200" rx="10" class="bgc"/>
  <text x="110" y="24" class="t-m mid ink">線遠近法</text>
  <path d="M110 112 L12 236 M110 112 L44 236 M110 112 L77 236 M110 112 L110 236 M110 112 L143 236 M110 112 L176 236 M110 112 L208 236" class="st-soft" stroke-width="1"/>
  <path d="M95 131 H125 M83 146 H137 M66 168 H154 M40 200 H180" class="st-soft" stroke-width="1"/>
  <path d="M12 112 H208" class="st" stroke-width="1.5"/>
  <circle cx="110" cy="112" r="5" class="fl"/>
  <text x="110" y="100" class="t-xs mid fl halo" font-weight="700">消失点</text>
  <text x="20" y="104" class="t-xs soft">地平線</text>
  <!-- 人物：近いほど大きい -->
  <circle cx="58" cy="176" r="6" class="ink"/>
  <path d="M52 184 H64 V214 H52 Z" class="ink"/>
  <circle cx="92" cy="128" r="2.5" class="ink"/>
  <path d="M90 131 H94 V141 H90 Z" class="ink"/>
  <text x="110" y="58" class="t-xs mid soft">平行な線は、遠くで</text>
  <text x="110" y="74" class="t-xs mid soft">1点に集まって見える</text>

  <!-- 右：空気遠近法 -->
  <rect x="216" y="36" width="132" height="200" rx="10" class="bgc"/>
  <text x="282" y="24" class="t-m mid ink">空気遠近法</text>
  <path d="M216 152 L246 120 L270 138 L300 112 L348 146 V226 Q348 236 338 236 H226 Q216 236 216 226 Z" class="tint"/>
  <path d="M216 178 L250 144 L284 170 L318 148 L348 172 V226 Q348 236 338 236 H226 Q216 236 216 226 Z" class="soft" opacity="0.45"/>
  <path d="M216 206 L244 180 L276 202 L312 184 L348 206 V226 Q348 236 338 236 H226 Q216 236 216 226 Z" class="ink" opacity="0.8"/>
  <text x="340" y="104" class="t-xs end ink halo">遠い：薄く青く</text>
  <text x="226" y="228" class="t-xs paper" font-weight="700">近い：濃くくっきり</text>
  <text x="282" y="58" class="t-xs mid soft">空気の層で</text>
  <text x="282" y="74" class="t-xs mid soft">遠くはかすむ</text>

  <text x="180" y="262" class="t-s mid ink">どちらも、平らな画面に奥行きを生む工夫</text>
</svg>
