<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 左：色相環（絵の具の6色の簡単な形）。向かい合う色が補色 -->
  <text x="92" y="22" class="t-m mid ink">① 色相（色み）</text>
  <text x="92" y="40" class="t-xs mid soft">色を輪に並べた「色相環」</text>
  <path d="M55.0 73.9 A74 74 0 0 1 129.0 73.9 L107.0 112.0 A30 30 0 0 0 77.0 112.0Z" class="fl"/>
  <path d="M55.0 73.9 A74 74 0 0 1 129.0 73.9 L107.0 112.0 A30 30 0 0 0 77.0 112.0Z" class="st-soft" stroke-width="1.2"/>
  <path d="M129.0 73.9 A74 74 0 0 1 166.0 138.0 L122.0 138.0 A30 30 0 0 0 107.0 112.0Z" class="paper"/>
  <path d="M129.0 73.9 A74 74 0 0 1 166.0 138.0 L122.0 138.0 A30 30 0 0 0 107.0 112.0Z" class="st-soft" stroke-width="1.2"/>
  <path d="M166.0 138.0 A74 74 0 0 1 129.0 202.1 L107.0 164.0 A30 30 0 0 0 122.0 138.0Z" class="paper"/>
  <path d="M166.0 138.0 A74 74 0 0 1 129.0 202.1 L107.0 164.0 A30 30 0 0 0 122.0 138.0Z" class="st-soft" stroke-width="1.2"/>
  <path d="M129.0 202.1 A74 74 0 0 1 55.0 202.1 L77.0 164.0 A30 30 0 0 0 107.0 164.0Z" class="tint"/>
  <path d="M129.0 202.1 A74 74 0 0 1 55.0 202.1 L77.0 164.0 A30 30 0 0 0 107.0 164.0Z" class="st-soft" stroke-width="1.2"/>
  <path d="M55.0 202.1 A74 74 0 0 1 18.0 138.0 L62.0 138.0 A30 30 0 0 0 77.0 164.0Z" class="paper"/>
  <path d="M55.0 202.1 A74 74 0 0 1 18.0 138.0 L62.0 138.0 A30 30 0 0 0 77.0 164.0Z" class="st-soft" stroke-width="1.2"/>
  <path d="M18.0 138.0 A74 74 0 0 1 55.0 73.9 L77.0 112.0 A30 30 0 0 0 62.0 138.0Z" class="paper"/>
  <path d="M18.0 138.0 A74 74 0 0 1 55.0 73.9 L77.0 112.0 A30 30 0 0 0 62.0 138.0Z" class="st-soft" stroke-width="1.2"/>
  <text x="92" y="95" class="t-m mid on">赤</text>
  <text x="138" y="122" class="t-m mid ink">橙</text>
  <text x="138" y="174" class="t-m mid ink">黄</text>
  <text x="92" y="196" class="t-m mid ink">緑</text>
  <text x="46" y="174" class="t-m mid ink">青</text>
  <text x="46" y="122" class="t-m mid ink">紫</text>
  <!-- 向かい合う組 -->
  <path d="M92 114 V162" class="st-f" stroke-width="2.5" marker-start="url(#a-art)" marker-end="url(#a-art)"/>
  <text x="92" y="142" class="t-s mid fl halo" font-weight="700">補色</text>
  <text x="92" y="232" class="t-xs mid soft">向かい合う色＝補色</text>
  <text x="92" y="248" class="t-xs mid soft">赤と緑・青と橙・黄と紫</text>

  <!-- 右上：明度 -->
  <text x="190" y="22" class="t-m ink">② 明度（明るさ）</text>
  <rect x="190" y="32" width="32" height="24" class="fl" opacity="0.25"/>
  <rect x="222" y="32" width="32" height="24" class="fl" opacity="0.55"/>
  <rect x="254" y="32" width="32" height="24" class="fl"/>
  <rect x="286" y="32" width="32" height="24" class="fl"/>
  <rect x="286" y="32" width="32" height="24" class="ink" opacity="0.35"/>
  <rect x="318" y="32" width="32" height="24" class="fl"/>
  <rect x="318" y="32" width="32" height="24" class="ink" opacity="0.65"/>
  <text x="190" y="70" class="t-xs soft">明るい</text>
  <text x="350" y="70" class="t-xs end soft">暗い</text>

  <!-- 右中：彩度 -->
  <text x="190" y="96" class="t-m ink">③ 彩度（鮮やかさ）</text>
  <rect x="190" y="106" width="160" height="24" class="soft" opacity="0.5"/>
  <rect x="222" y="106" width="32" height="24" class="fl" opacity="0.3"/>
  <rect x="254" y="106" width="32" height="24" class="fl" opacity="0.55"/>
  <rect x="286" y="106" width="32" height="24" class="fl" opacity="0.8"/>
  <rect x="318" y="106" width="32" height="24" class="fl"/>
  <text x="190" y="144" class="t-xs soft">くすむ（灰色）</text>
  <text x="350" y="144" class="t-xs end soft">鮮やか</text>

  <!-- 右下：補色の2つの性質 -->
  <rect x="186" y="160" width="166" height="50" rx="10" class="bgc"/>
  <rect x="198" y="170" width="30" height="30" class="fl"/>
  <rect x="228" y="170" width="30" height="30" class="tint"/>
  <rect x="228" y="170" width="30" height="30" class="st-soft" stroke-width="1"/>
  <text x="213" y="190" class="t-xs mid on">赤</text>
  <text x="243" y="190" class="t-xs mid ink">緑</text>
  <text x="268" y="182" class="t-xs ink" font-weight="700">並べると</text>
  <text x="268" y="198" class="t-xs fl" font-weight="700">引き立つ</text>

  <rect x="186" y="218" width="166" height="50" rx="10" class="bgc"/>
  <circle cx="210" cy="243" r="13" class="fl" opacity="0.8"/>
  <circle cx="226" cy="243" r="13" class="tint" opacity="0.8"/>
  <circle cx="226" cy="243" r="13" class="st-soft" stroke-width="1" opacity="0.8"/>
  <path d="M242 243 H252" class="st-soft" stroke-width="1.5" marker-end="url(#a-soft)"/>
  <circle cx="268" cy="243" r="9" class="soft" opacity="0.6"/>
  <text x="284" y="240" class="t-xs ink" font-weight="700">混ぜると</text>
  <text x="284" y="256" class="t-xs soft" font-weight="700">くすむ</text>
</svg>
