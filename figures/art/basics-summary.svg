<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 1枚の絵を、4つの問い（いつ・どんな色・どう置く・どんな空間）で読む -->
  <text x="180" y="24" class="t-m mid ink">1枚の絵を、4つの問いで読む</text>

  <!-- 中央：額に入った絵 -->
  <rect x="134" y="62" width="92" height="112" rx="4" class="tint"/>
  <rect x="134" y="62" width="92" height="112" rx="4" class="st" stroke-width="3"/>
  <rect x="144" y="72" width="72" height="92" class="paper"/>
  <circle cx="196" cy="92" r="9" class="fl"/>
  <path d="M144 164 L164 128 L178 144 L194 118 L216 164Z" class="soft"/>

  <!-- ① いつの絵か：流れの地図 -->
  <text x="64" y="50" class="t-s mid fl" font-weight="700">① いつの絵か</text>
  <path d="M22 64 C40 66 50 80 62 88 C74 96 90 100 108 100" class="st-f" stroke-width="2.5" stroke-linecap="round"/>
  <g class="fl"><circle cx="22" cy="64" r="4"/><circle cx="62" cy="88" r="4"/><circle cx="108" cy="100" r="4"/></g>
  <text x="64" y="118" class="t-xs mid soft">時代の流れの地図</text>

  <!-- ② どんな色か：色相環 -->
  <text x="296" y="50" class="t-s mid fl" font-weight="700">② どんな色か</text>
  <g stroke-width="1.2" class="st-soft">
    <path d="M296 84 L296 64 A20 20 0 0 1 313 74Z" class="fl"/>
    <path d="M296 84 L313 74 A20 20 0 0 1 313 94Z" class="tint"/>
    <path d="M296 84 L313 94 A20 20 0 0 1 296 104Z" class="soft"/>
    <path d="M296 84 L296 104 A20 20 0 0 1 279 94Z" class="ink"/>
    <path d="M296 84 L279 94 A20 20 0 0 1 279 74Z" class="paper"/>
    <path d="M296 84 L279 74 A20 20 0 0 1 296 64Z" class="bgc"/>
  </g>
  <text x="296" y="122" class="t-xs mid soft">色の物差しと補色</text>

  <!-- ③ どう置いたか：構図 -->
  <text x="64" y="144" class="t-s mid fl" font-weight="700">③ どう置いたか</text>
  <rect x="30" y="154" width="68" height="42" class="paper"/>
  <rect x="30" y="154" width="68" height="42" class="st-soft" stroke-width="1.2"/>
  <path d="M64 158 L88 192 H40 Z" class="st-f" stroke-width="2"/>
  <text x="64" y="212" class="t-xs mid soft">構図の骨組み</text>

  <!-- ④ どんな空間か：遠近法 -->
  <text x="296" y="144" class="t-s mid fl" font-weight="700">④ どんな空間か</text>
  <rect x="262" y="154" width="68" height="42" class="paper"/>
  <rect x="262" y="154" width="68" height="42" class="st-soft" stroke-width="1.2"/>
  <path d="M262 170 H330" class="st" stroke-width="1"/>
  <path d="M296 170 L266 196 M296 170 L282 196 M296 170 L310 196 M296 170 L326 196" class="st-soft" stroke-width="1"/>
  <circle cx="296" cy="170" r="3" class="fl"/>
  <text x="296" y="212" class="t-xs mid soft">遠近法の奥行き</text>

  <!-- 下：この道具で次の章へ -->
  <rect x="12" y="222" width="336" height="50" rx="12" class="bgc"/>
  <text x="180" y="240" class="t-xs mid ink" font-weight="700">4つの道具で、次の章の絵を読む</text>
  <g class="t-xs mid">
    <rect x="28" y="246" width="88" height="20" rx="10" class="tint"/>
    <text x="72" y="260" class="ink">本物らしさ</text>
    <rect x="136" y="246" width="88" height="20" rx="10" class="tint"/>
    <text x="180" y="260" class="ink">近代の革新</text>
    <rect x="244" y="246" width="88" height="20" rx="10" class="tint"/>
    <text x="288" y="260" class="ink">日本と美術</text>
  </g>
</svg>
