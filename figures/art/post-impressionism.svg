<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- ポスト印象派：印象派から、セザンヌ（形）・ゴッホ（感情）・ゴーギャン（平らな色）の3つの道へ -->
  <text x="16" y="24" class="t-m ink">印象派のあと、3つの道に分かれた</text>

  <!-- 出発点：印象派 -->
  <rect x="12" y="124" width="74" height="52" rx="10" class="fl"/>
  <text x="49" y="146" class="t-s mid on" font-weight="700">印象派</text>
  <text x="49" y="164" class="t-xs mid on">光の一瞬</text>
  <path d="M86 140 L102 82" class="st-f" stroke-width="2" marker-end="url(#a-art)"/>
  <path d="M86 150 H100" class="st-f" stroke-width="2" marker-end="url(#a-art)"/>
  <path d="M86 160 L102 218" class="st-f" stroke-width="2" marker-end="url(#a-art)"/>

  <!-- セザンヌ：形を単純な立体に -->
  <rect x="104" y="44" width="142" height="62" rx="10" class="bgc"/>
  <path d="M114 70 L126 64 L138 70 L126 76 Z" class="tint"/>
  <path d="M114 70 L126 64 L138 70 L126 76 Z M114 70 V88 L126 94 V76 M138 70 V88 L126 94" class="st" stroke-width="1.2"/>
  <ellipse cx="146" cy="90" rx="6" ry="3" class="soft"/>
  <path d="M140 90 V76 M152 90 V76" class="st" stroke-width="1.2"/>
  <ellipse cx="146" cy="76" rx="6" ry="3" class="st" stroke-width="1.2"/>
  <text x="160" y="70" class="t-s ink" font-weight="700">セザンヌ</text>
  <text x="160" y="88" class="t-xs soft">形を単純な立体に</text>

  <!-- ゴッホ：うねる筆で感情を -->
  <rect x="104" y="119" width="142" height="62" rx="10" class="bgc"/>
  <path d="M130 150 C130 142 142 142 142 150 C142 160 124 162 122 150 C120 136 146 132 148 150 C150 168 118 170 116 150" class="st-f" stroke-width="2"/>
  <text x="160" y="145" class="t-s ink" font-weight="700">ゴッホ</text>
  <text x="160" y="163" class="t-xs soft">うねる筆で感情を</text>

  <!-- ゴーギャン：平らな色と輪郭線 -->
  <rect x="104" y="194" width="142" height="62" rx="10" class="bgc"/>
  <rect x="114" y="208" width="36" height="34" class="tint"/>
  <path d="M114 230 C124 222 134 236 150 226 V242 H114 Z" class="fl"/>
  <circle cx="140" cy="216" r="5" class="soft"/>
  <rect x="114" y="208" width="36" height="34" class="st" stroke-width="1.5"/>
  <path d="M114 230 C124 222 134 236 150 226" class="st" stroke-width="1.5"/>
  <text x="160" y="220" class="t-s ink" font-weight="700">ゴーギャン</text>
  <text x="160" y="238" class="t-xs soft">平らな色と輪郭線</text>

  <!-- 20世紀へ -->
  <path d="M246 75 H262" class="st-soft" stroke-width="1.5" marker-end="url(#a-soft)"/>
  <path d="M246 150 H262" class="st-soft" stroke-width="1.5" marker-end="url(#a-soft)"/>
  <path d="M246 225 H262" class="st-soft" stroke-width="1.5" marker-end="url(#a-soft)"/>
  <rect x="266" y="57" width="82" height="36" rx="18" class="tint"/>
  <text x="307" y="79" class="t-xs mid ink" font-weight="700">キュビスム</text>
  <rect x="266" y="132" width="82" height="36" rx="18" class="tint"/>
  <text x="307" y="154" class="t-xs mid ink" font-weight="700">表現主義</text>
  <rect x="266" y="207" width="82" height="36" rx="18" class="tint"/>
  <text x="307" y="229" class="t-xs mid ink" font-weight="700">フォーヴィスム</text>
  <text x="307" y="46" class="t-xs mid soft">20世紀の美術へ</text>

  <text x="180" y="274" class="t-xs mid soft">どれも、見たままより「画家の見方」を前に出した</text>
</svg>
