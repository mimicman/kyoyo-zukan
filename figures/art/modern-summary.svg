<svg viewBox="0 0 360 290" xmlns="http://www.w3.org/2000/svg">
  <!-- 何を描くかの移り変わり（上）と、見たままに近い度合い（下の線）。6つの流れを時代順に -->
  <text x="14" y="20" class="t-xs soft">何を描くか</text>
  <g class="t-s mid ink" font-weight="700">
    <text x="34" y="44">英雄</text>
    <text x="92" y="44">感情</text>
    <text x="150" y="44">現実</text>
    <text x="208" y="44" class="fl">光</text>
    <text x="266" y="44" class="fl">画家の目</text>
    <text x="324" y="44" class="fl">色と形</text>
  </g>
  <g class="st-soft" stroke-width="1.5">
    <path d="M49 40 H75" marker-end="url(#a-soft)"/>
    <path d="M107 40 H133" marker-end="url(#a-soft)"/>
    <path d="M165 40 H197" marker-end="url(#a-soft)"/>
    <path d="M217 40 H237" marker-end="url(#a-soft)"/>
    <path d="M293 40 H301" marker-end="url(#a-soft)"/>
  </g>
  <g class="paper"><circle cx="34" cy="84" r="22"/><circle cx="92" cy="84" r="22"/><circle cx="150" cy="84" r="22"/><circle cx="208" cy="84" r="22"/><circle cx="266" cy="84" r="22"/><circle cx="324" cy="84" r="22"/></g>
  <g class="st-soft" stroke-width="1.5"><circle cx="34" cy="84" r="22"/><circle cx="92" cy="84" r="22"/><circle cx="150" cy="84" r="22"/><circle cx="208" cy="84" r="22"/><circle cx="266" cy="84" r="22"/><circle cx="324" cy="84" r="22"/></g>
  <!-- 新古典：整然と並ぶ柱 -->
  <path d="M22 96 V74 M30 96 V74 M38 96 V74 M46 96 V74 M18 72 H50 M18 98 H50" class="st" stroke-width="2"/>
  <!-- ロマン主義：三角形の構図と斜めの動き -->
  <path d="M76 98 L92 66 L108 98Z" class="fl"/>
  <path d="M78 70 L106 96" class="st" stroke-width="2"/>
  <!-- 写実主義：地平線と働く人 -->
  <path d="M130 92 H170" class="st-soft" stroke-width="2"/>
  <circle cx="150" cy="72" r="4" class="ink"/>
  <path d="M150 77 L146 92 M150 77 L156 90 M148 82 L160 86" class="st" stroke-width="2"/>
  <!-- 印象派：色の点 -->
  <g class="fl"><circle cx="200" cy="76" r="4"/><circle cx="216" cy="78" r="4"/><circle cx="206" cy="92" r="4"/></g>
  <g class="soft"><circle cx="210" cy="70" r="3.5"/><circle cx="220" cy="90" r="3.5"/><circle cx="198" cy="88" r="3.5"/></g>
  <!-- ポスト印象派：うねる筆と単純な形 -->
  <path d="M262 84 C262 78 272 78 272 84 C272 92 256 94 254 84 C252 72 276 68 278 84 C280 98 252 100 250 86" class="st-f" stroke-width="2"/>
  <!-- 抽象：格子 -->
  <rect x="310" y="70" width="28" height="28" class="st" stroke-width="2"/>
  <rect x="310" y="70" width="12" height="14" class="fl"/>
  <path d="M322 70 V98 M310 84 H338" class="st" stroke-width="2"/>
  <g class="t-xs mid ink"><text x="34" y="126">新古典主義</text><text x="92" y="126">ロマン主義</text><text x="150" y="126">写実主義</text><text x="208" y="126">印象派</text><text x="266" y="126">ポスト印象派</text><text x="324" y="126">抽象</text></g>
  <g class="t-xs mid soft"><text x="34" y="140">18世紀後半</text><text x="92" y="154">19世紀前半</text><text x="150" y="140">19世紀半ば</text><text x="208" y="154">19世紀後半</text><text x="266" y="140">19世紀末</text><text x="324" y="154">20世紀初め</text></g>
  <text x="14" y="196" class="t-xs soft">見たままに</text>
  <text x="14" y="210" class="t-xs soft">近いほど上</text>
  <path d="M34 172 C70 172 120 172 150 176 C176 182 190 194 208 200 C230 208 246 212 266 218 C290 226 306 232 324 236" class="st-f" stroke-width="3" stroke-linecap="round"/>
  <g class="fl"><circle cx="34" cy="172" r="4"/><circle cx="92" cy="172" r="4"/><circle cx="150" cy="176" r="4"/><circle cx="208" cy="200" r="4"/><circle cx="266" cy="218" r="4"/><circle cx="324" cy="236" r="4"/></g>
  <path d="M179 162 V246" class="st-soft dash" stroke-width="1.5"/>
  <text x="173" y="230" class="t-xs end soft">写真が広まる</text>
  <text x="173" y="244" class="t-xs end soft">（19世紀半ば〜）</text>
  <!-- この章のカード -->
  <path d="M66 258 V264 H176 V258 M186 258 V264 H230 V258 M240 258 V264 H292 V258 M302 258 V264 H346 V258" class="st-f" stroke-width="1.5"/>
  <g class="t-xs mid fl">
    <text x="121" y="280">ロマン主義と写実主義</text>
    <text x="208" y="280">印象派</text>
    <text x="266" y="280">ポスト印象派</text>
    <text x="324" y="280">抽象へ</text>
  </g>
</svg>
