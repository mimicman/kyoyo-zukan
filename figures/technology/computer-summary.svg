<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 計算機のしくみ：0と1（土台）の上に5つの装置、その上で手順（アルゴリズム）が動く。積み重ね -->
  <text x="16" y="24" class="t-m ink">下の層を土台に、上の層が動く</text>
  <text x="196" y="50" class="t-xs mid soft">アプリ・ゲーム・AIなど</text>

  <rect x="72" y="60" width="248" height="58" rx="10" class="fl"/>
  <text x="88" y="84" class="t-s on" font-weight="700">③ 手順（アルゴリズム）</text>
  <text x="88" y="104" class="t-xs on">どう解くかの段取り。半分ずつ探す など</text>

  <rect x="52" y="128" width="288" height="58" rx="10" class="tint"/>
  <text x="68" y="152" class="t-s ink" font-weight="700">② 5つの装置</text>
  <text x="68" y="172" class="t-xs soft">入力 → CPU（制御・演算）⇄ 記憶 → 出力</text>

  <rect x="32" y="196" width="308" height="58" rx="10" class="bgc"/>
  <rect x="32" y="196" width="308" height="58" rx="10" class="st-line" stroke-width="1"/>
  <text x="48" y="220" class="t-s ink" font-weight="700">① 0と1（ビット）</text>
  <g class="t-xs">
    <rect x="186" y="208" width="16" height="18" class="paper"/><text x="194" y="221" class="t-xs mid ink">0</text>
    <rect x="204" y="208" width="16" height="18" class="fl"/><text x="212" y="221" class="t-xs mid on">1</text>
    <rect x="222" y="208" width="16" height="18" class="paper"/><text x="230" y="221" class="t-xs mid ink">0</text>
    <rect x="240" y="208" width="16" height="18" class="paper"/><text x="248" y="221" class="t-xs mid ink">0</text>
    <rect x="258" y="208" width="16" height="18" class="paper"/><text x="266" y="221" class="t-xs mid ink">0</text>
    <rect x="276" y="208" width="16" height="18" class="paper"/><text x="284" y="221" class="t-xs mid ink">0</text>
    <rect x="294" y="208" width="16" height="18" class="paper"/><text x="302" y="221" class="t-xs mid ink">0</text>
    <rect x="312" y="208" width="16" height="18" class="fl"/><text x="320" y="221" class="t-xs mid on">1</text>
  </g>
  <text x="48" y="242" class="t-xs soft">入・切の並びで、数も文字も表す（65＝A）</text>

  <path d="M18 250 V66" class="st-f" stroke-width="2" marker-end="url(#a-technology)"/>
  <text x="14" y="272" class="t-xs soft">下ほど機械に近く、上ほど人の目的に近い</text>
</svg>
