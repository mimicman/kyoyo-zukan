<svg viewBox="0 0 360 290" xmlns="http://www.w3.org/2000/svg">
  <!-- スイッチ1個＝1ビット -->
  <text x="20" y="26" class="t-m ink">1ビット＝スイッチ1個</text>
  <rect x="210" y="10" width="52" height="24" rx="12" class="paper"/>
  <rect x="210" y="10" width="52" height="24" rx="12" class="st-soft" stroke-width="2"/>
  <circle cx="222" cy="22" r="8" class="soft"/>
  <text x="236" y="52" class="t-xs mid soft">切＝0</text>
  <rect x="286" y="10" width="52" height="24" rx="12" class="fl"/>
  <circle cx="326" cy="22" r="8" class="paper"/>
  <text x="312" y="52" class="t-xs mid fl">入＝1</text>
  <!-- 8ビット -->
  <text x="20" y="84" class="t-xs soft">各けたの重み（右へ行くほど半分）</text>
  <text x="52" y="106" class="t-xs mid soft">128</text>
  <rect x="36" y="114" width="32" height="40" rx="5" class="paper"/>
  <rect x="36" y="114" width="32" height="40" rx="5" class="st-soft" stroke-width="1.5"/>
  <text x="52" y="141" class="t-l mid soft">0</text>
  <text x="88" y="106" class="t-s mid fl">64</text>
  <rect x="72" y="114" width="32" height="40" rx="5" class="fl"/>
  <text x="88" y="141" class="t-l mid on">1</text>
  <text x="124" y="106" class="t-xs mid soft">32</text>
  <rect x="108" y="114" width="32" height="40" rx="5" class="paper"/>
  <rect x="108" y="114" width="32" height="40" rx="5" class="st-soft" stroke-width="1.5"/>
  <text x="124" y="141" class="t-l mid soft">0</text>
  <text x="160" y="106" class="t-xs mid soft">16</text>
  <rect x="144" y="114" width="32" height="40" rx="5" class="paper"/>
  <rect x="144" y="114" width="32" height="40" rx="5" class="st-soft" stroke-width="1.5"/>
  <text x="160" y="141" class="t-l mid soft">0</text>
  <text x="196" y="106" class="t-xs mid soft">8</text>
  <rect x="180" y="114" width="32" height="40" rx="5" class="paper"/>
  <rect x="180" y="114" width="32" height="40" rx="5" class="st-soft" stroke-width="1.5"/>
  <text x="196" y="141" class="t-l mid soft">0</text>
  <text x="232" y="106" class="t-xs mid soft">4</text>
  <rect x="216" y="114" width="32" height="40" rx="5" class="paper"/>
  <rect x="216" y="114" width="32" height="40" rx="5" class="st-soft" stroke-width="1.5"/>
  <text x="232" y="141" class="t-l mid soft">0</text>
  <text x="268" y="106" class="t-xs mid soft">2</text>
  <rect x="252" y="114" width="32" height="40" rx="5" class="paper"/>
  <rect x="252" y="114" width="32" height="40" rx="5" class="st-soft" stroke-width="1.5"/>
  <text x="268" y="141" class="t-l mid soft">0</text>
  <text x="304" y="106" class="t-s mid fl">1</text>
  <rect x="288" y="114" width="32" height="40" rx="5" class="fl"/>
  <text x="304" y="141" class="t-l mid on">1</text>
  <path d="M36 164 V172 H320 V164" class="st-soft" stroke-width="1.5"/>
  <text x="178" y="190" class="t-s mid ink">8ビット＝1バイト（256通り）</text>
  <!-- 足し算して数と文字に -->
  <text x="180" y="226" class="t-xs mid soft">1のマスの重みを足すと</text>
  <text x="180" y="246" class="t-m mid fl">64 ＋ 1 ＝ 65</text>
  <path d="M180 252 V264" class="st-soft" stroke-width="1.5" marker-end="url(#a-soft)"/>
  <text x="180" y="284" class="t-s mid ink">文字の表では65番＝「A」</text>
</svg>
