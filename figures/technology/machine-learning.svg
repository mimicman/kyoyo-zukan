  <circle cx="262" cy="148" r="5" class="fl"/>
  <circle cx="290" cy="118" r="5" class="fl"/>
  <circle cx="246" cy="176" r="5" class="fl"/>
  <circle cx="300" cy="170" r="5" class="fl"/>
