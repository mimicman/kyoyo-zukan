  <circle cx="64" cy="178" r="5" class="paper"/>
  <circle cx="64" cy="178" r="5" class="st" stroke-width="1.5"/>
  <circle cx="140" cy="236" r="5" class="paper"/>
  <circle cx="140" cy="236" r="5" class="st" stroke-width="1.5"/>
  <circle cx="110" cy="182" r="5" class="paper"/>
