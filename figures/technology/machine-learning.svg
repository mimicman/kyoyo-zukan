  <text x="183" y="24" class="t-xs mid ink">データ</text>
  <path d="M216 20 H244" class="st-soft" stroke-width="1.5" marker-end="url(#a-soft)"/>
  <rect x="250" y="10" width="54" height="20" rx="4" class="paper"/>
  <rect x="250" y="10" width="54" height="20" rx="4" class="st-soft" stroke-width="1.5"/>
  <text x="277" y="24" class="t-xs mid ink">答え</text>

  <text x="14" y="56" class="t-xs fl">機械学習</text>
  <rect x="70" y="44" width="64" height="20" rx="4" class="tint"/>
