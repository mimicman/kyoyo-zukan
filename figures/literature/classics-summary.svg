<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 古典の4つの形：ギリシャの語る叙事詩→演じる悲劇、東アジアの詠む唐詩→読む物語（源氏物語） -->
  <text x="16" y="26" class="t-m ink">古典の4つの形</text>

  <rect x="12" y="44" width="78" height="80" rx="10" class="tint"/>
  <text x="51" y="62" class="t-xs mid soft">前8世紀ごろ</text>
  <text x="51" y="84" class="t-s mid ink" font-weight="700">ホメロス</text>
  <text x="51" y="108" class="t-xs mid fl" font-weight="700">語る叙事詩</text>

  <rect x="98" y="44" width="78" height="80" rx="10" class="tint"/>
  <text x="137" y="62" class="t-xs mid soft">前5世紀</text>
  <text x="137" y="84" class="t-s mid ink" font-weight="700">ギリシャ</text>
  <text x="137" y="98" class="t-s mid ink" font-weight="700">悲劇</text>
  <text x="137" y="116" class="t-xs mid fl" font-weight="700">演じる劇</text>

  <rect x="184" y="44" width="78" height="80" rx="10" class="tint"/>
  <text x="223" y="62" class="t-xs mid soft">7〜10世紀</text>
  <text x="223" y="84" class="t-s mid ink" font-weight="700">唐詩</text>
  <text x="223" y="108" class="t-xs mid fl" font-weight="700">詠む定型詩</text>

  <rect x="270" y="44" width="78" height="80" rx="10" class="fl"/>
  <text x="309" y="62" class="t-xs mid on">11世紀初め</text>
  <text x="309" y="84" class="t-s mid on" font-weight="700">源氏物語</text>
  <text x="309" y="108" class="t-xs mid on" font-weight="700">読む物語</text>


  <!-- 時間軸（前800〜1100年） -->
  <path d="M20 152 H340" class="st" stroke-width="1.5"/>
  <circle cx="33" cy="152" r="4.5" class="fl"/>
  <circle cx="81" cy="152" r="4.5" class="fl"/>
  <circle cx="278" cy="152" r="4.5" class="fl"/>
  <circle cx="319" cy="152" r="4.5" class="fl"/>
  <path d="M33 152 L51 126 M81 152 L137 126 M278 152 L223 126 M319 152 L309 126" class="st-soft dash" stroke-width="1.2"/>
  <text x="24" y="170" class="t-xs soft">前800年</text>
  <text x="160" y="170" class="t-xs mid soft">紀元0年</text>
  <text x="319" y="170" class="t-xs mid soft">1000年</text>

  <rect x="12" y="182" width="164" height="30" rx="8" class="tint"/>
  <text x="94" y="201" class="t-xs mid ink">ギリシャ：英雄を語り、演じる</text>
  <rect x="184" y="182" width="164" height="30" rx="8" class="tint"/>
  <text x="266" y="201" class="t-xs mid ink">東アジア：漢詩が日本の物語へ</text>

  <rect x="12" y="222" width="336" height="50" rx="12" class="bgc"/>
  <text x="26" y="242" class="t-s ink" font-weight="700">語る・演じる・詠む・読む</text>
  <text x="26" y="261" class="t-xs soft">ギリシャと東アジアの古典は、それぞれ独自に生まれた</text>
</svg>
