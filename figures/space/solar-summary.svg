<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 太陽系の中の地球と月：何が何のまわりを回っているか。下の4つの箱が章の4枚に対応 -->
  <text x="14" y="20" class="t-s ink" font-weight="700">何が、何のまわりを回るか</text>

  <!-- ほかの惑星の通り道（外側） -->
  <ellipse cx="60" cy="106" rx="268" ry="72" class="st-line dash" stroke-width="1.2"/>
  <!-- 地球の通り道 -->
  <ellipse cx="60" cy="106" rx="150" ry="52" class="st-soft" stroke-width="1.2"/>
  <path d="M40 54.5 A150 52 0 0 1 150 64.5" class="st-f" stroke-width="2.5" marker-end="url(#a-space)"/>

  <!-- 太陽 -->
  <circle cx="60" cy="106" r="26" class="fl"/>
  <text x="60" y="110" class="t-s mid on" font-weight="700">太陽</text>

  <!-- 地球と月 -->
  <circle cx="210" cy="106" r="20" class="st-soft dash" stroke-width="1"/>
  <circle cx="210" cy="106" r="8" class="tint"/>
  <circle cx="210" cy="106" r="8" class="st-f" stroke-width="2"/>
  <circle cx="224" cy="92" r="4" class="soft"/>
  <text x="210" y="142" class="t-xs mid ink">地球</text>
  <text x="234" y="80" class="t-xs ink halo">月</text>
  <text x="140" y="102" class="t-xs mid soft">地球：1年で1周</text>
  <text x="140" y="116" class="t-xs mid soft">月：約1か月で1周</text>

  <!-- 外側の惑星 -->
  <circle cx="328" cy="106" r="12" class="tint"/>
  <circle cx="328" cy="106" r="12" class="st-soft" stroke-width="1.2"/>
  <text x="328" y="138" class="t-xs mid ink">木星など</text>
  <text x="300" y="166" class="t-xs mid soft halo">ほかの惑星</text>

  <!-- 章の4枚 -->
  <rect x="10" y="190" width="80" height="82" rx="10" class="tint"/>
  <text x="50" y="211" class="t-s mid ink" font-weight="700">季節</text>
  <text x="50" y="231" class="t-xs mid soft">地球が太陽を</text>
  <text x="50" y="246" class="t-xs mid soft">1年かけて回る</text>
  <text x="50" y="261" class="t-xs mid ink" font-weight="700">＋地軸の傾き</text>
  <rect x="96" y="190" width="80" height="82" rx="10" class="tint"/>
  <text x="136" y="211" class="t-s mid ink" font-weight="700">月の満ち欠け</text>
  <text x="136" y="231" class="t-xs mid soft">月が地球を</text>
  <text x="136" y="246" class="t-xs mid soft">約1か月で回る</text>
  <text x="136" y="261" class="t-xs mid ink" font-weight="700">見る角度が変化</text>
  <rect x="182" y="190" width="80" height="82" rx="10" class="tint"/>
  <text x="222" y="211" class="t-s mid ink" font-weight="700">太陽系の惑星</text>
  <text x="222" y="231" class="t-xs mid soft">8つの惑星が</text>
  <text x="222" y="246" class="t-xs mid soft">太陽を回る</text>
  <text x="222" y="261" class="t-xs mid ink" font-weight="700">岩とガスの星</text>
  <rect x="268" y="190" width="80" height="82" rx="10" class="tint"/>
  <text x="308" y="211" class="t-s mid ink" font-weight="700">日食と月食</text>
  <text x="308" y="231" class="t-xs mid soft">3つが一直線に</text>
  <text x="308" y="246" class="t-xs mid soft">並ぶとき</text>
  <text x="308" y="261" class="t-xs mid ink" font-weight="700">影が重なる</text>
</svg>
