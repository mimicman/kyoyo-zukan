<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 左：知ったつもりの人 -->
  <rect x="16" y="14" width="140" height="44" rx="12" class="bgc st-line" stroke-width="1.5"/>
  <text x="86" y="41" class="t-m mid soft">全部わかってる</text>
  <circle cx="86" cy="96" r="15" class="soft"/>
  <path d="M58 150 Q86 104 114 150Z" class="soft"/>
  <text x="86" y="172" class="t-s mid soft">知ったつもりの人</text>

  <!-- 右：ソクラテス -->
  <rect x="204" y="14" width="140" height="44" rx="12" class="tint st-f" stroke-width="1.5"/>
  <text x="274" y="32" class="t-s mid ink">知らない、と</text>
  <text x="274" y="50" class="t-m mid ink">知っている</text>
  <circle cx="274" cy="96" r="15" class="fl"/>
  <path d="M246 150 Q274 104 302 150Z" class="fl"/>
  <text x="274" y="172" class="t-m mid ink">ソクラテス</text>

  <!-- 問いかけ -->
  <path d="M244 112 H122" class="st-soft" stroke-width="2" marker-end="url(#a-soft)"/>
  <text x="182" y="102" class="t-s mid ink">問いかける</text>
  <text x="182" y="130" class="t-xs mid soft">答えに詰まる</text>

  <!-- 問答法のくり返し -->
  <rect x="16" y="188" width="328" height="88" rx="14" class="tint"/>
  <text x="30" y="206" class="t-xs fl">問答法</text>
  <rect x="32" y="214" width="76" height="32" rx="16" class="paper st-f" stroke-width="1.5"/>
  <text x="70" y="235" class="t-m mid ink">問い</text>
  <rect x="142" y="214" width="76" height="32" rx="16" class="paper st-f" stroke-width="1.5"/>
  <text x="180" y="235" class="t-m mid ink">答え</text>
  <rect x="252" y="214" width="76" height="32" rx="16" class="paper st-f" stroke-width="1.5"/>
  <text x="290" y="235" class="t-m mid ink">反例</text>
  <path d="M110 230 H138" class="st-f" stroke-width="2" marker-end="url(#a-philosophy)"/>
  <path d="M220 230 H248" class="st-f" stroke-width="2" marker-end="url(#a-philosophy)"/>
  <path d="M290 248 C290 274 70 274 70 252" class="st-f" stroke-width="2" marker-end="url(#a-philosophy)"/>
</svg>
