<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- カントのあと：カントから4つの問いが枝分かれし、それぞれの答え方が生まれた -->
  <text x="16" y="22" class="t-m ink">カントのあとに続いた4つの問い</text>

  <!-- 根：カント -->
  <circle cx="46" cy="148" r="30" class="fl"/>
  <text x="46" y="146" class="t-s mid on" font-weight="700">カント</text>
  <text x="46" y="161" class="t-xs mid on">18世紀</text>
  <text x="46" y="198" class="t-xs mid soft">認識の</text>
  <text x="46" y="212" class="t-xs mid soft">枠を示す</text>

  <!-- 4本の枝 -->
  <path d="M66 126 C92 80 108 61 132 61" class="st-f" stroke-width="2.5" fill="none" marker-end="url(#a-philosophy)"/>
  <path d="M76 140 C100 124 110 119 132 119" class="st-f" stroke-width="2.5" fill="none" marker-end="url(#a-philosophy)"/>
  <path d="M76 156 C100 172 110 177 132 177" class="st-f" stroke-width="2.5" fill="none" marker-end="url(#a-philosophy)"/>
  <path d="M66 170 C92 216 108 235 132 235" class="st-f" stroke-width="2.5" fill="none" marker-end="url(#a-philosophy)"/>

  <!-- 枝1：歴史 -->
  <rect x="138" y="34" width="210" height="54" rx="10" class="tint"/>
  <text x="150" y="50" class="t-xs soft">問い：考えや歴史はどう進む？</text>
  <text x="150" y="67" class="t-s ink" font-weight="700">弁証法（正・反・合）</text>
  <text x="150" y="82" class="t-xs fl">ヘーゲル　19世紀前半</text>

  <!-- 枝2：生き方 -->
  <rect x="138" y="92" width="210" height="54" rx="10" class="tint"/>
  <text x="150" y="108" class="t-xs soft">問い：私はどう生きればいい？</text>
  <text x="150" y="125" class="t-s ink" font-weight="700">実存は本質に先立つ</text>
  <text x="150" y="140" class="t-xs fl">サルトル　20世紀</text>

  <!-- 枝3：善悪 -->
  <rect x="138" y="150" width="210" height="54" rx="10" class="tint"/>
  <text x="150" y="166" class="t-xs soft">問い：正しい行いとは何か？</text>
  <text x="150" y="183" class="t-s ink" font-weight="700">結果（功利主義）か義務か</text>
  <text x="150" y="198" class="t-xs fl">ベンサム・ミル／カント</text>

  <!-- 枝4：言葉 -->
  <rect x="138" y="208" width="210" height="54" rx="10" class="tint"/>
  <text x="150" y="224" class="t-xs soft">問い：言葉の意味とは何か？</text>
  <text x="150" y="241" class="t-s ink" font-weight="700">意味は使い方（言語ゲーム）</text>
  <text x="150" y="256" class="t-xs fl">ウィトゲンシュタイン　20世紀</text>
</svg>
