<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 上：道具は本質が先 -->
  <text x="20" y="26" class="t-s soft">道具（ペーパーナイフ）の場合</text>
  <rect x="34" y="38" width="102" height="56" rx="8" class="tint st-f" stroke-width="1.5"/>
  <path d="M48 66 H100 L122 60 L100 72 H48Z" class="st-f dash" stroke-width="1.5"/>
  <path d="M146 66 H206" class="st-soft" stroke-width="2.5" marker-end="url(#a-soft)"/>
  <text x="176" y="58" class="t-xs mid soft">作る</text>
  <path d="M226 62 H290 L322 54 L290 74 H226Z" class="ink"/>
  <text x="85" y="114" class="t-s mid ink">① 設計図＝本質</text>
  <text x="274" y="114" class="t-s mid ink">② 物＝存在</text>

  <path d="M16 130 H344" class="st-line" stroke-width="1.5"/>

  <!-- 下：人間は存在が先 -->
  <text x="20" y="152" class="t-s soft">人間の場合</text>
  <circle cx="60" cy="180" r="11" class="fl"/>
  <path d="M42 226 Q60 188 78 226Z" class="fl"/>
  <text x="60" y="246" class="t-s mid ink">① まず存在</text>
  <!-- 分かれ道 -->
  <path d="M88 204 H130" class="st-f" stroke-width="2.5"/>
  <path d="M130 204 C160 204 180 170 214 170" class="st-soft dash" stroke-width="2"/>
  <path d="M130 204 C160 204 180 238 214 238" class="st-soft dash" stroke-width="2"/>
  <circle cx="218" cy="170" r="4" class="soft"/>
  <circle cx="218" cy="238" r="4" class="soft"/>
  <path d="M130 204 H244" class="st-f" stroke-width="2.5" marker-end="url(#a-philosophy)"/>
  <text x="200" y="196" class="t-xs mid fl">選ぶ</text>
  <rect x="250" y="180" width="94" height="48" rx="12" class="fl"/>
  <text x="297" y="200" class="t-s mid on">② 自分</text>
  <text x="297" y="218" class="t-s mid on">＝本質</text>
  <text x="297" y="246" class="t-xs mid soft">選択の積み重ね</text>
  <text x="297" y="262" class="t-xs mid soft">責任も自分に</text>
</svg>
