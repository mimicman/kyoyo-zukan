<svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
  <!-- 簡略世界地図（形と位置はおおよそ） -->
  <path d="M14 30 L96 22 L112 44 L96 74 L78 96 L66 112 L54 104 L36 72 L18 52 Z" class="tint"/>
  <path d="M66 112 L80 124" class="st-line" stroke-width="3"/>
  <path d="M76 126 L108 132 L118 160 L102 196 L88 222 L80 190 L70 150 Z" class="tint"/>
  <path d="M146 30 L320 24 L338 52 L326 86 L310 106 L292 126 L280 144 L268 132 L254 150 L244 128 L226 112 L206 104 L186 96 L164 92 L148 76 Z" class="tint"/>
  <path d="M164 100 L208 110 L230 128 L220 168 L200 208 L184 200 L172 156 L160 124 Z" class="tint"/>
  <path d="M344 60 L352 66 L348 88 L340 92 L338 76 Z" class="tint"/>
  <text x="60" y="46" class="t-xs mid soft">アメリカ大陸</text>
  <text x="196" y="44" class="t-xs mid soft">ヨーロッパ</text>
  <text x="194" y="160" class="t-xs mid soft">アフリカ</text>

  <!-- 小麦：西アジア -->
  <g class="st-f" stroke-width="2.2">
    <path d="M218 86 C206 70 196 60 186 56" marker-end="url(#a-food)"/>
    <path d="M214 94 C204 104 198 110 190 116" marker-end="url(#a-food)"/>
    <path d="M230 92 C240 104 246 110 252 118" marker-end="url(#a-food)"/>
    <path d="M232 84 C250 70 266 62 282 60" marker-end="url(#a-food)"/>
  </g>
  <circle cx="222" cy="90" r="7" class="fl"/>
  <text x="244" y="94" class="t-s ink halo" font-weight="700">小麦</text>

  <!-- 米：長江流域 -->
  <g class="st-soft" stroke-width="2.2">
    <path d="M300 94 C304 106 304 116 298 126" marker-end="url(#a-soft)"/>
    <path d="M294 98 C282 106 272 114 262 122" marker-end="url(#a-soft)"/>
    <path d="M310 88 C322 82 330 78 338 76" marker-end="url(#a-soft)"/>
  </g>
  <circle cx="304" cy="90" r="7" class="ink"/>
  <text x="324" y="112" class="t-s mid ink" font-weight="700">米</text>

  <!-- トウモロコシ：メキシコ -->
  <g class="st-f" stroke-width="2.2">
    <path d="M60 96 C50 80 46 66 46 56" marker-end="url(#a-food)"/>
    <path d="M70 108 C84 130 92 150 94 170" marker-end="url(#a-food)"/>
  </g>
  <circle cx="64" cy="102" r="7" class="paper"/>
  <circle cx="64" cy="102" r="7" class="st-f" stroke-width="3"/>
  <text x="20" y="128" class="t-xs ink halo" font-weight="700">トウモロコシ</text>

  <!-- 大西洋を渡る -->
  <path d="M112 64 C126 52 140 50 156 56" class="st-f dash" stroke-width="2" marker-end="url(#a-food)"/>
  <text x="134" y="40" class="t-xs mid fl halo">16世紀〜</text>

  <!-- 凡例 -->
  <path d="M4 234 H356" class="st-line" stroke-width="1"/>
  <circle cx="20" cy="250" r="6" class="fl"/>
  <text x="34" y="254" class="t-xs ink"><tspan font-weight="700">小麦</tspan>　1万年ほど前・西アジア（肥沃な三日月地帯）</text>
  <circle cx="20" cy="270" r="6" class="ink"/>
  <text x="34" y="274" class="t-xs ink"><tspan font-weight="700">米</tspan>　1万年ほど前〜・中国の長江流域</text>
  <circle cx="20" cy="290" r="6" class="paper"/>
  <circle cx="20" cy="290" r="6" class="st-f" stroke-width="3"/>
  <text x="34" y="294" class="t-xs ink"><tspan font-weight="700">トウモロコシ</tspan>　9000年ほど前・メキシコ</text>
</svg>
