<svg viewBox="0 0 360 304" xmlns="http://www.w3.org/2000/svg">
  <!-- 見出し -->
  <text x="110" y="20" class="t-m mid fl">アラビカ</text>
  <text x="200" y="20" class="t-m mid ink">カネフォラ</text>
  <text x="200" y="34" class="t-xs mid soft">（ロブスタ）</text>
  <text x="290" y="20" class="t-m mid ink">リベリカ</text>

  <!-- 豆の形 -->
  <text x="4" y="82" class="t-xs soft">豆の形</text>
  <ellipse cx="110" cy="78" rx="13" ry="24" class="fl"/>
  <path d="M110 56 C104 66 116 74 110 82 C104 90 116 94 110 100" class="st-line" stroke-width="2"/>
  <ellipse cx="200" cy="78" rx="18" ry="19" class="soft"/>
  <path d="M200 61 V95" class="st-line" stroke-width="2"/>
  <path d="M290 46 C310 48 310 96 294 108 C276 112 270 60 290 46 Z" class="soft"/>
  <path d="M290 50 C284 70 296 86 292 104" class="st-line" stroke-width="2"/>
  <text x="128" y="64" class="t-xs soft">細長い</text>
  <text x="222" y="64" class="t-xs soft">丸い</text>
  <text x="310" y="64" class="t-xs soft">大きい</text>

  <!-- 表 -->
  <g class="st-line" stroke-width="1">
    <path d="M4 118 H356 M4 152 H356 M4 196 H356 M4 226 H356 M4 266 H356"/>
  </g>
  <rect x="66" y="118" width="88" height="186" rx="8" class="tint" opacity="0.6"/>

  <text x="4" y="140" class="t-xs soft">原産</text>
  <text x="110" y="140" class="t-xs mid ink">エチオピア</text>
  <text x="200" y="140" class="t-xs mid ink">中央・西アフリカ</text>
  <text x="290" y="140" class="t-xs mid ink">西アフリカ</text>

  <text x="4" y="178" class="t-xs soft">育つ所</text>
  <text x="110" y="170" class="t-xs mid ink">涼しい高地</text>
  <text x="110" y="186" class="t-xs mid ink">病気に弱い</text>
  <text x="200" y="170" class="t-xs mid ink">暑い低地でも</text>
  <text x="200" y="186" class="t-xs mid ink">病気に強い</text>
  <text x="290" y="170" class="t-xs mid ink">暑い低地</text>
  <text x="290" y="186" class="t-xs mid ink">木も豆も大きい</text>

  <text x="4" y="215" class="t-xs soft">味</text>
  <text x="110" y="215" class="t-xs mid fl" font-weight="700">香りと酸味</text>
  <text x="200" y="215" class="t-xs mid ink" font-weight="700">苦味が強い</text>
  <text x="290" y="215" class="t-xs mid ink" font-weight="700">独特の香り</text>

  <text x="4" y="250" class="t-xs soft">カフェイン</text>
  <rect x="92" y="236" width="36" height="10" rx="3" class="fl"/>
  <text x="110" y="260" class="t-xs mid ink">ロブスタの約半分</text>
  <rect x="164" y="236" width="72" height="10" rx="3" class="ink"/>
  <text x="200" y="260" class="t-xs mid ink">多い</text>
  <text x="290" y="252" class="t-xs mid soft">－</text>

  <text x="4" y="290" class="t-xs soft">使われ方</text>
  <text x="110" y="290" class="t-xs mid ink">多くの店の豆</text>
  <text x="200" y="290" class="t-xs mid ink">インスタント・缶</text>
  <text x="290" y="290" class="t-xs mid ink">流通はごくわずか</text>
</svg>
