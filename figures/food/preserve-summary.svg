<svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
  <!-- 2つの円：味をつける／長持ちさせる -->
  <text x="96" y="18" class="t-s mid ink" font-weight="700">味をつける</text>
  <text x="266" y="18" class="t-s mid fl" font-weight="700">長持ちさせる</text>
  <circle cx="130" cy="112" r="86" class="tint"/>
  <circle cx="230" cy="112" r="86" class="fl" opacity="0.18"/>
  <circle cx="130" cy="112" r="86" class="st" stroke-width="1.5"/>
  <circle cx="230" cy="112" r="86" class="st-f" stroke-width="2"/>

  <text x="90" y="108" class="t-m mid ink" font-weight="700">スパイス</text>
  <text x="90" y="126" class="t-xs mid soft">香り・辛み</text>

  <text x="180" y="88" class="t-s mid ink" font-weight="700">塩・砂糖</text>
  <text x="180" y="104" class="t-xs mid soft">水分を奪う</text>
  <text x="180" y="130" class="t-s mid ink" font-weight="700">発酵</text>
  <text x="180" y="146" class="t-xs mid soft">味と日持ち</text>

  <text x="272" y="88" class="t-s mid ink" font-weight="700">缶詰</text>
  <text x="272" y="104" class="t-xs mid soft">熱で殺し密封</text>
  <text x="272" y="138" class="t-s mid ink" font-weight="700">冷蔵</text>
  <text x="272" y="154" class="t-xs mid soft">増え方を遅く</text>

  <text x="230" y="214" class="t-xs mid fl">＝ 微生物を増やさない工夫</text>

  <!-- 年表 -->
  <path d="M16 248 H344" class="st-line" stroke-width="2"/>
  <g class="fl"><circle cx="46" cy="248" r="5"/><circle cx="134" cy="248" r="5"/><circle cx="222" cy="248" r="5"/><circle cx="310" cy="248" r="5"/></g>
  <g class="t-xs mid fl">
    <text x="46" y="238">古代〜</text><text x="134" y="238">15世紀〜</text><text x="222" y="238">19世紀</text><text x="310" y="238">20世紀</text>
  </g>
  <g class="t-xs mid ink">
    <text x="46" y="268">塩漬け・干物</text><text x="46" y="282">発酵食品</text>
    <text x="134" y="268">スパイスを</text><text x="134" y="282">求めた航海</text>
    <text x="222" y="268">缶詰・瓶詰</text><text x="222" y="282">冷凍機</text>
    <text x="310" y="268">冷蔵庫が</text><text x="310" y="282">家庭へ</text>
  </g>
</svg>
