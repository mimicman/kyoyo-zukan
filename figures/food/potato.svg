<svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
  <!-- 簡略地図（形と位置はおおよそ） -->
  <path d="M10 20 L110 14 L124 40 L104 70 L84 92 L70 104 L54 92 L30 60 Z" class="tint"/>
  <path d="M70 116 L112 120 L130 150 L112 196 L94 236 L80 250 L70 210 L62 160 Z" class="tint"/>
  <path d="M206 48 L270 30 L350 30 L350 120 L300 132 L262 128 L236 120 L222 104 L230 84 L214 72 Z" class="tint"/>
  <path d="M188 52 L200 48 L204 62 L194 70 L184 64 Z" class="fl" opacity="0.55"/>
  <path d="M218 160 L270 150 L300 170 L290 220 L262 250 L240 230 L222 196 Z" class="tint"/>
  <text x="60" y="38" class="t-xs mid soft">北アメリカ</text>
  <text x="300" y="54" class="t-xs mid soft">ヨーロッパ</text>
  <text x="258" y="192" class="t-xs mid soft">アフリカ</text>

  <!-- 原産地 -->
  <circle cx="82" cy="170" r="12" class="fl" opacity="0.3"/>
  <circle cx="82" cy="170" r="5" class="fl"/>
  <text x="58" y="200" class="t-s end ink" font-weight="700">アンデス</text>
  <text x="58" y="216" class="t-xs end fl">原産地</text>
  <text x="96" y="274" class="t-xs mid ink">チューニョ：凍らせて干す保存食</text>

  <!-- 16世紀：スペインへ -->
  <path d="M96 164 C140 150 186 132 226 116" class="st-f" stroke-width="3" marker-end="url(#a-food)"/>
  <text x="160" y="160" class="t-xs mid fl halo" font-weight="700">16世紀</text>
  <text x="160" y="174" class="t-xs mid ink halo">スペイン人が運ぶ</text>
  <circle cx="232" cy="112" r="4" class="ink"/>
  <text x="240" y="122" class="t-xs ink">スペイン</text>

  <!-- 18世紀：ヨーロッパに広まる -->
  <g class="st-f" stroke-width="2">
    <path d="M238 104 C246 92 256 84 266 80" marker-end="url(#a-food)"/>
    <path d="M240 106 C264 98 286 90 306 82" marker-end="url(#a-food)"/>
  </g>
  <text x="318" y="100" class="t-xs mid ink">18世紀に</text>
  <text x="318" y="114" class="t-xs mid ink">各地で栽培</text>

  <!-- アイルランドの飢饉と移民 -->
  <text x="194" y="22" class="t-xs mid fl" font-weight="700">アイルランド</text>
  <path d="M194 26 V44" class="st-f" stroke-width="1"/>
  <path d="M182 60 C160 56 140 50 120 44" class="st-soft dash" stroke-width="2" marker-end="url(#a-soft)"/>
  <text x="152" y="78" class="t-xs mid ink halo">1840年代の大飢饉</text>
  <text x="152" y="92" class="t-xs mid soft halo">→ アメリカなどへ移民</text>

  <!-- 日本へ -->
  <rect x="200" y="258" width="152" height="36" rx="10" class="paper"/>
  <rect x="200" y="258" width="152" height="36" rx="10" class="st-f" stroke-width="1.2"/>
  <text x="276" y="273" class="t-xs mid ink">日本へは16世紀末ごろ</text>
  <text x="276" y="287" class="t-xs mid ink">ジャガタラから→ジャガイモ</text>
</svg>
