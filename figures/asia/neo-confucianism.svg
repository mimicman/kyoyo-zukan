<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 目標は聖人。左：朱子学は一歩ずつ学ぶ階段　右：陽明学は心から直接 -->
  <rect x="135" y="20" width="90" height="30" rx="15" class="fl"/>
  <text x="180" y="40" class="t-m mid on">聖人</text>

  <text x="20" y="92" class="t-m ink">朱子学（宋）</text>
  <rect x="20" y="200" width="48" height="50" class="tint st-f" stroke-width="1.5"/>
  <rect x="70" y="158" width="48" height="92" class="tint st-f" stroke-width="1.5"/>
  <rect x="120" y="116" width="48" height="134" class="fl"/>
  <text x="44" y="220" class="t-xs mid ink">物ごとを</text>
  <text x="44" y="234" class="t-xs mid ink">調べる</text>
  <text x="94" y="178" class="t-xs mid ink">理を</text>
  <text x="94" y="192" class="t-xs mid ink">知る</text>
  <text x="144" y="136" class="t-xs mid on">心を</text>
  <text x="144" y="150" class="t-xs mid on">正す</text>
  <path d="M150 110 L166 56" class="st-f" stroke-width="2" marker-end="url(#a-asia)"/>
  <text x="94" y="270" class="t-s mid ink">格物致知：一歩ずつ</text>

  <text x="340" y="92" class="t-m end ink">陽明学（明）</text>
  <circle cx="290" cy="160" r="34" class="fl"/>
  <text x="290" y="157" class="t-m mid on">心</text>
  <text x="290" y="174" class="t-xs mid on">＝理</text>
  <path d="M272 128 L202 56" class="st-f" stroke-width="2" marker-end="url(#a-asia)"/>
  <rect x="226" y="214" width="50" height="26" rx="6" class="tint"/>
  <text x="251" y="231" class="t-s mid ink">知る</text>
  <rect x="304" y="214" width="46" height="26" rx="6" class="tint"/>
  <text x="327" y="231" class="t-s mid ink">行う</text>
  <text x="290" y="232" class="t-m mid ink">＝</text>
  <path d="M290 194 V210" class="st-soft" stroke-width="1.5"/>
  <text x="290" y="270" class="t-s mid ink">知行合一：すぐ行う</text>
</svg>
