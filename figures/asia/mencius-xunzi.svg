<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 左：孟子（善の芽を育てる）　右：荀子（曲がった木を型で正す） -->
  <path d="M180 16 V222" class="st-line dash" stroke-width="1.5"/>
  <text x="90" y="26" class="t-m mid ink">孟子：性善説</text>
  <text x="270" y="26" class="t-m mid ink">荀子：性悪説</text>

  <!-- 孟子 -->
  <path d="M16 196 H166" class="st-soft" stroke-width="1.5"/>
  <path d="M42 196 V178" class="st-f" stroke-width="2.5"/>
  <path d="M42 182 Q30 172 28 162 Q40 166 42 180 Z" class="fl"/>
  <path d="M42 180 Q54 170 58 160 Q44 164 42 178 Z" class="fl"/>
  <text x="42" y="214" class="t-xs mid ink">善の芽</text>
  <text x="42" y="228" class="t-xs mid soft">（四端）</text>
  <path d="M66 166 H96" class="st-f" stroke-width="2" marker-end="url(#a-asia)"/>
  <text x="81" y="156" class="t-xs mid ink">育てる</text>
  <rect x="128" y="140" width="12" height="56" class="st-f tint" stroke-width="1.5"/>
  <circle cx="134" cy="102" r="40" class="fl"/>
  <text x="134" y="98" class="t-s mid on">仁・義</text>
  <text x="134" y="115" class="t-s mid on">礼・智</text>
  <text x="134" y="214" class="t-xs mid ink">善い人に</text>

  <!-- 荀子 -->
  <path d="M196 196 H346" class="st-soft" stroke-width="1.5"/>
  <path d="M220 192 Q206 172 222 156 Q238 140 220 120 Q206 104 218 82" class="st-f" stroke-width="6" stroke-linecap="round"/>
  <text x="222" y="214" class="t-xs mid ink">欲に流れる</text>
  <text x="222" y="228" class="t-xs mid soft">（曲がった木）</text>
  <path d="M246 140 H286" class="st-f" stroke-width="2" marker-end="url(#a-asia)"/>
  <text x="266" y="122" class="t-xs mid ink">礼と学問</text>
  <text x="266" y="134" class="t-xs mid ink">で正す</text>
  <path d="M316 192 V82" class="st-f" stroke-width="6" stroke-linecap="round"/>
  <rect x="300" y="96" width="10" height="24" rx="2" class="tint st"/>
  <rect x="322" y="96" width="10" height="24" rx="2" class="tint st"/>
  <rect x="300" y="152" width="10" height="24" rx="2" class="tint st"/>
  <rect x="322" y="152" width="10" height="24" rx="2" class="tint st"/>
  <text x="316" y="214" class="t-xs mid ink">まっすぐに</text>
  <text x="316" y="228" class="t-xs mid soft">（型で直す）</text>

  <rect x="40" y="242" width="280" height="28" rx="14" class="tint"/>
  <text x="180" y="260" class="t-s mid ink">どちらも儒家：学ぶことで善くなる</text>
</svg>
