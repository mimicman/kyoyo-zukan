  <path d="M143 36 H212" class="st-f" stroke-width="2" marker-end="url(#a-asia)"/>
  <path d="M233 36 H302" class="st-f" stroke-width="2" marker-end="url(#a-asia)"/>
  <circle cx="45" cy="36" r="8" class="fl"/>
