  <path d="M40 220 L50 219.8 L60 219.3 L70 218.5 L80 217.3 L90 215.8 L100 214 L110 211.8 L120 209.3 L130 206.5 L140 203.3 L150 199.8 L160 196 L170 191.8 L180 187.3 L190 182.5 L200 177.3 L210 171.8 L220 166 L230 159.8 L240 153.3 L250 146.5 L260 139.3 L270 131.8 L280 124 L290 115.8 L300 107.3 L310 98.5 L320 89.3 L330 79.8" class="st-f" stroke-width="3" fill="none"/>
