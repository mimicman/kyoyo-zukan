<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 左：村の共同体（全員がつながる）、右：近代の4つの変化 -->
  <text x="12" y="24" class="t-m ink">村の暮らしから、都市と大きな組織へ</text>

  <rect x="12" y="52" width="104" height="180" rx="12" class="tint"/>
  <g class="st" stroke-width="1.5">
    <path d="M64 92 L95 114 L83 150 L45 150 L33 114 Z"/>
    <path d="M64 92 L83 150 L33 114 L95 114 L45 150 Z"/>
  </g>
  <circle cx="64" cy="92" r="6" class="ink"/>
  <circle cx="95" cy="114" r="6" class="ink"/>
  <circle cx="83" cy="150" r="6" class="ink"/>
  <circle cx="45" cy="150" r="6" class="ink"/>
  <circle cx="33" cy="114" r="6" class="ink"/>
  <text x="64" y="184" class="t-s mid ink" font-weight="700">共同体</text>
  <text x="64" y="204" class="t-xs mid soft">まるごとの</text>
  <text x="64" y="218" class="t-xs mid soft">付き合い</text>
  <text x="64" y="70" class="t-xs mid soft">村・家族</text>

  <path d="M120 120 Q150 100 174 64" class="st-f" stroke-width="2" fill="none" marker-end="url(#a-sociology)"/>
  <path d="M120 132 Q150 126 172 118" class="st-f" stroke-width="2" fill="none" marker-end="url(#a-sociology)"/>
  <path d="M120 148 Q150 154 172 168" class="st-f" stroke-width="2" fill="none" marker-end="url(#a-sociology)"/>
  <path d="M120 160 Q150 180 174 218" class="st-f" stroke-width="2" fill="none" marker-end="url(#a-sociology)"/>
  <text x="140" y="144" class="t-xs mid fl halo">近代化</text>

  <!-- 利益社会 -->
  <g class="st-soft" stroke-width="1.5"><path d="M186 50 L214 42"/><path d="M196 76 L228 80"/></g>
  <g class="soft"><circle cx="186" cy="50" r="5"/><circle cx="214" cy="42" r="5"/><circle cx="238" cy="60" r="5"/><circle cx="196" cy="76" r="5"/><circle cx="228" cy="80" r="5"/></g>
  <text x="252" y="56" class="t-s ink" font-weight="700">利益社会</text>
  <text x="252" y="74" class="t-xs soft">目的ごとにつながる</text>

  <!-- 資本主義の精神 -->
  <g class="fl">
    <rect x="186" y="124" width="14" height="6" rx="1"/><rect x="186" y="117" width="14" height="6" rx="1"/>
    <rect x="204" y="124" width="14" height="6" rx="1"/><rect x="204" y="117" width="14" height="6" rx="1"/><rect x="204" y="110" width="14" height="6" rx="1"/>
    <rect x="222" y="124" width="14" height="6" rx="1"/><rect x="222" y="117" width="14" height="6" rx="1"/><rect x="222" y="110" width="14" height="6" rx="1"/><rect x="222" y="103" width="14" height="6" rx="1"/>
  </g>
  <text x="252" y="112" class="t-s ink" font-weight="700">働く精神</text>
  <text x="252" y="130" class="t-xs soft">勤勉に働き、貯める</text>

  <!-- 官僚制 -->
  <path d="M212 146 L186 190 L238 190 Z" class="fl"/>
  <path d="M201 166 H223 M194 178 H230" class="st-line" stroke-width="1.5"/>
  <text x="252" y="166" class="t-s ink" font-weight="700">官僚制</text>
  <text x="252" y="184" class="t-xs soft">規則と階層で動く</text>

  <!-- 個人化 -->
  <circle cx="186" cy="226" r="6" class="fl"/>
  <g class="st-f" stroke-width="2" fill="none">
    <path d="M192 226 Q210 226 236 208"/><path d="M192 226 H238"/><path d="M192 226 Q210 226 236 244"/>
  </g>
  <text x="252" y="222" class="t-s ink" font-weight="700">個人化</text>
  <text x="252" y="240" class="t-xs soft">人生を選び、背負う</text>

  <text x="12" y="266" class="t-xs soft">19世紀〜 工業化と都市化で、つながり方と生き方が変わった</text>
</svg>
