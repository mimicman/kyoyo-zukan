<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 左：社会の層を世代ごとに移る家族、右：家族が渡すもの・家族の形 -->
  <text x="12" y="24" class="t-m ink">家族を通じて、層は受け継がれ、移る</text>

  <rect x="12" y="40" width="224" height="62" rx="6" class="tint"/>
  <rect x="12" y="106" width="224" height="62" rx="6" class="bgc"/>
  <rect x="12" y="172" width="224" height="62" rx="6" class="tint"/>
  <text x="20" y="56" class="t-xs soft">上の層</text>
  <text x="20" y="122" class="t-xs soft">中の層</text>
  <text x="20" y="188" class="t-xs soft">下の層</text>

  <!-- 家（孫・子・親） -->
  <path d="M64 202 L80 188 L96 202 Z" class="fl"/><rect x="68" y="202" width="24" height="22" class="fl"/>
  <text x="80" y="219" class="t-xs mid on">親</text>
  <path d="M134 136 L150 122 L166 136 Z" class="fl"/><rect x="138" y="136" width="24" height="22" class="fl"/>
  <text x="150" y="153" class="t-xs mid on">子</text>
  <path d="M196 70 L212 56 L228 70 Z" class="fl"/><rect x="200" y="70" width="24" height="22" class="fl"/>
  <text x="212" y="87" class="t-xs mid on">孫</text>
  <path d="M96 212 Q124 206 136 162" class="st-f" stroke-width="2" fill="none" marker-end="url(#a-sociology)"/>
  <path d="M166 146 Q194 140 204 96" class="st-f" stroke-width="2" fill="none" marker-end="url(#a-sociology)"/>
  <text x="228" y="226" class="t-xs end ink">世代をこえて層を移る</text>

  <!-- 右：家族が渡すもの -->
  <rect x="244" y="40" width="104" height="96" rx="10" class="tint st-f" stroke-width="1.5"/>
  <text x="296" y="60" class="t-xs mid ink" font-weight="700">家族が渡すもの</text>
  <g class="t-xs mid soft">
    <text x="296" y="82">お金・住まい</text>
    <text x="296" y="100">教育</text>
    <text x="296" y="118" class="fl">文化資本</text>
  </g>
  <rect x="244" y="144" width="104" height="90" rx="10" class="bgc"/>
  <text x="296" y="164" class="t-xs mid ink" font-weight="700">家族の形</text>
  <g class="t-xs mid soft">
    <text x="296" y="184">大家族</text>
    <text x="296" y="202">↓ 核家族</text>
    <text x="296" y="220">↓ さまざまな形</text>
  </g>
  <text x="12" y="262" class="t-xs soft">開かれた社会ほど、親と違う層に移りやすい</text>
</svg>
