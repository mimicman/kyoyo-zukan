<rect x="284" y="76" width="40" height="22" class="paper st" stroke-width="1.5"/><path d="M278 76 L304 58 L330 76 Z" class="fl"/>
<text x="56" y="116" class="t-s ink mid" font-weight="700">領地（藩）</text>
