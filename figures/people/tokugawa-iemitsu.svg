<path d="M24 228 H336" class="st-soft" stroke-width="2"/>
<circle cx="48" cy="228" r="6" class="fl"/>
<text x="48" y="216" class="t-xs fl mid" font-weight="700">1635</text>
<text x="48" y="248" class="t-xs ink mid">日本人の</text>
<text x="48" y="262" class="t-xs ink mid">海外渡航を禁止</text>
<circle cx="136" cy="228" r="6" class="fl"/>
<text x="136" y="216" class="t-xs fl mid" font-weight="700">1637</text>
