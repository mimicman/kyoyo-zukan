<circle cx="230" cy="42" r="3.5" class="paper st-f" stroke-width="1.5"/>
<text x="180" y="22" class="t-xs fl mid" font-weight="700">1年おきに江戸へ</text>
<path d="M270 96 C210 128 150 128 90 96" class="st-soft" stroke-width="2" marker-end="url(#a-soft)"/>
<text x="180" y="138" class="t-xs soft mid">領地へ戻る</text>
