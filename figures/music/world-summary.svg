<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 左：日本は時代ごとに積み重なる／右：アメリカは出会って混ざる -->
  <path d="M180 30 V270" class="st-line dash" stroke-width="1.5"/>
  <text x="94" y="26" class="t-xs mid soft">日本の伝統音楽</text>
  <text x="94" y="48" class="t-m mid ink">積み重なる</text>
  <text x="266" y="26" class="t-xs mid soft">アメリカの音楽</text>
  <text x="266" y="48" class="t-m mid ink">混ざり合う</text>

  <path d="M16 224 V100" class="st-soft" stroke-width="1.5" marker-end="url(#a-soft)"/>
  <rect x="24" y="104" width="144" height="34" rx="8" class="fl"/>
  <text x="34" y="126" class="t-s on" font-weight="700">三味線音楽</text>
  <text x="160" y="126" class="t-xs end on">江戸・町人</text>
  <rect x="24" y="144" width="144" height="34" rx="8" class="tint"/>
  <text x="34" y="166" class="t-s ink" font-weight="700">能</text>
  <text x="160" y="166" class="t-xs end soft">室町・武家</text>
  <rect x="24" y="184" width="144" height="34" rx="8" class="tint"/>
  <text x="34" y="206" class="t-s ink" font-weight="700">雅楽</text>
  <text x="160" y="206" class="t-xs end soft">奈良・平安・宮廷</text>
  <text x="96" y="242" class="t-xs mid ink">古いものが消えず、今も続く</text>

  <rect x="190" y="66" width="74" height="44" rx="8" class="tint"/>
  <text x="227" y="85" class="t-s mid ink" font-weight="700">アフリカ</text>
  <text x="227" y="101" class="t-xs mid soft">由来の歌</text>
  <rect x="270" y="66" width="78" height="44" rx="8" class="tint"/>
  <text x="309" y="85" class="t-s mid ink" font-weight="700">ヨーロッパ</text>
  <text x="309" y="101" class="t-xs mid soft">和音と楽器</text>
  <path d="M227 112 Q230 136 260 146 M309 112 Q306 136 276 146" class="st-f" stroke-width="2"/>
  <path d="M268 140 V148" class="st-f" stroke-width="2" marker-end="url(#a-music)"/>
  <rect x="222" y="152" width="92" height="38" rx="8" class="fl"/>
  <text x="268" y="168" class="t-s mid on" font-weight="700">ジャズ</text>
  <text x="268" y="183" class="t-xs mid on">20世紀初め</text>
  <path d="M268 191 V204" class="st-f" stroke-width="2" marker-end="url(#a-music)"/>
  <rect x="222" y="208" width="92" height="38" rx="8" class="fl"/>
  <text x="268" y="224" class="t-s mid on" font-weight="700">ロック</text>
  <text x="268" y="239" class="t-xs mid on">1950年代</text>
  <text x="266" y="266" class="t-xs mid ink">出会って混ざり、新しく生まれる</text>
</svg>
