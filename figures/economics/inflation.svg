<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 4つの段階が時計回りに回る -->
  <rect x="112" y="8" width="136" height="40" rx="20" class="fl"/>
  <text x="180" y="33" class="t-m mid on">物価が上がる</text>

  <rect x="222" y="104" width="132" height="40" rx="20" class="tint st-f" stroke-width="2"/>
  <text x="288" y="129" class="t-m mid ink">金利を上げる</text>

  <rect x="112" y="200" width="136" height="40" rx="20" class="tint st-f" stroke-width="2"/>
  <text x="180" y="225" class="t-m mid ink">お金を使いにくく</text>

  <rect x="6" y="104" width="132" height="40" rx="20" class="bgc st-soft" stroke-width="2"/>
  <text x="72" y="129" class="t-m mid ink">物価が落ち着く</text>

  <path d="M252 30 C296 34 306 64 300 98" class="st-f" stroke-width="2.5" marker-end="url(#a-economics)"/>
  <path d="M300 150 C306 190 288 214 254 220" class="st-f" stroke-width="2.5" marker-end="url(#a-economics)"/>
  <path d="M108 220 C70 214 54 190 60 150" class="st-f" stroke-width="2.5" marker-end="url(#a-economics)"/>
  <path d="M60 98 C54 64 70 34 106 30" class="st-soft dash" stroke-width="2" marker-end="url(#a-soft)"/>

  <!-- 中央：ブレーキ役 -->
  <circle cx="180" cy="124" r="32" class="paper st-f" stroke-width="2"/>
  <text x="180" y="119" class="t-xs mid soft">中央銀行</text>
  <text x="180" y="137" class="t-m mid fl">ブレーキ</text>

  <text x="180" y="268" class="t-xs mid soft">景気が冷えすぎたら、逆に金利を下げる（アクセル）</text>
</svg>
