<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 軸 -->
  <path d="M50 18 V244 H344" class="st" stroke-width="2"/>
  <text x="50" y="12" class="t-s mid soft">価格</text>
  <text x="344" y="264" class="t-s end soft">量</text>

  <!-- 高いと余る／安いと足りない -->
  <path d="M119 75 H271" class="st-soft dash" stroke-width="1.5"/>
  <text x="195" y="68" class="t-xs mid soft">高いと余る（売れ残り）</text>
  <path d="M112 190 H278" class="st-soft dash" stroke-width="1.5"/>
  <text x="195" y="208" class="t-xs mid soft">安いと足りない（品切れ）</text>

  <!-- 需要（右下がり）と供給（右上がり） -->
  <path d="M70 40 L320 220" class="st" stroke-width="3" stroke-linecap="round"/>
  <path d="M70 220 L320 40" class="st-f" stroke-width="3" stroke-linecap="round"/>
  <text x="76" y="34" class="t-m ink">需要</text>
  <text x="318" y="34" class="t-m end fl">供給</text>

  <!-- 均衡点 -->
  <path d="M50 130 H195 V244" class="st-f dash" stroke-width="1.5"/>
  <circle cx="195" cy="130" r="8" class="fl"/>
  <circle cx="195" cy="130" r="14" class="st-f" stroke-width="1.5" opacity="0.5"/>
  <text x="56" y="124" class="t-xs fl">均衡価格</text>
  <text x="195" y="262" class="t-xs mid fl">取引量</text>
</svg>
