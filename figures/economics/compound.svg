<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 凡例：元本100万円・年5% -->
  <text x="16" y="20" class="t-s ink">元本100万円・年5%</text>
  <rect x="16" y="32" width="12" height="12" rx="3" class="soft"/>
  <text x="34" y="43" class="t-xs soft">単利</text>
  <rect x="70" y="32" width="12" height="12" rx="3" class="fl"/>
  <text x="88" y="43" class="t-xs fl">複利</text>

  <!-- 棒グラフ（高さ＝金額×0.44） -->
  <path d="M30 244 H344" class="st-soft" stroke-width="1.5"/>
  <!-- 0年 -->
  <rect x="52" y="200" width="26" height="44" rx="3" class="soft"/>
  <rect x="82" y="200" width="26" height="44" rx="3" class="fl"/>
  <!-- 10年 -->
  <rect x="132" y="178" width="26" height="66" rx="3" class="soft"/>
  <rect x="162" y="172" width="26" height="72" rx="3" class="fl"/>
  <!-- 20年 -->
  <rect x="212" y="156" width="26" height="88" rx="3" class="soft"/>
  <rect x="242" y="127" width="26" height="117" rx="3" class="fl"/>
  <!-- 30年 -->
  <rect x="292" y="134" width="26" height="110" rx="3" class="soft"/>
  <rect x="322" y="54" width="26" height="190" rx="3" class="fl"/>

  <text x="80" y="192" class="t-xs mid soft">100万</text>
  <text x="175" y="164" class="t-xs mid fl">163万</text>
  <text x="255" y="119" class="t-xs mid fl">265万</text>
  <text x="305" y="126" class="t-xs mid soft">250万</text>
  <text x="335" y="46" class="t-m mid fl">432万</text>

  <text x="80" y="262" class="t-s mid soft">今</text>
  <text x="160" y="262" class="t-s mid soft">10年</text>
  <text x="240" y="262" class="t-s mid soft">20年</text>
  <text x="320" y="262" class="t-s mid soft">30年</text>

  <!-- 差が開いていく -->
  <path d="M120 120 C170 110 230 80 296 58" class="st-f dash" stroke-width="2" marker-end="url(#a-economics)"/>
  <text x="116" y="140" class="t-xs fl">時間がたつほど差が開く</text>
</svg>
