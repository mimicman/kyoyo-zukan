  <rect x="226" y="78" width="124" height="28" rx="7" class="paper"/><rect x="226" y="78" width="124" height="28" rx="7" class="st-line" stroke-width="1.5"/><text x="288.0" y="97.0" class="t-s mid soft">陰性 1人</text>
