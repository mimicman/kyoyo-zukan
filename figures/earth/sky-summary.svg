  <text x="304" y="102" class="t-xs ink"><tspan font-weight="700">C</tspan> 温帯</text>
  <path d="M267.8 99.1 L300 78" class="st-soft" stroke-width="1"/>
  <text x="304" y="82" class="t-xs ink"><tspan font-weight="700">D</tspan> 冷帯</text>
  <path d="M248.5 91.3 L300 58" class="st-soft" stroke-width="1"/>
  <text x="304" y="62" class="t-xs ink"><tspan font-weight="700">E</tspan> 寒帯</text>
  <text x="256" y="232" class="t-xs mid soft">気温と雨で分けた気候帯</text>

  <path d="M170 246 L188 222" class="st-soft" stroke-width="1.5" marker-end="url(#a-soft)"/>
</svg>
