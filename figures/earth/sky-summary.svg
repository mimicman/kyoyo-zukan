  <path d="M170 150 H302" class="st dash" stroke-width="1"/>
  <text x="168" y="166" class="t-xs end soft">赤道</text>
  <path d="M295.1 139.6 L300 140" class="st-soft" stroke-width="1"/>
  <text x="304" y="144" class="t-xs ink"><tspan font-weight="700">A</tspan> 熱帯</text>
  <path d="M289.2 122.3 L300 118" class="st-soft" stroke-width="1"/>
