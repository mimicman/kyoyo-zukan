<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 左：大気の層と気温（右へ行くほど暖かい）。対流圏の中で水がめぐり、低気圧や前線で雨になる。右：その結果としての気候帯 -->
  <text x="14" y="18" class="t-s ink" font-weight="700">空気の層 → 水のめぐり → 気候</text>

  <!-- 大気の層（高さは縮尺どおりではない） -->
  <rect x="14" y="116" width="156" height="12" class="tint"/>
  <text x="20" y="125" class="t-xs fl">オゾン層</text>
  <path d="M14 66 H170 M14 104 H170 M14 150 H170" class="st-line dash" stroke-width="1"/>
  <path d="M14 250 H170" class="st-soft" stroke-width="2"/>
  <text x="20" y="44" class="t-s ink">熱圏</text>
  <text x="20" y="88" class="t-s ink">中間圏</text>
  <text x="20" y="144" class="t-s ink">成層圏</text>
  <text x="20" y="166" class="t-s ink" font-weight="700">対流圏</text>
  <!-- 気温の変わり方 -->
  <path d="M160 250 L120 150 L150 104 L116 66 L166 32" class="st-f" stroke-width="2.5"/>
  <text x="166" y="268" class="t-xs end fl">気温（右ほど暖かい）</text>

  <!-- 水の循環（対流圏の中） -->
  <ellipse cx="78" cy="186" rx="20" ry="9" class="soft"/>
  <ellipse cx="92" cy="182" rx="14" ry="8" class="soft"/>
  <path d="M70 198 L66 214 M80 198 L76 214 M90 198 L86 214" class="st-soft" stroke-width="1.5"/>
  <text x="98" y="216" class="t-xs ink">雨</text>
  <text x="98" y="230" class="t-xs fl">低気圧や</text>
  <text x="98" y="243" class="t-xs fl">前線で</text>
  <path d="M40 244 L52 202" class="st-f" stroke-width="2" marker-end="url(#a-earth)"/>
  <text x="16" y="230" class="t-xs ink">蒸発</text>

