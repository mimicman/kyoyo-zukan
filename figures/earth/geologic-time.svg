<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="20" class="t-xs soft">46億年前 地球誕生</text>
  <text x="340" y="20" class="t-xs end soft">現在</text>
  <!-- 全体（長さは時間に比例） -->
  <rect x="20" y="28" width="282.5" height="28" class="tint"/>
  <rect x="302.5" y="28" width="37.5" height="28" class="fl"/>
  <rect x="20" y="28" width="320" height="28" class="st" stroke-width="1.5"/>
  <text x="160" y="47" class="t-s mid ink">先カンブリア時代（全体の約9割）</text>
  <path d="M61.7 56 V68 M173.0 56 V68" class="st-soft" stroke-width="1.5"/>
  <text x="61.7" y="80" class="t-xs mid ink">生命の誕生</text>
  <text x="61.7" y="93" class="t-xs mid soft">約40億年前</text>
  <text x="173.0" y="80" class="t-xs mid ink">酸素がふえる</text>
  <text x="173.0" y="93" class="t-xs mid soft">約24億年前</text>
  <!-- 拡大 -->
  <path d="M302.5 56 L20 110 M340 56 V110" class="st-line dash" stroke-width="1.5"/>
  <text x="300" y="80" class="t-xs mid soft">最後の約5億年</text>
  <text x="300" y="93" class="t-xs mid soft">を拡大 ↓</text>
  <rect x="20" y="110" width="170.4" height="30" class="fl" opacity="0.45"/>
  <rect x="190.4" y="110" width="110.4" height="30" class="fl" opacity="0.7"/>
  <rect x="300.8" y="110" width="39.2" height="30" class="fl"/>
  <text x="105.2" y="130" class="t-s mid ink">古生代</text>
  <text x="245.6" y="130" class="t-s mid ink">中生代</text>
  <text x="320.4" y="130" class="t-xs mid on">新生代</text>
  <!-- できごと -->
  <path d="M21 140 V172" class="st-soft" stroke-width="1.5"/>
  <text x="20" y="184" class="t-xs ink">生き物が急に多様に</text>
  <path d="M90.6 140 V150" class="st-soft" stroke-width="1.5"/>
  <text x="90.6" y="162" class="t-xs mid ink">生物が陸へ</text>
  <path d="M192.4 150 V156 H298.8 V150" class="st-soft" stroke-width="1.5"/>
  <text x="245.6" y="172" class="t-xs mid ink">恐竜がさかえる</text>
  <path d="M300.8 140 V190" class="st-soft" stroke-width="1.5"/>
  <text x="300.8" y="202" class="t-xs mid ink">恐竜の絶滅</text>
  <text x="300.8" y="215" class="t-xs mid soft">6600万年前</text>
  <path d="M338 140 V226" class="st-f" stroke-width="2"/>
  <text x="350" y="238" class="t-xs end fl">人類の登場</text>
  <text x="350" y="251" class="t-xs end soft">数百万年前</text>
  <text x="14" y="274" class="t-xs soft">46億年を1年にすると、現生人類は大みそかの夜遅く</text>
</svg>
