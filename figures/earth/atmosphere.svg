<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 層（高さの比は実際とは異なる） -->
  <rect x="8" y="16" width="344" height="64" class="tint"/>
  <rect x="8" y="80" width="344" height="60" class="paper"/>
  <rect x="8" y="140" width="344" height="70" class="tint"/>
  <rect x="8" y="210" width="344" height="50" class="paper"/>
  <path d="M8 80 H352 M8 140 H352 M8 210 H352" class="st-line" stroke-width="1.5"/>
  <path d="M8 260 H352" class="st" stroke-width="2"/>
  <!-- 層の名前 -->
  <text x="16" y="44" class="t-m ink">熱圏</text>
  <text x="16" y="62" class="t-xs soft">オーロラが光る</text>
  <text x="16" y="106" class="t-m ink">中間圏</text>
  <text x="16" y="124" class="t-xs soft">流れ星が光る</text>
  <text x="16" y="168" class="t-m ink">成層圏</text>
  <text x="16" y="186" class="t-xs soft">オゾン層が紫外線を吸う</text>
  <text x="16" y="232" class="t-m fl">対流圏</text>
  <text x="16" y="250" class="t-xs soft">雲ができ天気が変わる</text>
  <!-- 境目の高さ -->
  <text x="192" y="76" class="t-xs end soft">約80km</text>
  <text x="192" y="136" class="t-xs end soft">約50km</text>
  <text x="192" y="206" class="t-xs end soft">約10〜16km</text>
  <!-- オゾン層 -->
  <path d="M200 166 H352" class="st-f dash" stroke-width="3"/>
  <!-- 気温の変化 -->
  <path d="M300 260 L226 210 L292 140 L214 80 L340 22" class="st-f" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="226" cy="210" r="4" class="fl"/>
  <circle cx="292" cy="140" r="4" class="fl"/>
  <circle cx="214" cy="80" r="4" class="fl"/>
  <text x="312" y="252" class="t-xs fl">気温</text>
  <text x="270" y="275" class="t-xs mid soft">← 低い　気温　高い →</text>
</svg>
