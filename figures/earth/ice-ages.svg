  <circle cx="340.0" cy="54" r="5" class="fl"/>
  <text x="340.0" y="40" class="t-xs end ink" font-weight="700">今</text>
  <path d="M20 150 H340" class="st-soft" stroke-width="1.2"/>
  <text x="20" y="164" class="t-xs soft">80万年前</text>
  <text x="180" y="164" class="t-xs mid soft">40万年前</text>
  <text x="340" y="164" class="t-xs end soft">今</text>
  <path d="M220.0 131 H260.0" class="st" stroke-width="1.2" marker-start="url(#a-ink)" marker-end="url(#a-ink)"/>
  <text x="240.0" y="144" class="t-xs mid ink halo">約10万年</text>

  <path d="M12 174 H348" class="st-line" stroke-width="1"/>
  <text x="12" y="191" class="t-xs soft">原因の一つ：地球の回り方の3つの揺れ（ミランコビッチ周期）</text>

  <!-- ① 軌道の形 -->
  <ellipse cx="66" cy="222" rx="40" ry="18" class="st-f" stroke-width="1.8"/>
  <ellipse cx="66" cy="222" rx="30" ry="24" class="st-soft dash" stroke-width="1.2"/>
  <circle cx="60" cy="222" r="5" class="fl"/>
  <text x="66" y="262" class="t-xs mid ink" font-weight="700">① 軌道の形</text>
  <text x="66" y="276" class="t-xs mid soft">約10万年</text>

  <!-- ② 地軸の傾き -->
  <circle cx="180" cy="222" r="18" class="tint"/>
  <circle cx="180" cy="222" r="18" class="st-soft" stroke-width="1.2"/>
  <path d="M171 196 L189 248" class="st-f" stroke-width="2"/>
  <path d="M166 198 L194 246" class="st-soft dash" stroke-width="1.2"/>
  <text x="180" y="262" class="t-xs mid ink" font-weight="700">② 地軸の傾き</text>
  <text x="180" y="276" class="t-xs mid soft">約4万年</text>

  <!-- ③ 首振り -->
  <circle cx="294" cy="226" r="16" class="tint"/>
  <circle cx="294" cy="226" r="16" class="st-soft" stroke-width="1.2"/>
  <path d="M286 200 L302 252" class="st-f" stroke-width="2"/>
  <ellipse cx="294" cy="200" rx="14" ry="5" class="st-soft dash" stroke-width="1.2"/>
  <text x="294" y="262" class="t-xs mid ink" font-weight="700">③ 軸の首振り</text>
  <text x="294" y="276" class="t-xs mid soft">約2万年</text>
</svg>
