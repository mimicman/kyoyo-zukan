<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 氷期と間氷期：過去約80万年、気温はおよそ10万年ごとにゆっくり下がり急に上がる（模式図）。原因の一つは地球の回り方の3つの揺れ -->
  <text x="12" y="22" class="t-m ink">寒い時代と暖かい時代のくり返し</text>
  <rect x="20" y="46" width="320" height="18" class="tint" opacity="0.7"/>
  <text x="24" y="40" class="t-xs fl">暖かい（間氷期）</text>
  <text x="24" y="136" class="t-xs soft">寒い（氷期）</text>
