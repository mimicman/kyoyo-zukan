  <circle cx="328" cy="48" r="6" class="fl"/>
  <circle cx="322" cy="60" r="6" class="fl"/>
  <text x="290" y="26" class="t-s mid ink">タンパク質</text>

  <!-- 読み方の例 -->
  <path d="M14 180 H346" class="st-line" stroke-width="1"/>
