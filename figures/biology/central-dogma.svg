    <rect x="248" y="206" width="20" height="22" rx="3" class="st-f" stroke-width="1.5"/>
    <rect x="270" y="206" width="20" height="22" rx="3" class="st-f" stroke-width="1.5"/>
    <rect x="292" y="206" width="20" height="22" rx="3" class="st-f" stroke-width="1.5"/>
  <text x="58" y="222" class="t-s mid ink">A</text>
  <text x="80" y="222" class="t-s mid ink">U</text>
  <text x="102" y="222" class="t-s mid ink">G</text>
