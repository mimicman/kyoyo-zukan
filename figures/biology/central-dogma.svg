  <path d="M180 232 V244" class="st-soft" stroke-width="1.5" marker-end="url(#a-soft)"/>
  <path d="M280 232 V244" class="st-soft" stroke-width="1.5" marker-end="url(#a-soft)"/>
  <path d="M88 256 H172 M188 256 H272" class="st-f" stroke-width="2"/>
