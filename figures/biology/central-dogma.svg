<svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
  <!-- 核 -->
  <rect x="14" y="30" width="130" height="112" rx="18" class="tint"/>
  <rect x="14" y="30" width="130" height="112" rx="18" class="st-soft dash" stroke-width="1.5"/>
  <text x="26" y="48" class="t-xs soft">核</text>

  <!-- DNA（2本の鎖） -->
  <text x="79" y="56" class="t-s mid ink">DNA</text>
  <path d="M38 70 V82 M48 70 V82 M58 70 V82 M68 70 V82 M78 70 V82 M88 70 V82 M98 70 V82 M108 70 V82 M118 70 V82" class="st-soft" stroke-width="1.5"/>
  <path d="M32 68 H126 M32 84 H126" class="st" stroke-width="3" stroke-linecap="round"/>

  <!-- 転写 -->
  <path d="M79 90 V114" class="st-f" stroke-width="2" marker-end="url(#a-biology)"/>
  <text x="88" y="106" class="t-xs fl">転写</text>

  <!-- mRNA（核の外へ） -->
  <path d="M40 126 H300" class="st-f" stroke-width="3" stroke-linecap="round"/>
  <text x="152" y="118" class="t-xs fl">mRNA（写し）</text>

