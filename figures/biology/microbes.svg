  <!-- 微生物の働き -->
  <rect x="14" y="182" width="104" height="84" rx="10" class="tint"/>
  <rect x="128" y="182" width="104" height="84" rx="10" class="tint"/>
  <rect x="242" y="182" width="104" height="84" rx="10" class="tint"/>
  <text x="66" y="206" class="t-m mid fl">発酵</text>
  <text x="66" y="230" class="t-xs mid ink">ヨーグルト</text>
  <text x="66" y="246" class="t-xs mid ink">みそ・パン</text>
  <text x="180" y="206" class="t-m mid fl">分解</text>
  <text x="180" y="230" class="t-xs mid ink">落ち葉や死がいを</text>
  <text x="180" y="246" class="t-xs mid ink">土に戻す</text>
  <text x="294" y="206" class="t-m mid fl">酸素</text>
  <text x="294" y="230" class="t-xs mid ink">植物プランクトン</text>
