<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 時間の軸（上が古い。下の色の部分は拡大） -->
  <path d="M50 20 V150" class="st-soft" stroke-width="6" stroke-linecap="round"/>
  <path d="M42 152 L58 148 M42 160 L58 156" class="st-soft" stroke-width="1.5"/>
  <path d="M50 162 V262" class="st-f" stroke-width="6" stroke-linecap="round"/>
  <text x="40" y="24" class="t-xs end soft">昔</text>
  <text x="40" y="266" class="t-xs end soft">今</text>
  <text x="40" y="200" class="t-xs end fl">拡</text>
  <text x="40" y="214" class="t-xs end fl">大</text>
  <circle cx="50" cy="20" r="4" class="ink"/>
  <path d="M56 20 L80 26" class="st-line" stroke-width="1"/>
  <text x="142" y="30" class="t-xs end soft">46億年前</text>
  <text x="150" y="30" class="t-s ink">地球が生まれる</text>
  <circle cx="50" cy="39" r="4" class="ink"/>
  <path d="M56 39 L80 55" class="st-line" stroke-width="1"/>
  <text x="142" y="59" class="t-xs end soft">40億年前</text>
  <text x="150" y="59" class="t-s ink">最初の生命（海の中）</text>
  <circle cx="50" cy="81" r="4" class="ink"/>
  <path d="M56 81 L80 84" class="st-line" stroke-width="1"/>
  <text x="142" y="88" class="t-xs end soft">27億年前</text>
  <text x="150" y="88" class="t-s ink">光合成をする細菌が広がる</text>
  <circle cx="50" cy="103" r="4" class="ink"/>
  <path d="M56 103 L80 113" class="st-line" stroke-width="1"/>
  <text x="142" y="117" class="t-xs end soft">20億年前</text>
  <text x="150" y="117" class="t-s ink">核をもつ細胞（真核生物）</text>
  <circle cx="50" cy="150" r="4" class="fl"/>
  <path d="M56 150 L80 142" class="st-line" stroke-width="1"/>
  <text x="142" y="146" class="t-xs end soft">5.4億年前</text>
  <text x="150" y="146" class="t-m fl">カンブリア爆発</text>
  <circle cx="50" cy="175" r="4" class="fl"/>
  <path d="M56 175 L80 171" class="st-line" stroke-width="1"/>
  <text x="142" y="175" class="t-xs end soft">4.7億年前</text>
  <text x="150" y="175" class="t-s ink">植物が陸に上がる</text>
  <circle cx="50" cy="219" r="4" class="fl"/>
  <path d="M56 219 L80 200" class="st-line" stroke-width="1"/>
  <text x="142" y="204" class="t-xs end soft">2.3億年前</text>
  <text x="150" y="204" class="t-s ink">恐竜が現れる</text>
  <circle cx="50" cy="250" r="4" class="fl"/>
  <path d="M56 250 L80 229" class="st-line" stroke-width="1"/>
  <text x="142" y="233" class="t-xs end soft">6600万年前</text>
  <text x="150" y="233" class="t-s ink">恐竜が絶滅、哺乳類が広がる</text>
  <circle cx="50" cy="262" r="4" class="fl"/>
  <path d="M56 262 L80 258" class="st-line" stroke-width="1"/>
  <text x="142" y="262" class="t-xs end soft">30万年前</text>
  <text x="150" y="262" class="t-s ink">ホモ・サピエンス</text>
</svg>
