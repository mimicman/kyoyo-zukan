<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- エネルギーの流れ -->
  <text x="14" y="28" class="t-xs soft">食べて</text>
  <text x="14" y="42" class="t-xs soft">上へ渡す</text>
  <path d="M28 208 V56" class="st-f" stroke-width="2.5" marker-end="url(#a-biology)"/>

  <!-- ピラミッド（下ほど数が多い） -->
  <path d="M40 220 L65 180 H235 L260 220 Z" class="tint"/>
  <path d="M65 180 L90 140 H210 L235 180 Z" class="tint" opacity="0.75"/>
  <path d="M90 140 L115 100 H185 L210 140 Z" class="fl" opacity="0.55"/>
  <path d="M115 100 L138 63 H162 L185 100 Z" class="fl"/>
  <path d="M40 220 L138 63 H162 L260 220 Z M65 180 H235 M90 140 H210 M115 100 H185" class="st-f" stroke-width="1.5"/>
  <text x="150" y="205" class="t-s mid ink">生産者（植物）</text>
  <text x="150" y="165" class="t-s mid ink">草食動物</text>
  <text x="150" y="125" class="t-s mid ink">肉食動物</text>
  <text x="150" y="88" class="t-xs mid on">上位</text>

  <!-- 具体例 -->
  <text x="194" y="84" class="t-xs soft">タカ</text>
  <text x="208" y="124" class="t-xs soft">カエル・小鳥</text>
  <text x="232" y="164" class="t-xs soft">バッタ・ウサギ</text>
  <text x="256" y="204" class="t-xs soft">草・木</text>

  <!-- 分解者 -->
  <rect x="60" y="236" width="180" height="28" rx="14" class="paper"/>
  <rect x="60" y="236" width="180" height="28" rx="14" class="st-soft dash" stroke-width="1.5"/>
  <text x="150" y="255" class="t-s mid ink">分解者（キノコ・細菌）</text>
  <path d="M300 230 Q292 250 246 250" class="st-soft" stroke-width="2" marker-end="url(#a-soft)"/>
  <text x="350" y="222" class="t-xs end soft">死がい・ふん</text>
  <path d="M58 250 Q36 250 42 226" class="st-f" stroke-width="2" marker-end="url(#a-biology)"/>
  <text x="14" y="274" class="t-xs fl">土の養分を植物へ</text>

  <text x="346" y="40" class="t-xs end soft">上の段ほど</text>
  <text x="346" y="54" class="t-xs end soft">数が少ない</text>
</svg>
