<svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <!-- インドと仏教：輪廻の考え → ブッダの四諦 → 中国・日本へ伝わり禅になる。左から右へ西から東 -->
  <text x="16" y="22" class="t-m ink">インドで生まれ、北と南の道で広がった</text>

  <!-- 地域の帯 -->
  <rect x="12" y="38" width="128" height="160" rx="12" class="tint"/>
  <rect x="148" y="38" width="96" height="160" rx="12" class="bgc st-soft" stroke-width="1"/>
  <rect x="252" y="38" width="96" height="160" rx="12" class="bgc st-soft" stroke-width="1"/>
  <text x="76" y="58" class="t-s mid fl" font-weight="700">インド</text>
  <text x="196" y="58" class="t-s mid ink" font-weight="700">中国</text>
  <text x="300" y="58" class="t-s mid ink" font-weight="700">日本</text>

  <!-- インド：輪廻の輪と、そこから抜ける道 -->
  <circle cx="44" cy="112" r="24" class="st-f" stroke-width="3" fill="none"/>
  <path d="M64 99 L68 92 M24 125 L20 132" class="st-f" stroke-width="3" stroke-linecap="round"/>
  <text x="44" y="116" class="t-xs mid ink">輪廻</text>
  <path d="M62 94 C78 78 92 78 100 84" class="st-f" stroke-width="2" marker-end="url(#a-religion)"/>
  <text x="44" y="154" class="t-xs mid soft">生まれ変わり</text>
  <text x="44" y="168" class="t-xs mid soft">続く苦しみ</text>
  <circle cx="108" cy="112" r="20" class="fl"/>
  <text x="108" y="116" class="t-xs mid on" font-weight="700">四諦</text>
  <text x="108" y="154" class="t-xs mid fl">ブッダ</text>
  <text x="108" y="168" class="t-xs mid soft">苦をなくす</text>

  <!-- 伝わる道 -->
  <path d="M130 112 H178" class="st-f dash" stroke-width="2" marker-end="url(#a-religion)"/>
  <path d="M222 112 H272" class="st-f dash" stroke-width="2" marker-end="url(#a-religion)"/>

  <!-- 中国：禅が育つ -->
  <circle cx="200" cy="112" r="20" class="paper st-f" stroke-width="2"/>
  <text x="200" y="116" class="t-xs mid ink" font-weight="700">禅</text>
  <text x="196" y="154" class="t-xs mid soft">達磨が伝えた</text>
  <text x="196" y="168" class="t-xs mid soft">とされる</text>

  <!-- 日本：臨済宗・曹洞宗 -->
  <circle cx="300" cy="112" r="20" class="fl"/>
  <text x="300" y="116" class="t-xs mid on" font-weight="700">禅宗</text>
  <text x="300" y="154" class="t-xs mid soft">臨済宗・曹洞宗</text>
  <text x="300" y="168" class="t-xs mid soft">茶の湯・庭へ</text>

  <!-- 時代 -->
  <path d="M16 214 H344" class="st-line" stroke-width="1.5"/>
  <g class="t-xs mid soft">
    <text x="44" y="232">古代</text>
    <text x="108" y="232">前5世紀ごろ</text>
    <text x="200" y="232">6世紀〜</text>
    <text x="300" y="232">鎌倉時代</text>
  </g>

  <!-- 北の道の名前 -->
  <text x="154" y="102" class="t-xs mid fl halo" font-weight="700">大乗</text>
  <!-- 南の道 -->
  <path d="M22 196 V240 Q22 254 30 254" class="st-soft dash" stroke-width="2.5" fill="none" marker-end="url(#a-soft)"/>
  <rect x="34" y="240" width="310" height="28" rx="10" class="tint"/>
  <text x="46" y="259" class="t-s ink"><tspan class="fl" font-weight="700">南の道：上座部</tspan>　スリランカ・東南アジアへ</text>
  <rect x="16" y="280" width="328" height="28" rx="10" class="bgc st-soft" stroke-width="1"/>
  <text x="180" y="299" class="t-s mid ink">輪から抜ける → 苦をなくす → 坐って悟る</text>
</svg>
