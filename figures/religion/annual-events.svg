<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 年中行事：横は1〜12月。上の段が神道、真ん中が仏教、下が外から来た行事。1年の中で交互に現れる -->
  <text x="16" y="22" class="t-m ink">1年の行事に、3つの流れが混ざる</text>

  <!-- 月の目盛り（1マス26px） -->
  <g class="st-line" stroke-width="1">
    <path d="M24 44 V254 M50 44 V254 M76 44 V254 M102 44 V254 M128 44 V254 M154 44 V254 M180 44 V254 M206 44 V254 M232 44 V254 M258 44 V254 M284 44 V254 M310 44 V254 M336 44 V254" class="dash"/>
  </g>
  <g class="t-xs mid soft">
    <text x="37" y="40">1</text><text x="63" y="40">2</text><text x="89" y="40">3</text><text x="115" y="40">4</text>
    <text x="141" y="40">5</text><text x="167" y="40">6</text><text x="193" y="40">7</text><text x="219" y="40">8</text>
    <text x="245" y="40">9</text><text x="271" y="40">10</text><text x="297" y="40">11</text><text x="323" y="40">12</text>
  </g>
  <text x="348" y="40" class="t-xs end soft">月</text>

  <!-- 神道の段 -->
  <rect x="20" y="52" width="320" height="64" rx="10" class="tint"/>
  <text x="28" y="68" class="t-xs fl" font-weight="700">神社・神道</text>
  <g class="fl">
    <circle cx="37" cy="84" r="6"/><circle cx="63" cy="84" r="6"/><circle cx="167" cy="84" r="6"/>
    <circle cx="271" cy="84" r="6"/><circle cx="297" cy="84" r="6"/>
  </g>
  <g class="t-xs mid ink">
    <text x="40" y="106">初詣</text><text x="74" y="106">節分</text><text x="167" y="106">夏越の祓</text>
    <text x="262" y="106">秋祭り</text><text x="310" y="106">七五三</text>
  </g>

  <!-- 仏教の段 -->
  <rect x="20" y="124" width="320" height="64" rx="10" class="bgc st-f" stroke-width="1"/>
  <text x="28" y="140" class="t-xs fl" font-weight="700">寺・仏教・先祖</text>
  <g class="paper st-f" stroke-width="2.5">
    <circle cx="89" cy="156" r="6"/><circle cx="115" cy="156" r="6"/><circle cx="219" cy="156" r="6"/>
    <circle cx="245" cy="156" r="6"/><circle cx="323" cy="156" r="6"/>
  </g>
  <g class="t-xs mid ink">
    <text x="84" y="178">彼岸</text><text x="128" y="178">花まつり</text><text x="219" y="178">お盆</text>
    <text x="250" y="178">彼岸</text><text x="336" y="178" class="end">除夜の鐘</text>
  </g>

  <!-- 外から来た行事 -->
  <rect x="20" y="196" width="320" height="58" rx="10" class="bgc"/>
  <text x="28" y="212" class="t-xs soft" font-weight="700">外から来た行事</text>
  <g class="soft">
    <circle cx="63" cy="226" r="6"/><circle cx="271" cy="226" r="6"/><circle cx="323" cy="226" r="6"/>
  </g>
  <g class="t-xs mid ink">
    <text x="72" y="246">バレンタイン</text><text x="258" y="246">ハロウィン</text>
  </g>
  <text x="338" y="246" class="t-xs end ink">クリスマス</text>

  <text x="180" y="274" class="t-xs mid soft">一つの家で全部を行うことも多い。暮らしの節目として続く</text>
</svg>
