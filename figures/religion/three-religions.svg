<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 簡略地図（西→東）。位置はおおよそ -->
  <rect x="10" y="10" width="340" height="160" rx="18" class="bgc"/>
  <text x="20" y="30" class="t-xs soft">ヨーロッパ</text>
  <text x="20" y="160" class="t-xs soft">北アフリカ</text>
  <text x="220" y="46" class="t-xs soft">中央アジア</text>
  <text x="344" y="38" class="t-xs end soft">東アジア</text>
  <text x="344" y="162" class="t-xs end soft">東南アジア</text>

  <!-- 広がり -->
  <path d="M112 58 C96 44 80 40 62 40" class="st-f dash" stroke-width="2" marker-end="url(#a-religion)"/>
  <path d="M138 122 C112 128 88 136 66 140" class="st-f dash" stroke-width="2" marker-end="url(#a-religion)"/>
  <path d="M164 108 C180 84 194 64 212 52" class="st-f dash" stroke-width="2" marker-end="url(#a-religion)"/>
  <path d="M254 90 C276 68 296 58 318 52" class="st-f dash" stroke-width="2" marker-end="url(#a-religion)"/>
  <path d="M254 112 C270 138 288 148 310 148" class="st-f dash" stroke-width="2" marker-end="url(#a-religion)"/>

  <!-- キリスト教：十字 -->
  <path d="M120 54 V82 M110 64 H130" class="st-f" stroke-width="4" stroke-linecap="round"/>
  <text x="104" y="86" class="t-s end ink">キリスト教</text>
  <text x="104" y="100" class="t-xs end soft">パレスチナ</text>

  <!-- イスラム教：三日月 -->
  <circle cx="152" cy="118" r="12" class="fl"/>
  <circle cx="157" cy="115" r="10" class="bgc"/>
  <text x="152" y="146" class="t-s mid ink">イスラム教</text>
  <text x="152" y="160" class="t-xs mid soft">アラビア半島</text>

  <!-- 仏教：法輪 -->
  <circle cx="240" cy="102" r="12" class="st-f" stroke-width="2.5"/>
  <path d="M240 90 V114 M228 102 H252 M231.5 93.5 L248.5 110.5 M248.5 93.5 L231.5 110.5" class="st-f" stroke-width="1.5"/>
  <circle cx="240" cy="102" r="3" class="fl"/>
  <text x="240" y="134" class="t-s mid ink">仏教</text>
  <text x="240" y="148" class="t-xs mid soft">インド</text>

  <!-- 生まれた時期 -->
  <rect x="72" y="196" width="272" height="9" rx="4.5" class="fl"/>
  <rect x="175" y="212" width="169" height="9" rx="4.5" class="fl" opacity="0.7"/>
  <rect x="300" y="228" width="44" height="9" rx="4.5" class="fl" opacity="0.45"/>
  <text x="66" y="204" class="t-xs end ink">仏教</text>
  <text x="169" y="220" class="t-xs end ink">キリスト教</text>
  <text x="294" y="236" class="t-xs end ink">イスラム教</text>
  <path d="M16 250 H344" class="st-soft" stroke-width="1.5"/>
  <path d="M72 246 V254 M175 246 V254 M300 246 V254" class="st-soft" stroke-width="1.5"/>
  <text x="72" y="268" class="t-xs mid soft">前5世紀ごろ</text>
  <text x="175" y="268" class="t-xs mid soft">1世紀</text>
  <text x="300" y="268" class="t-xs mid soft">7世紀</text>
  <text x="344" y="268" class="t-xs end soft">今</text>
</svg>
