<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 聖と俗：日常（俗）から、門を境に特別な場（聖）が区切られる -->
  <text x="16" y="22" class="t-m ink">門の向こうは、ふだんと違う場所</text>

  <!-- 俗：ふだんの暮らし -->
  <rect x="12" y="36" width="150" height="160" rx="12" class="bgc"/>
  <text x="87" y="56" class="t-s mid ink" font-weight="700">俗（ふだん）</text>
  <!-- 家と店 -->
  <path d="M30 108 L50 90 L70 108 Z" class="soft"/><rect x="35" y="108" width="30" height="24" class="soft"/>
  <path d="M86 132 V100 H130 V132" class="st-soft" stroke-width="2" fill="none"/>
  <path d="M82 100 H134 L128 90 H88 Z" class="soft"/>
  <text x="50" y="150" class="t-xs mid soft">家</text>
  <text x="108" y="150" class="t-xs mid soft">店・仕事</text>
  <text x="87" y="176" class="t-xs mid soft">にぎやか・日常の時間</text>

  <!-- 境目の門 -->
  <path d="M170 76 H214 M174 86 H210" class="st-f" stroke-width="5" stroke-linecap="round"/>
  <path d="M178 86 V196 M206 86 V196" class="st-f" stroke-width="5" stroke-linecap="round"/>
  <text x="192" y="212" class="t-xs mid fl" font-weight="700">境目</text>

  <!-- 聖：特別な場 -->
  <rect x="222" y="36" width="126" height="160" rx="12" class="tint st-f" stroke-width="1.5"/>
  <text x="285" y="56" class="t-s mid fl" font-weight="700">聖（特別）</text>
  <path d="M255 120 L285 96 L315 120 Z" class="fl"/>
  <rect x="262" y="120" width="46" height="32" class="fl"/>
  <circle cx="285" cy="80" r="7" class="st-f" stroke-width="2" fill="none"/>
  <text x="285" y="174" class="t-xs mid ink">神殿・祭壇</text>
  <text x="285" y="188" class="t-xs mid soft">静か・祈りの時間</text>

  <!-- 境目でふるまいを切り替える -->
  <path d="M130 70 Q192 44 252 70" class="st dash" stroke-width="1.5" fill="none" marker-end="url(#a-ink)"/>
  <text x="192" y="42" class="t-xs mid ink halo">清めてから入る</text>

  <!-- 例 -->
  <rect x="12" y="226" width="336" height="44" rx="10" class="bgc st-soft" stroke-width="1"/>
  <text x="180" y="244" class="t-xs mid ink">神社の鳥居・寺の山門・教会の扉・モスクで靴を脱ぐ</text>
  <text x="180" y="261" class="t-xs mid soft">聖なる場所・時・物を、日常から区切って守る</text>
</svg>
