<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 漢字のなりたち：象形（形を描く）・指事（印で示す）・会意（意味を合わせる）・形声（意味の部品＋音の部品） -->
  <rect x="12" y="10" width="164" height="126" rx="10" class="bgc"/>
  <rect x="184" y="10" width="164" height="126" rx="10" class="bgc"/>
  <rect x="12" y="144" width="164" height="126" rx="10" class="bgc"/>
  <rect x="184" y="144" width="164" height="126" rx="10" class="tint"/>

  <!-- 象形 -->
  <text x="24" y="32" class="t-s ink" font-weight="700">象形</text>
  <text x="58" y="32" class="t-xs soft">物の形を描く</text>
  <path d="M26 96 L40 66 L50 84 L62 52 L74 84 L84 70 L96 96" class="st-soft" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M102 76 H118" class="st-f" stroke-width="2" marker-end="url(#a-language)"/>
  <text x="146" y="92" class="t-xl mid ink">山</text>
  <text x="94" y="124" class="t-xs mid soft">ほかに 木・川・日・月</text>

  <!-- 指事 -->
  <text x="196" y="32" class="t-s ink" font-weight="700">指事</text>
  <text x="230" y="32" class="t-xs soft">印で場所を示す</text>
  <text x="222" y="92" class="t-xl mid ink">木</text>
  <path d="M212 99 H232" class="st-f" stroke-width="3"/>
  <text x="222" y="114" class="t-xs mid fl">根もとに印</text>
  <path d="M254 76 H270" class="st-f" stroke-width="2" marker-end="url(#a-language)"/>
  <text x="304" y="92" class="t-xl mid ink">本</text>
  <text x="304" y="114" class="t-xs mid soft">もと</text>

  <!-- 会意 -->
  <text x="24" y="166" class="t-s ink" font-weight="700">会意</text>
  <text x="58" y="166" class="t-xs soft">意味を組み合わせる</text>
  <text x="40" y="208" class="t-l mid ink">人</text>
  <text x="62" y="208" class="t-s mid soft">＋</text>
  <text x="84" y="208" class="t-l mid ink">木</text>
  <text x="108" y="208" class="t-s mid soft">＝</text>
  <text x="140" y="210" class="t-xl mid fl">休</text>
  <text x="94" y="248" class="t-xs mid soft">人が木かげで休む</text>

  <!-- 形声 -->
  <text x="196" y="166" class="t-s ink" font-weight="700">形声</text>
  <text x="230" y="166" class="t-xs soft">意味＋音の部品</text>
  <text x="214" y="208" class="t-l mid ink">氵</text>
  <text x="238" y="208" class="t-s mid soft">＋</text>
  <text x="264" y="208" class="t-l mid ink">青</text>
  <text x="290" y="208" class="t-s mid soft">＝</text>
  <text x="322" y="210" class="t-xl mid fl">清</text>
  <text x="214" y="228" class="t-xs mid ink">水の意味</text>
  <text x="264" y="228" class="t-xs mid ink">音セイ</text>
  <text x="266" y="256" class="t-xs mid fl" font-weight="700">漢字の大部分はこのタイプ</text>
</svg>
