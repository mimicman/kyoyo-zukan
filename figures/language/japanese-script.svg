<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 漢字が伝わる -->
  <rect x="100" y="8" width="160" height="28" rx="8" class="bgc"/>
  <text x="180" y="27" class="t-s mid ink" font-weight="700">漢字が中国から伝わる</text>
  <path d="M180 36 V48" class="st" stroke-width="2" marker-end="url(#a-ink)"/>

  <!-- 万葉仮名 -->
  <rect x="50" y="52" width="260" height="42" rx="10" class="fl"/>
  <text x="180" y="70" class="t-m mid on">万葉仮名</text>
  <text x="180" y="86" class="t-xs mid on">漢字の音だけ借りて日本語を書く（安＝あ）</text>
  <path d="M130 94 L95 110 M230 94 L265 110" class="st-f" stroke-width="2.5"/>

  <!-- 2つの列 -->
  <path d="M180 112 V258" class="st-line dash" stroke-width="1.5"/>
  <text x="95" y="128" class="t-m mid fl">ひらがな</text>
  <text x="95" y="143" class="t-xs mid soft">字全体をくずす</text>
  <text x="265" y="128" class="t-m mid fl">カタカナ</text>
  <text x="265" y="143" class="t-xs mid soft">字の一部を取る</text>

  <!-- ひらがな：安→あ 以→い 加→か -->
  <g class="t-l mid ink">
    <text x="60" y="176">安</text><text x="60" y="206">以</text><text x="60" y="236">加</text>
  </g>
  <g class="st-soft" stroke-width="1.5">
    <path d="M76 170 H108" marker-end="url(#a-soft)"/><path d="M76 200 H108" marker-end="url(#a-soft)"/><path d="M76 230 H108" marker-end="url(#a-soft)"/>
  </g>
  <g class="t-l mid fl">
    <text x="128" y="176">あ</text><text x="128" y="206">い</text><text x="128" y="236">か</text>
  </g>

  <!-- カタカナ：阿→阝→ア 伊→亻→イ 加→力→カ -->
  <g class="t-l mid ink">
    <text x="210" y="176">阿</text><text x="210" y="206">伊</text><text x="210" y="236">加</text>
  </g>
  <g class="t-l mid soft">
    <text x="260" y="176">阝</text><text x="260" y="206">亻</text><text x="260" y="236">力</text>
  </g>
  <g class="st-soft" stroke-width="1.5">
    <path d="M224 170 H244" marker-end="url(#a-soft)"/><path d="M224 200 H244" marker-end="url(#a-soft)"/><path d="M224 230 H244" marker-end="url(#a-soft)"/>
    <path d="M274 170 H294" marker-end="url(#a-soft)"/><path d="M274 200 H294" marker-end="url(#a-soft)"/><path d="M274 230 H294" marker-end="url(#a-soft)"/>
  </g>
  <g class="t-l mid fl">
    <text x="312" y="176">ア</text><text x="312" y="206">イ</text><text x="312" y="236">カ</text>
  </g>

  <!-- 使われた場面 -->
  <text x="95" y="266" class="t-xs mid ink">和歌・手紙・物語に</text>
  <text x="265" y="266" class="t-xs mid ink">お経や漢文の読みの書き込みに</text>
</svg>
