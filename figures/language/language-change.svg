<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 音の変化 -->
  <rect x="8" y="8" width="344" height="124" rx="12" class="bgc"/>
  <text x="20" y="28" class="t-s fl" font-weight="700">音の変化</text>
  <text x="340" y="28" class="t-xs end soft">「花」の発音</text>
  <circle cx="64" cy="72" r="28" class="paper st-soft" stroke-width="1.5"/>
  <circle cx="180" cy="72" r="28" class="tint st-f" stroke-width="1.5"/>
  <circle cx="296" cy="72" r="28" class="fl"/>
  <text x="64" y="77" class="t-m mid ink">パナ</text>
  <text x="180" y="77" class="t-m mid ink">ファナ</text>
  <text x="296" y="77" class="t-m mid on">ハナ</text>
  <g class="st-f" stroke-width="2.5">
    <path d="M96 72 H144" marker-end="url(#a-language)"/><path d="M212 72 H260" marker-end="url(#a-language)"/>
  </g>
  <g class="t-xs mid soft">
    <text x="64" y="118">古く（推定）</text><text x="180" y="118">平安ごろ〜</text><text x="296" y="118">江戸ごろ〜</text>
  </g>

  <!-- 意味の変化 -->
  <rect x="8" y="144" width="344" height="128" rx="12" class="bgc"/>
  <text x="20" y="164" class="t-s fl" font-weight="700">意味の変化</text>
  <text x="20" y="200" class="t-m ink">やばい</text>
  <rect x="90" y="180" width="100" height="30" rx="8" class="paper st-soft" stroke-width="1.5"/>
  <text x="140" y="200" class="t-s mid ink">危ない</text>
  <path d="M196 195 H226" class="st-f" stroke-width="2.5" marker-end="url(#a-language)"/>
  <rect x="234" y="180" width="108" height="30" rx="8" class="fl"/>
  <text x="288" y="200" class="t-s mid on" font-weight="700">すごい</text>

  <text x="20" y="246" class="t-m ink">をかし</text>
  <rect x="90" y="226" width="100" height="30" rx="8" class="paper st-soft" stroke-width="1.5"/>
  <text x="140" y="246" class="t-s mid ink">趣がある</text>
  <path d="M196 241 H226" class="st-f" stroke-width="2.5" marker-end="url(#a-language)"/>
  <rect x="234" y="226" width="108" height="30" rx="8" class="fl"/>
  <text x="288" y="246" class="t-s mid on" font-weight="700">こっけいだ</text>
</svg>
