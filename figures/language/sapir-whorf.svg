<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <text x="14" y="20" class="t-xs soft">緑から青へ少しずつ変わる色の帯を、言語ごとに区切ると</text>
  <!-- 色の帯（濃さで緑→青を表す） -->
  <g class="fl">
    <rect x="96" y="28" width="25" height="16" opacity="0.1"/><rect x="121" y="28" width="25" height="16" opacity="0.2"/>
    <rect x="146" y="28" width="25" height="16" opacity="0.3"/><rect x="171" y="28" width="25" height="16" opacity="0.4"/>
    <rect x="196" y="28" width="25" height="16" opacity="0.5"/><rect x="221" y="28" width="25" height="16" opacity="0.6"/>
    <rect x="246" y="28" width="25" height="16" opacity="0.7"/><rect x="271" y="28" width="25" height="16" opacity="0.8"/>
    <rect x="296" y="28" width="25" height="16" opacity="0.9"/><rect x="321" y="28" width="25" height="16"/>
  </g>
  <text x="90" y="40" class="t-xs end soft">緑っぽい</text>
  <text x="346" y="58" class="t-xs end soft">青っぽい</text>

  <!-- 区切り方 -->
  <text x="14" y="83" class="t-xs ink" font-weight="700">いまの日本語</text>
  <rect x="96" y="66" width="125" height="26" rx="5" class="paper st-soft" stroke-width="1.5"/>
  <rect x="221" y="66" width="125" height="26" rx="5" class="paper st-soft" stroke-width="1.5"/>
  <text x="158" y="84" class="t-s mid ink">緑</text><text x="283" y="84" class="t-s mid ink">青</text>

  <text x="14" y="117" class="t-xs ink" font-weight="700">ロシア語</text>
  <rect x="96" y="100" width="100" height="26" rx="5" class="paper st-soft" stroke-width="1.5"/>
  <rect x="196" y="100" width="75" height="26" rx="5" class="tint st-f" stroke-width="1.5"/>
  <rect x="271" y="100" width="75" height="26" rx="5" class="tint st-f" stroke-width="1.5"/>
  <text x="146" y="118" class="t-s mid ink">緑</text>
  <text x="233" y="118" class="t-xs mid ink">水色の語</text><text x="308" y="118" class="t-xs mid ink">濃い青の語</text>

  <text x="14" y="151" class="t-xs ink" font-weight="700">昔の日本語</text>
  <rect x="96" y="134" width="250" height="26" rx="5" class="fl"/>
  <text x="221" y="152" class="t-s mid on" font-weight="700">あお（緑も青も）</text>

  <!-- 2つの説 -->
  <text x="180" y="186" class="t-s mid ink" font-weight="700">サピア＝ウォーフ仮説</text>
  <rect x="14" y="196" width="162" height="76" rx="12" class="bgc"/>
  <text x="95" y="218" class="t-s mid ink" font-weight="700">強い説</text>
  <text x="95" y="238" class="t-xs mid ink">ことばが考えを決める</text>
  <text x="95" y="258" class="t-xs mid soft">→ 支持は少ない</text>
  <rect x="184" y="196" width="162" height="76" rx="12" class="tint"/>
  <text x="265" y="218" class="t-s mid fl" font-weight="700">弱い説</text>
  <text x="265" y="238" class="t-xs mid ink">ことばが考えに影響する</text>
  <text x="265" y="258" class="t-xs mid fl" font-weight="700">→ 色・方角などで研究中</text>
</svg>
