<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 4つの層（やる気・感情・欲求・無意識）が、それぞれ行動を動かす -->
  <text x="12" y="24" class="t-m ink">見えない力から、行動が生まれる</text>

  <rect x="12" y="36" width="216" height="48" rx="10" class="tint st-f" stroke-width="1.5"/>
  <text x="24" y="56" class="t-s ink" font-weight="700">やる気（動機づけ）</text>
  <text x="24" y="74" class="t-xs soft">楽しいから？ ごほうびのため？</text>

  <rect x="12" y="90" width="216" height="48" rx="10" class="tint st-f" stroke-width="1"/>
  <text x="24" y="110" class="t-s ink" font-weight="700">感情</text>
  <text x="24" y="128" class="t-xs soft">体の高ぶり＋状況の解釈</text>

  <rect x="12" y="144" width="216" height="48" rx="10" class="tint"/>
  <text x="24" y="164" class="t-s ink" font-weight="700">欲求の階層</text>
  <text x="24" y="182" class="t-xs soft">生理→安全→所属→承認→自己実現</text>

  <path d="M8 200 H232" class="st-soft dash" stroke-width="1.2"/>
  <text x="232" y="212" class="t-xs end soft">ここから下は気づけない</text>

  <rect x="12" y="218" width="216" height="54" rx="10" class="fl"/>
  <text x="24" y="238" class="t-s on" font-weight="700">無意識</text>
  <text x="24" y="258" class="t-xs on">気づかない欲求や記憶が表れるとした</text>

  <rect x="272" y="120" width="76" height="64" rx="12" class="fl"/>
  <text x="310" y="150" class="t-l mid on">行動</text>
  <text x="310" y="170" class="t-xs mid on">選ぶ・続ける</text>
  <path d="M232 60 Q262 70 276 116" class="st-f" stroke-width="2" marker-end="url(#a-psychology)"/>
  <path d="M232 114 Q254 118 266 132" class="st-f" stroke-width="2" marker-end="url(#a-psychology)"/>
  <path d="M232 168 Q254 166 266 160" class="st-f" stroke-width="2" marker-end="url(#a-psychology)"/>
  <path d="M232 244 Q266 236 286 190" class="st-f" stroke-width="2" marker-end="url(#a-psychology)"/>
  <text x="310" y="216" class="t-xs mid soft">理由は</text>
  <text x="310" y="230" class="t-xs mid soft">重なりあう</text>
</svg>
