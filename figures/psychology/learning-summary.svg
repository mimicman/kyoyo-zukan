<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 上：経験による学習（条件反射とオペラント）、下：愛着を土台に年齢とともに上がる発達の階段 -->
  <text x="12" y="24" class="t-m ink">経験で学び、年齢とともに育つ</text>

  <rect x="12" y="36" width="164" height="76" rx="12" class="tint"/>
  <text x="24" y="56" class="t-s ink" font-weight="700">条件反射</text>
  <rect x="24" y="70" width="36" height="24" rx="6" class="bgc"/>
  <text x="42" y="87" class="t-xs mid ink">ベル</text>
  <text x="68" y="87" class="t-xs mid ink">＋</text>
  <rect x="76" y="70" width="36" height="24" rx="6" class="bgc"/>
  <text x="94" y="87" class="t-xs mid ink">エサ</text>
  <path d="M116 82 H130" class="st-f" stroke-width="2" marker-end="url(#a-psychology)"/>
  <text x="152" y="87" class="t-xs mid fl" font-weight="700">よだれ</text>
  <text x="94" y="106" class="t-xs mid soft">くり返すと結びつく</text>

  <rect x="184" y="36" width="164" height="76" rx="12" class="tint"/>
  <text x="196" y="56" class="t-s ink" font-weight="700">オペラント</text>
  <rect x="196" y="70" width="40" height="24" rx="6" class="bgc"/>
  <text x="216" y="87" class="t-xs mid ink">行動</text>
  <path d="M240 82 H252" class="st-f" stroke-width="2" marker-end="url(#a-psychology)"/>
  <rect x="256" y="70" width="44" height="24" rx="6" class="fl"/>
  <text x="278" y="87" class="t-xs mid on">ほうび</text>
  <path d="M304 82 H316" class="st-f" stroke-width="2" marker-end="url(#a-psychology)"/>
  <text x="332" y="87" class="t-xs mid fl" font-weight="700">増</text>
  <text x="266" y="106" class="t-xs mid soft">結果で行動が変わる</text>

  <!-- 学習はどの年齢でも -->
  <path d="M140 114 V188" class="st-soft dash" stroke-width="1.5" marker-end="url(#a-soft)"/>
  <path d="M220 114 V164" class="st-soft dash" stroke-width="1.5" marker-end="url(#a-soft)"/>
  <path d="M300 114 V140" class="st-soft dash" stroke-width="1.5" marker-end="url(#a-soft)"/>
  <text x="180" y="132" class="t-xs mid soft">どの年齢でも</text>
  <text x="180" y="146" class="t-xs mid soft">経験から学ぶ</text>

  <!-- 愛着：安心の土台 -->
  <rect x="20" y="134" width="80" height="78" rx="10" class="bgc st-f" stroke-width="1.2"/>
  <circle cx="48" cy="160" r="9" class="fl"/>
  <circle cx="70" cy="166" r="6" class="ink"/>
  <path d="M40 176 Q60 190 80 176" class="st-f" stroke-width="2" fill="none"/>
  <text x="60" y="194" class="t-xs mid ink" font-weight="700">愛着</text>
  <text x="60" y="207" class="t-xs mid soft">安心の土台</text>

  <!-- 発達の階段 -->
  <rect x="20" y="220" width="80" height="36" class="tint st-f" stroke-width="1.2"/>
  <rect x="100" y="196" width="80" height="60" class="tint st-f" stroke-width="1.2"/>
  <rect x="180" y="172" width="80" height="84" class="tint st-f" stroke-width="1.2"/>
  <rect x="260" y="148" width="80" height="108" class="fl"/>
  <text x="60" y="235" class="t-xs mid ink" font-weight="700">0〜2歳</text>
  <text x="60" y="250" class="t-xs mid soft">体で知る</text>
  <text x="140" y="212" class="t-xs mid ink" font-weight="700">2〜7歳</text>
  <text x="140" y="227" class="t-xs mid soft">言葉で考える</text>
  <text x="220" y="188" class="t-xs mid ink" font-weight="700">7〜11歳</text>
  <text x="220" y="203" class="t-xs mid soft">筋道を立てる</text>
  <text x="300" y="164" class="t-xs mid on" font-weight="700">11歳〜</text>
  <text x="300" y="179" class="t-xs mid on">仮の話も考える</text>
  <path d="M20 262 H336" class="st" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <text x="20" y="276" class="t-xs soft">年齢とともに考え方が段階的に変わる（子どもの発達）</text>
</svg>
