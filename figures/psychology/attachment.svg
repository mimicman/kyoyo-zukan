<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 愛着：安全基地の大人から子どもが探索に出て、不安になると戻る。下はハーロウの子ザルの実験 -->
  <text x="16" y="22" class="t-m ink">戻れる場所があるから、外へ出られる</text>

  <!-- 安全基地 -->
  <circle cx="62" cy="96" r="40" class="fl"/>
  <circle cx="62" cy="80" r="10" class="on"/>
  <path d="M44 112 Q62 90 80 112 Z" class="on"/>
  <text x="62" y="128" class="t-xs mid on" font-weight="700">安全基地</text>
  <text x="62" y="152" class="t-xs mid soft">親など身近な大人</text>

  <!-- 探索の道と戻る道 -->
  <path d="M100 82 Q170 40 236 62" class="st-f" stroke-width="2.5" fill="none" marker-end="url(#a-psychology)"/>
  <text x="168" y="50" class="t-xs mid fl" font-weight="700">離れて遊ぶ（探索）</text>
  <path d="M236 116 Q170 140 104 112" class="st-soft dash" stroke-width="2.5" fill="none" marker-end="url(#a-soft)"/>
  <text x="168" y="148" class="t-xs mid soft">不安になると戻る</text>

  <!-- 子どもとおもちゃ -->
  <circle cx="262" cy="80" r="8" class="ink"/>
  <rect x="255" y="90" width="14" height="22" rx="5" class="ink"/>
  <rect x="290" y="96" width="18" height="18" rx="3" class="tint st-f" stroke-width="1.5"/>
  <circle cx="324" cy="106" r="8" class="st-f" stroke-width="2" fill="none"/>
  <text x="290" y="134" class="t-xs mid ink">子どもと外の世界</text>
  <text x="168" y="92" class="t-xs mid ink">ときどき振り返る</text>

  <!-- ハーロウの実験 -->
  <rect x="12" y="166" width="336" height="104" rx="12" class="bgc"/>
  <text x="24" y="186" class="t-xs soft">ハーロウの子ザルの実験</text>
  <!-- 針金の人形 -->
  <g class="st" stroke-width="1.5" fill="none">
    <circle cx="80" cy="206" r="10"/>
    <path d="M80 216 V256 M68 222 V252 M92 222 V252 M68 222 H92 M68 236 H92 M68 252 H92"/>
  </g>
  <rect x="94" y="226" width="10" height="16" rx="3" class="paper st" stroke-width="1.2"/>
  <text x="80" y="266" class="t-xs mid soft">針金＋ミルク</text>
  <!-- 布の人形 -->
  <circle cx="250" cy="206" r="11" class="tint st-f" stroke-width="1.5"/>
  <rect x="234" y="218" width="32" height="38" rx="14" class="tint st-f" stroke-width="1.5"/>
  <text x="250" y="266" class="t-xs mid ink" font-weight="700">布だけ</text>
  <!-- 子ザルが布にしがみつく -->
  <circle cx="276" cy="230" r="7" class="ink"/>
  <ellipse cx="282" cy="244" rx="9" ry="7" class="ink"/>
  <path d="M120 236 H206" class="st-f" stroke-width="2" marker-end="url(#a-psychology)"/>
  <text x="164" y="226" class="t-xs mid ink halo">長くいたのは布</text>
  <text x="300" y="196" class="t-xs mid fl">ぬくもり</text>
</svg>
