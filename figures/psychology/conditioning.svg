<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 段階の枠 -->
  <rect x="8" y="14" width="344" height="76" rx="14" class="st-line" stroke-width="1.5"/>
  <rect x="8" y="100" width="344" height="76" rx="14" class="st-line" stroke-width="1.5"/>
  <rect x="8" y="186" width="344" height="80" rx="14" class="tint"/>

  <!-- 1 前：ベルだけでは反応しない -->
  <circle cx="34" cy="46" r="13" class="fl"/>
  <text x="34" y="51" class="t-m mid on">1</text>
  <text x="34" y="78" class="t-xs mid soft">前</text>
  <path d="M76 58 C76 30 104 30 104 58 Z M72 58 H108" class="st" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="90" cy="63" r="3.5" class="ink"/>
