<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 判断は、内側のクセ（認知バイアス）と外からの力（同調と服従）で曲がる -->
  <text x="12" y="24" class="t-m ink">判断は、内と外の両方から曲がる</text>

  <rect x="12" y="40" width="112" height="156" rx="12" class="tint st-f" stroke-width="1.5"/>
  <text x="68" y="62" class="t-xs mid soft">頭の中のクセ</text>
  <text x="68" y="84" class="t-s mid fl" font-weight="700">認知バイアス</text>
  <g class="t-xs mid ink">
    <text x="68" y="108">速い直感に頼る</text>
    <text x="68" y="126">合う情報だけ見る</text>
    <text x="68" y="144">最初の数字に</text>
    <text x="68" y="158">引きずられる</text>
    <text x="68" y="176">つじつまを</text>
    <text x="68" y="190">合わせる</text>
  </g>

  <rect x="236" y="40" width="112" height="156" rx="12" class="tint st-f" stroke-width="1.5"/>
  <text x="292" y="62" class="t-xs mid soft">周りからの力</text>
  <text x="292" y="84" class="t-s mid fl" font-weight="700">同調と服従</text>
  <g class="t-xs mid ink">
    <text x="292" y="108">みんなに合わせる</text>
    <text x="292" y="126">権威の指示に</text>
    <text x="292" y="140">従ってしまう</text>
    <text x="292" y="158">大勢いると</text>
    <text x="292" y="172">誰も動かない</text>
  </g>
  <!-- 周りの人々 -->
  <circle cx="265" cy="186" r="4" class="soft"/>
  <circle cx="281" cy="186" r="4" class="soft"/>
  <circle cx="297" cy="186" r="4" class="soft"/>
  <circle cx="313" cy="186" r="4" class="soft"/>

  <circle cx="180" cy="112" r="40" class="fl"/>
  <text x="180" y="110" class="t-m mid on">あなたの</text>
  <text x="180" y="128" class="t-m mid on">判断</text>
  <path d="M126 112 H134" class="st-f" stroke-width="3" marker-end="url(#a-psychology)"/>
  <path d="M234 112 H226" class="st-f" stroke-width="3" marker-end="url(#a-psychology)"/>

  <path d="M180 156 V200" class="st" stroke-width="2" marker-end="url(#a-ink)"/>
  <rect x="12" y="206" width="336" height="62" rx="12" class="bgc"/>
  <text x="180" y="230" class="t-m mid ink" font-weight="700">判断が決まった方向にずれる</text>
  <text x="180" y="252" class="t-xs mid soft">誰にでも起きる。大事な判断ほど時間を置き、反対の声も聞く</text>
</svg>
